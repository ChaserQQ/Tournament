name: Apply v147 mobile operator renewal
on:
  push:
    branches: [codex/v147-mobile-operator-renewal]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply, validate and package
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/v147.patch
          git apply /tmp/v147.patch
          rm -f mini4wd_v146_operator_design_ui_alignment_patch.zip
          python - <<'PY'
          from pathlib import Path
          import re, zipfile
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'BUILD v147 MOBILE OPERATOR RENEWAL PATCH' in s
          assert len(re.findall(r'<script\b',s,re.I)) == len(re.findall(r'</script>',s,re.I))
          assert len(re.findall(r'<style\b',s,re.I)) == len(re.findall(r'</style>',s,re.I))
          with zipfile.ZipFile('mini4wd_v147_mobile_operator_renewal_patch.zip','w',zipfile.ZIP_DEFLATED) as z: z.write('index.html','index.html')
          with zipfile.ZipFile('mini4wd_v147_mobile_operator_renewal_patch.zip') as z: assert z.namelist()==['index.html']
          PY
          rm -f .github/workflows/apply-v147.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html mini4wd_v147_mobile_operator_renewal_patch.zip .github/workflows/apply-v147.yml
          git add -u mini4wd_v146_operator_design_ui_alignment_patch.zip
          git commit -m 'Release v147 mobile operator renewal'
          git push
