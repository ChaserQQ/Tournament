name: Apply v148 PC operator renewal

on:
  push:
    branches:
      - codex/v148-pc-operator-renewal

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v148 patch and package release
        env:
          PATCH_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os, subprocess, zipfile
          patch = gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_B64']))
          with open('.v148.patch', 'wb') as f:
              f.write(patch)
          subprocess.run(['git', 'apply', '--whitespace=nowarn', '.v148.patch'], check=True)
          os.remove('.v148.patch')
          old_zip = 'mini4wd_v147_mobile_operator_renewal_patch.zip'
          if os.path.exists(old_zip):
              os.remove(old_zip)
          new_zip = 'mini4wd_v148_pc_operator_renewal_legacy_cleanup_patch.zip'
          with zipfile.ZipFile(new_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              z.write('index.html', 'index.html')
          with open('index.html', encoding='utf-8') as f:
              html = f.read()
          assert 'BUILD v148 PC OPERATOR RENEWAL + LEGACY CLEANUP PATCH' in html
          assert 'BUILD v147 MOBILE OPERATOR RENEWAL PATCH' not in html
          with zipfile.ZipFile(new_zip) as z:
              assert z.namelist() == ['index.html']
          os.remove('.github/workflows/apply-v148.yml')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v148 PC operator renewal and legacy cleanup"
          git push
