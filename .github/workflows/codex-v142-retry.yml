name: Retry v142 final completion flow

on:
  push:
    branches: [codex/v142-final-completion-flow]
    paths: [.github/workflows/codex-v142-retry.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v142-final-completion-flow
          fetch-depth: 0
      - name: Apply v142
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          def one(old, new, label):
              global h
              n = h.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: {n}')
              h = h.replace(old, new, 1)
          one('<title>MINI4WD TOURNAMENT MAKER · v141 RESET MODE PRESERVATION PATCH</title>\n  <!-- BUILD v141 RESET MODE PRESERVATION PATCH · resetTournament keeps active matchMode; rules unchanged -->', '<title>MINI4WD TOURNAMENT MAKER · v142 FINAL COMPLETION FLOW PATCH</title>\n  <!-- BUILD v142 FINAL COMPLETION FLOW PATCH · finish action appears after final result; rules unchanged -->', 'version')
          css = '''

              /* v142 FINAL COMPLETION FLOW PATCH · operator only */
              body:not(.tv-mode) .tournament-finish-wait-v142 {
                display: inline-flex;
                align-items: center;
                min-height: 34px;
                padding: 7px 10px;
                border: 1px solid rgba(35, 50, 74, .14);
                border-radius: 10px;
                color: #667085;
                background: #f8fafc;
                font-size: 11.5px;
                font-weight: 800;
                line-height: 1.2;
                text-align: left;
              }
              body:not(.tv-mode) .final-complete-actions-v142 {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-top: 14px;
                padding: 12px 14px;
                border: 1px solid rgba(216, 77, 137, .24);
                border-radius: 14px;
                background: rgba(216, 77, 137, .07);
              }
              body:not(.tv-mode) .final-complete-copy-v142 {
                display: grid;
                gap: 3px;
                min-width: 0;
              }
              body:not(.tv-mode) .final-complete-copy-v142 strong {
                color: #182230;
                font-size: 14px;
                line-height: 1.2;
              }
              body:not(.tv-mode) .final-complete-copy-v142 span {
                color: #667085;
                font-size: 11.5px;
                line-height: 1.35;
              }
              body:not(.tv-mode) .final-complete-actions-v142 button {
                flex: 0 0 auto;
                min-height: 36px;
                padding: 8px 16px;
                white-space: nowrap;
              }
              @media (max-width: 760px) {
                body:not(.tv-mode) .final-complete-actions-v142 {
                  align-items: stretch;
                  flex-direction: column;
                }
                body:not(.tv-mode) .final-complete-actions-v142 button {
                  width: 100%;
                }
              }
          '''
          one('\n  </style>', css + '\n  </style>', 'css')
          one('      const status = state.tournament.status || "draft";\n', '      const status = state.tournament.status || "draft";\n      const finalResultReady = isTournamentFinalResultReady();\n      const finishRequirement = getTournamentFinishRequirementText();\n', 'status vars')
          one('          ? "진행 중 · 종료 시 기록 저장 후 새 대회 준비로 전환"', '          ? (finalResultReady ? "최종 결과 확정 · 대회 종료 가능" : `진행 중 · ${finishRequirement}`)', 'status note')
          one('          ? `<button class="primary prep-main-action-v116" onclick="finishTournament()">대회 종료 후 새 대회 준비</button>`', '          ? (finalResultReady\n            ? `<button class="primary prep-main-action-v116" onclick="finishTournament()">대회 종료</button>`\n            : `<span class="tournament-finish-wait-v142">${escapeHtml(finishRequirement)}</span>`)', 'status action')
          finish_anchor = '    function finishTournament() {\n      finishTournamentAsyncV116();\n    }\n\n'
          helpers = '''    function getFinalWinners(finalRace = state.finalRace) {
              return getFinalGroups(finalRace).flatMap(group =>
                (group.slots || []).filter(player =>
                  !player.isEmptyLane && (group.advanceIds || []).includes(player.id)
                )
              );
            }

            function isTournamentFinalResultReady() {
              if (isRevivalMode()) return Boolean(state.qualifierRounds?.[0]?.finalist);
              if (!state.finalRace || state.finalRace.type === "crowSemi") return false;
              return getFinalWinners().length > 0;
            }

            function getTournamentFinishRequirementText() {
              return isRevivalMode()
                ? "결승 우승자 확정 후 종료 가능"
                : "최종 결승 우승자 확정 후 종료 가능";
            }

          '''
          one(finish_anchor, finish_anchor + helpers, 'helpers')
          old_finish = '      if (state.tournament.status !== "running" && !confirm("현재 진행중 상태가 아닙니다. 그래도 종료할까요?")) return;'
          new_finish = '''      if (state.tournament.status === "running" && !isTournamentFinalResultReady()) {
                const message = getTournamentFinishRequirementText();
                showError(message);
                alert(message);
                return;
              }
              if (state.tournament.status === "running" && !confirm("최종 결과를 저장하고 대회를 종료할까요?\\n종료 후 새 대회 준비 상태로 전환됩니다.")) return;
              if (state.tournament.status !== "running" && !confirm("현재 진행중 상태가 아닙니다. 그래도 종료할까요?")) return;'''
          one(old_finish, new_finish, 'finish guard')
          start = h.index('    function renderFinalRace()')
          end = h.index('    function getBroadcastTarget', start)
          segment = h[start:end]
          def seg_one(old, new, label):
              global segment
              n = segment.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: {n}')
              segment = segment.replace(old, new, 1)
          seg_one('      const winners = groups.flatMap(group => group.slots.filter(player => !player.isEmptyLane && (group.advanceIds || []).includes(player.id)));', '      const winners = getFinalWinners();', 'winners')
          seg_one('      const isCrowSemi = state.finalRace.type === "crowSemi";\n', '      const isCrowSemi = state.finalRace.type === "crowSemi";\n      const finishAction = !isCrowSemi && state.tournament.status === "running" && isTournamentFinalResultReady()\n        ? `<div class="final-complete-actions-v142"><div class="final-complete-copy-v142"><strong>최종 결승 종료</strong><span>결과를 저장하고 새 대회 준비 상태로 전환합니다.</span></div><button class="primary" onclick="finishTournament()">대회 종료</button></div>`\n        : "";\n', 'final action')
          seg_one('</span></div>` : ""}</section>`;', '</span></div>` : ""}${finishAction}</section>`;', 'final append')
          h = h[:start] + segment + h[end:]
          one('try { window.__mini4wdV141ResetModePreservationPatch = { build: "BUILD v141 RESET MODE PRESERVATION PATCH", rulesChanged: false }; } catch (_) {}\n', 'try { window.__mini4wdV141ResetModePreservationPatch = { build: "BUILD v141 RESET MODE PRESERVATION PATCH", rulesChanged: false }; } catch (_) {}\n    try { window.__mini4wdV142FinalCompletionFlowPatch = { build: "BUILD v142 FINAL COMPLETION FLOW PATCH", rulesChanged: false }; } catch (_) {}\n', 'runtime')
          p.write_text(h, encoding='utf-8')
      - name: Validate and package
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');const h=fs.readFileSync('index.html','utf8'),f=[];
          [...h.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].forEach((m,i)=>{try{new vm.Script(m[1])}catch(e){f.push(`syntax ${i+1}: ${e.message}`)}});
          const n=[...h.matchAll(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(x=>x[1]);const d=[...new Set(n.filter((x,i)=>n.indexOf(x)!==i))];if(d.length)f.push(`duplicates ${d}`);
          const defs=new Set(n);for(const m of h.matchAll(/\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=/g))defs.add(m[1]);for(const m of h.matchAll(/\bwindow\.([A-Za-z_$][\w$]*)\s*=/g))defs.add(m[1]);
          const ignore=new Set(['if','for','while','switch','catch','function','return','alert','confirm','prompt','parseInt','parseFloat','Number','String','Boolean','Array','Object','Date','Math','JSON','setTimeout','clearTimeout','setInterval','clearInterval','encodeURIComponent','decodeURIComponent','isNaN']),refs=new Set();for(const x of h.matchAll(/\bon(?:click|change|input|submit|keydown|keyup|blur|focus|dblclick|contextmenu)\s*=\s*(["'])([\s\S]*?)\1/gi))for(const m of x[2].matchAll(/(?<![.\w$])([A-Za-z_$][\w$]*)\s*\(/g))if(!ignore.has(m[1]))refs.add(m[1]);const miss=[...refs].filter(x=>!defs.has(x));if(miss.length)f.push(`missing ${miss}`);
          if(/^\s*async\s*$/m.test(h))f.push('standalone async');const so=(h.match(/<script\b/gi)||[]).length,sc=(h.match(/<\/script>/gi)||[]).length,ao=(h.match(/<style\b/gi)||[]).length,ac=(h.match(/<\/style>/gi)||[]).length;if(so!==sc)f.push('script tags');if(ao!==ac)f.push('style tags');if((h.match(/v142 FINAL COMPLETION FLOW PATCH/g)||[]).length<2)f.push('marker');if(!h.includes('function isTournamentFinalResultReady()'))f.push('helper');if(!h.includes('class="final-complete-actions-v142"'))f.push('action');if(f.length)throw Error(f.join('\n'));console.log('PASS');
          NODE
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('mini4wd_v142_final_completion_flow_patch.zip','w',ZIP_DEFLATED) as z:z.write('index.html','index.html')
          with ZipFile('mini4wd_v142_final_completion_flow_patch.zip') as z:
              assert z.namelist()==['index.html']
              assert 'v142 FINAL COMPLETION FLOW PATCH' in z.read('index.html').decode('utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/codex-v142-final-completion.yml .github/workflows/codex-v142-retry.yml
          git config user.name Codex
          git config user.email codex@users.noreply.github.com
          git add index.html mini4wd_v142_final_completion_flow_patch.zip .github/workflows
          git commit -m "feat: show tournament finish after final result"
          git push origin codex/v142-final-completion-flow
