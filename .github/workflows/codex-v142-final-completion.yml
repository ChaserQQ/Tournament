name: Apply v142 final completion flow

on:
  push:
    branches:
      - codex/v142-final-completion-flow
    paths:
      - .github/workflows/codex-v142-final-completion.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v142-final-completion-flow
          fetch-depth: 0

      - name: Apply focused v142 patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global html
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              html = html.replace(old, new, 1)

          replace_once(
              '<title>MINI4WD TOURNAMENT MAKER · v141 RESET MODE PRESERVATION PATCH</title>\n  <!-- BUILD v141 RESET MODE PRESERVATION PATCH · resetTournament keeps active matchMode; rules unchanged -->',
              '<title>MINI4WD TOURNAMENT MAKER · v142 FINAL COMPLETION FLOW PATCH</title>\n  <!-- BUILD v142 FINAL COMPLETION FLOW PATCH · finish action appears after final result; rules unchanged -->',
              "version marker",
          )

          css = '''

              /* v142 FINAL COMPLETION FLOW PATCH · operator only */
              body:not(.tv-mode) .tournament-finish-wait-v142 {
                display: inline-flex;
                align-items: center;
                min-height: 34px;
                padding: 7px 10px;
                border: 1px solid rgba(35, 50, 74, .14);
                border-radius: 10px;
                color: #667085;
                background: #f8fafc;
                font-size: 11.5px;
                font-weight: 800;
                line-height: 1.2;
                text-align: left;
              }
              body:not(.tv-mode) .final-complete-actions-v142 {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-top: 14px;
                padding: 12px 14px;
                border: 1px solid rgba(216, 77, 137, .24);
                border-radius: 14px;
                background: rgba(216, 77, 137, .07);
              }
              body:not(.tv-mode) .final-complete-copy-v142 {
                display: grid;
                gap: 3px;
                min-width: 0;
              }
              body:not(.tv-mode) .final-complete-copy-v142 strong {
                color: #182230;
                font-size: 14px;
                line-height: 1.2;
              }
              body:not(.tv-mode) .final-complete-copy-v142 span {
                color: #667085;
                font-size: 11.5px;
                line-height: 1.35;
              }
              body:not(.tv-mode) .final-complete-actions-v142 button {
                flex: 0 0 auto;
                min-height: 36px;
                padding: 8px 16px;
                white-space: nowrap;
              }
              @media (max-width: 760px) {
                body:not(.tv-mode) .final-complete-actions-v142 {
                  align-items: stretch;
                  flex-direction: column;
                }
                body:not(.tv-mode) .final-complete-actions-v142 button {
                  width: 100%;
                }
              }
          '''
          replace_once("\n  </style>", css + "\n  </style>", "focused CSS")

          replace_once(
              '      const status = state.tournament.status || "draft";\n',
              '      const status = state.tournament.status || "draft";\n      const finalResultReady = isTournamentFinalResultReady();\n      const finishRequirement = getTournamentFinishRequirementText();\n',
              "status helpers",
          )

          replace_once(
              '''const statusNote = status === "draft"
                ? (missing.length ? `시작 전 ${missing.join(" / ")} 입력 필요` : "시작 가능")
                : status === "running"
                  ? "진행 중 · 종료 시 기록 저장 후 새 대회 준비로 전환"
                  : status === "finished"
                    ? "종료됨 · 새 대회 준비 가능"
                    : "저장 완료 · 새 대회 준비 가능";''',
              '''const statusNote = status === "draft"
                ? (missing.length ? `시작 전 ${missing.join(" / ")} 입력 필요` : "시작 가능")
                : status === "running"
                  ? (finalResultReady ? "최종 결과 확정 · 대회 종료 가능" : `진행 중 · ${finishRequirement}`)
                  : status === "finished"
                    ? "종료됨 · 새 대회 준비 가능"
                    : "저장 완료 · 새 대회 준비 가능";''',
              "status note",
          )

          replace_once(
              '''const actionButtons = status === "draft"
                ? `<button class="primary prep-main-action-v116" onclick="startTournament()">대회 시작</button>`
                : status === "running"
                  ? `<button class="primary prep-main-action-v116" onclick="finishTournament()">대회 종료 후 새 대회 준비</button>`
                  : `<button class="primary prep-main-action-v116" onclick="prepareNewTournamentFromFinished()">새 대회 준비</button><button class="ghost prep-sub-action-v116" onclick="reopenTournament()">종료 취소</button>`;''',
              '''const actionButtons = status === "draft"
                ? `<button class="primary prep-main-action-v116" onclick="startTournament()">대회 시작</button>`
                : status === "running"
                  ? (finalResultReady
                    ? `<button class="primary prep-main-action-v116" onclick="finishTournament()">대회 종료</button>`
                    : `<span class="tournament-finish-wait-v142">${escapeHtml(finishRequirement)}</span>`)
                  : `<button class="primary prep-main-action-v116" onclick="prepareNewTournamentFromFinished()">새 대회 준비</button><button class="ghost prep-sub-action-v116" onclick="reopenTournament()">종료 취소</button>`;''',
              "status action",
          )

          replace_once(
              '''    function finishTournament() {
              finishTournamentAsyncV116();
            }

          ''',
              '''    function finishTournament() {
              finishTournamentAsyncV116();
            }

            function getFinalWinners(finalRace = state.finalRace) {
              return getFinalGroups(finalRace).flatMap(group =>
                (group.slots || []).filter(player =>
                  !player.isEmptyLane && (group.advanceIds || []).includes(player.id)
                )
              );
            }

            function isTournamentFinalResultReady() {
              if (isRevivalMode()) return Boolean(state.qualifierRounds?.[0]?.finalist);
              if (!state.finalRace || state.finalRace.type === "crowSemi") return false;
              return getFinalWinners().length > 0;
            }

            function getTournamentFinishRequirementText() {
              return isRevivalMode()
                ? "결승 우승자 확정 후 종료 가능"
                : "최종 결승 우승자 확정 후 종료 가능";
            }

          ''',
              "final result helpers",
          )

          replace_once(
              '''    async function finishTournamentAsyncV116() {
              ensureStateDefaults();
              if (!canModifyTournamentAction("대회 종료")) return;
              if (state.tournament.status !== "running" && !confirm("현재 진행중 상태가 아닙니다. 그래도 종료할까요?")) return;
          ''',
              '''    async function finishTournamentAsyncV116() {
              ensureStateDefaults();
              if (!canModifyTournamentAction("대회 종료")) return;
              if (state.tournament.status === "running" && !isTournamentFinalResultReady()) {
                const message = getTournamentFinishRequirementText();
                showError(message);
                alert(message);
                return;
              }
              if (state.tournament.status === "running" && !confirm("최종 결과를 저장하고 대회를 종료할까요?\\n종료 후 새 대회 준비 상태로 전환됩니다.")) return;
              if (state.tournament.status !== "running" && !confirm("현재 진행중 상태가 아닙니다. 그래도 종료할까요?")) return;
          ''',
              "finish guard",
          )

          old_final = '''    function renderFinalRace() {
              if (!state.finalRace) {
                return `<section class="final-box"><h2>${isCrowMode() ? "9강 최종 준결" : "최종 결승"}</h2><p class="hint">${isCrowMode() ? "각 라운드 결승에서 1~3위를 확정하면 9명 9강 준결을 생성할 수 있습니다." : `${state.settings.laneCount}명의 라운드 결승 진출자가 모두 확정되면 최종 결승을 진행할 수 있습니다.`}</p><div class="finalist-grid">${state.qualifierRounds.map(round => `<div class="finalist-item"><b>${round.title}</b><br>${isCrowMode() ? getCrowRankHtml(round) : (round.finalist ? `${escapeHtml(round.finalist.name)}${round.finalist.team ? " / " + escapeHtml(round.finalist.team) : ""}` : "대기중")}</div>`).join("")}</div><button class="primary" style="margin-top:12px;" onclick="createFinalRace()">${isCrowMode() ? "9강 준결 생성" : "최종 결승 진행"}</button></section>`;
              }
              const groups = getFinalGroups();
              const winners = groups.flatMap(group => group.slots.filter(player => !player.isEmptyLane && (group.advanceIds || []).includes(player.id)));
              const isBroadcast = state.broadcast.mode === "final";
              const isCrowSemi = state.finalRace.type === "crowSemi";
              return `<section class="final-box"><div class="round-head" style="margin-bottom:12px;"><h2>${escapeHtml(state.finalRace.name || "최종 결승")} ${isBroadcast ? `<span class="round-badge live-badge">● TV 송출중</span>` : ""}</h2><div>${isCrowSemi ? `<button class="primary" onclick="createCrowFinalFromSemi()">결승 생성</button>` : ""}</div></div><div class="groups" style="grid-template-columns:${groups.length > 1 ? "repeat(3,minmax(0,1fr))" : "1fr"};">${groups.map(group => renderFinalGroup(group, state.finalRace.type)).join("")}</div>${winners.length ? `<div class="champion"><small>${isCrowSemi ? "9강 SEMI RESULT" : "FINAL RESULT"}</small><strong>${winners.map(p => escapeHtml(p.name)).join(", ")}</strong><span>${isCrowSemi ? "결승 진출자" : winners.length > 1 ? "공동 최종 선정" : "최종 우승자"}</span></div>` : ""}</section>`;
            }

          '''
          new_final = '''    function renderFinalRace() {
              if (!state.finalRace) {
                return `<section class="final-box"><h2>${isCrowMode() ? "9강 최종 준결" : "최종 결승"}</h2><p class="hint">${isCrowMode() ? "각 라운드 결승에서 1~3위를 확정하면 9명 9강 준결을 생성할 수 있습니다." : `${state.settings.laneCount}명의 라운드 결승 진출자가 모두 확정되면 최종 결승을 진행할 수 있습니다.`}</p><div class="finalist-grid">${state.qualifierRounds.map(round => `<div class="finalist-item"><b>${round.title}</b><br>${isCrowMode() ? getCrowRankHtml(round) : (round.finalist ? `${escapeHtml(round.finalist.name)}${round.finalist.team ? " / " + escapeHtml(round.finalist.team) : ""}` : "대기중")}</div>`).join("")}</div><button class="primary" style="margin-top:12px;" onclick="createFinalRace()">${isCrowMode() ? "9강 준결 생성" : "최종 결승 진행"}</button></section>`;
              }
              const groups = getFinalGroups();
              const winners = getFinalWinners();
              const isBroadcast = state.broadcast.mode === "final";
              const isCrowSemi = state.finalRace.type === "crowSemi";
              const finishAction = !isCrowSemi && state.tournament.status === "running" && isTournamentFinalResultReady()
                ? `<div class="final-complete-actions-v142"><div class="final-complete-copy-v142"><strong>최종 결승 종료</strong><span>결과를 저장하고 새 대회 준비 상태로 전환합니다.</span></div><button class="primary" onclick="finishTournament()">대회 종료</button></div>`
                : "";
              return `<section class="final-box"><div class="round-head" style="margin-bottom:12px;"><h2>${escapeHtml(state.finalRace.name || "최종 결승")} ${isBroadcast ? `<span class="round-badge live-badge">● TV 송출중</span>` : ""}</h2><div>${isCrowSemi ? `<button class="primary" onclick="createCrowFinalFromSemi()">결승 생성</button>` : ""}</div></div><div class="groups" style="grid-template-columns:${groups.length > 1 ? "repeat(3,minmax(0,1fr))" : "1fr"};">${groups.map(group => renderFinalGroup(group, state.finalRace.type)).join("")}</div>${winners.length ? `<div class="champion"><small>${isCrowSemi ? "9강 SEMI RESULT" : "FINAL RESULT"}</small><strong>${winners.map(p => escapeHtml(p.name)).join(", ")}</strong><span>${isCrowSemi ? "결승 진출자" : winners.length > 1 ? "공동 최종 선정" : "최종 우승자"}</span></div>` : ""}${finishAction}</section>`;
            }

          '''
          replace_once(old_final, new_final, "final result action")

          replace_once(
              'try { window.__mini4wdV141ResetModePreservationPatch = { build: "BUILD v141 RESET MODE PRESERVATION PATCH", rulesChanged: false }; } catch (_) {}\n',
              'try { window.__mini4wdV141ResetModePreservationPatch = { build: "BUILD v141 RESET MODE PRESERVATION PATCH", rulesChanged: false }; } catch (_) {}\n    try { window.__mini4wdV142FinalCompletionFlowPatch = { build: "BUILD v142 FINAL COMPLETION FLOW PATCH", rulesChanged: false }; } catch (_) {}\n',
              "runtime marker",
          )

          path.write_text(html, encoding="utf-8")

      - name: Verify JavaScript and required invariants
        shell: node {0}
        run: |
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const failures = [];
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(match => match[1]);
          scripts.forEach((script, index) => {
            try { new vm.Script(script, { filename: `inline-${index + 1}.js` }); }
            catch (error) { failures.push(`syntax ${index + 1}: ${error.message}`); }
          });
          const names = [...html.matchAll(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(match => match[1]);
          const duplicates = [...new Set(names.filter((name, index) => names.indexOf(name) !== index))];
          if (duplicates.length) failures.push(`duplicate functions: ${duplicates.join(', ')}`);
          const definitions = new Set(names);
          for (const match of html.matchAll(/\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=/g)) definitions.add(match[1]);
          for (const match of html.matchAll(/\bwindow\.([A-Za-z_$][\w$]*)\s*=/g)) definitions.add(match[1]);
          const ignored = new Set(['if','for','while','switch','catch','function','return','alert','confirm','prompt','parseInt','parseFloat','Number','String','Boolean','Array','Object','Date','Math','JSON','setTimeout','clearTimeout','setInterval','clearInterval','encodeURIComponent','decodeURIComponent','isNaN']);
          const refs = new Set();
          for (const handler of html.matchAll(/\bon(?:click|change|input|submit|keydown|keyup|blur|focus|dblclick|contextmenu)\s*=\s*(["'])([\s\S]*?)\1/gi)) {
            for (const call of handler[2].matchAll(/(?<![.\w$])([A-Za-z_$][\w$]*)\s*\(/g)) if (!ignored.has(call[1])) refs.add(call[1]);
          }
          const missing = [...refs].filter(name => !definitions.has(name));
          if (missing.length) failures.push(`missing inline handlers: ${missing.join(', ')}`);
          if (/^\s*async\s*$/m.test(html)) failures.push('standalone async token');
          const scriptOpen = (html.match(/<script\b/gi) || []).length;
          const scriptClose = (html.match(/<\/script>/gi) || []).length;
          const styleOpen = (html.match(/<style\b/gi) || []).length;
          const styleClose = (html.match(/<\/style>/gi) || []).length;
          if (scriptOpen !== scriptClose) failures.push(`script tags ${scriptOpen}/${scriptClose}`);
          if (styleOpen !== styleClose) failures.push(`style tags ${styleOpen}/${styleClose}`);
          if ((html.match(/v142 FINAL COMPLETION FLOW PATCH/g) || []).length < 2) failures.push('version marker');
          if (!/status\s*===\s*["']running["']\s*&&\s*!isTournamentFinalResultReady\(\)/.test(html)) failures.push('finish guard');
          if (!html.includes('class="final-complete-actions-v142"')) failures.push('final completion action');
          if (failures.length) throw new Error(failures.join('\n'));
          console.log('v142 validation passed');

      - name: Build and verify delivery ZIP
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          zip_path = Path("mini4wd_v142_final_completion_flow_patch.zip")
          with ZipFile(zip_path, "w", ZIP_DEFLATED) as archive:
              archive.write("index.html", "index.html")
          with ZipFile(zip_path) as archive:
              names = archive.namelist()
              if names != ["index.html"]:
                  raise SystemExit(f"unexpected ZIP entries: {names}")
              if "v142 FINAL COMPLETION FLOW PATCH" not in archive.read("index.html").decode("utf-8"):
                  raise SystemExit("ZIP version marker missing")

      - name: Commit generated files
        shell: bash
        run: |
          rm .github/workflows/codex-v142-final-completion.yml
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add index.html mini4wd_v142_final_completion_flow_patch.zip .github/workflows/codex-v142-final-completion.yml
          git commit -m "feat: show tournament finish after final result"
          git push origin codex/v142-final-completion-flow
