name: Apply v146 operator design patch
on:
  push:
    branches:
      - codex/v146-operator-design-ui-alignment
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/v146.patch
          git apply /tmp/v146.patch
          rm -f mini4wd_v145_ui_conflict_cleanup_patch.zip
          python - <<'PY'
          from pathlib import Path
          import re, zipfile
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'BUILD v146 OPERATOR DESIGN + UI ALIGNMENT PATCH' in s
          assert len(re.findall(r'<script\b',s,re.I)) == len(re.findall(r'</script>',s,re.I))
          assert len(re.findall(r'<style\b',s,re.I)) == len(re.findall(r'</style>',s,re.I))
          with zipfile.ZipFile('mini4wd_v146_operator_design_ui_alignment_patch.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write('index.html','index.html')
          with zipfile.ZipFile('mini4wd_v146_operator_design_ui_alignment_patch.zip') as z:
              assert z.namelist() == ['index.html']
          PY
          rm -f .github/workflows/apply-v146.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html mini4wd_v146_operator_design_ui_alignment_patch.zip .github/workflows/apply-v146.yml
          git add -u mini4wd_v145_ui_conflict_cleanup_patch.zip
          git commit -m 'Release v146 operator design and UI alignment'
          git push
