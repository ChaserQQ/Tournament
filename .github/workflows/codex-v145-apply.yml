name: Apply v145 UI conflict cleanup
on:
  push:
    branches: [codex/v145-ui-conflict-cleanup]
    paths: [.github/workflows/codex-v145-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v145-ui-conflict-cleanup
          fetch-depth: 0
      - name: Apply patch
        env:
          PATCH_GZ_B64: 
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/v145.patch
          git apply --check /tmp/v145.patch
          git apply /tmp/v145.patch
      - name: Validate and package
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'); const h=fs.readFileSync('index.html','utf8');
          [...h.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].forEach((m,i)=>new vm.Script(m[1],{filename:`inline-${i}.js`}));
          const names=[...h.matchAll(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(m=>m[1]);
          const dup=[...new Set(names.filter((n,i)=>names.indexOf(n)!==i))];
          const handlers=[...h.matchAll(/\bon(?:click|change|input|submit|keydown|keyup|blur|focus)\s*=\s*["']\s*([A-Za-z_$][\w$]*)\s*\(/gi)].map(m=>m[1]);
          const missing=[...new Set(handlers.filter(n=>!new RegExp(`\\bfunction\\s+${n}\\s*\\(|\\b(?:const|let|var)\\s+${n}\\s*=|\\bwindow\\.${n}\\s*=`).test(h)))];
          if(dup.length||missing.length||!h.includes('v145 UI CONFLICT CLEANUP PATCH')||!h.includes('__mini4wdV145UiConflictCleanupPatch')) process.exit(1);
          NODE
          python - <<'PY'
          from zipfile import ZipFile,ZIP_DEFLATED
          with ZipFile('mini4wd_v145_ui_conflict_cleanup_patch.zip','w',ZIP_DEFLATED) as z:z.write('index.html','index.html')
          with ZipFile('mini4wd_v145_ui_conflict_cleanup_patch.zip') as z:assert z.namelist()==['index.html']
          PY
      - name: Commit
        run: |
          rm .github/workflows/codex-v145-apply.yml
          git config user.name Codex
          git config user.email codex@users.noreply.github.com
          git add -A
          git commit -m "feat: clean up v145 UI conflicts"
          git push origin codex/v145-ui-conflict-cleanup
