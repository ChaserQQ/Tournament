name: Apply v149 surface UI system

on:
  push:
    branches:
      - codex/v149-surface-specific-ui

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v149 patch and package release
        env:
          PATCH_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os, subprocess, zipfile
          patch = gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_B64']))
          with open('.v149.patch', 'wb') as f:
              f.write(patch)
          subprocess.run(['git', 'apply', '--whitespace=nowarn', '.v149.patch'], check=True)
          os.remove('.v149.patch')
          old_zip = 'mini4wd_v148_pc_operator_renewal_legacy_cleanup_patch.zip'
          if os.path.exists(old_zip):
              os.remove(old_zip)
          new_zip = 'mini4wd_v149_surface_specific_ui_system_patch.zip'
          with zipfile.ZipFile(new_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              z.write('index.html', 'index.html')
          with open('index.html', encoding='utf-8') as f:
              html = f.read()
          assert 'BUILD v149 SURFACE-SPECIFIC UI SYSTEM PATCH' in html
          assert 'BUILD v148 PC OPERATOR RENEWAL + LEGACY CLEANUP PATCH' not in html
          assert 'function setUiSurfaceV149' in html
          with zipfile.ZipFile(new_zip) as z:
              assert z.namelist() == ['index.html']
          os.remove('.github/workflows/apply-v149.yml')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v149 surface-specific UI system"
          git push
