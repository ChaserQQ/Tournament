name: Apply v143 UI coherence metric patch

on:
  push:
    branches:
      - codex/v143-ui-coherence-metric
    paths:
      - .github/workflows/codex-v143-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v143-ui-coherence-metric
          fetch-depth: 0

      - name: Apply patch
        run: |
          git apply --check .codex-v143.patch
          git apply .codex-v143.patch

      - name: Validate index
        shell: node {0}
        run: |
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          scripts.forEach((m, i) => new vm.Script(m[1], { filename: `inline-${i + 1}.js` }));
          const names = [...html.matchAll(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(m => m[1]);
          const duplicates = [...new Set(names.filter((name, i) => names.indexOf(name) !== i))];
          const handlers = [...html.matchAll(/\bon(?:click|change|input|submit|keydown|keyup|blur|focus)\s*=\s*["']\s*([A-Za-z_$][\w$]*)\s*\(/gi)].map(m => m[1]);
          const missing = [...new Set(handlers.filter(name => !new RegExp(`\\bfunction\\s+${name}\\s*\\(|\\b(?:const|let|var)\\s+${name}\\s*=|\\bwindow\\.${name}\\s*=`).test(html)))];
          const checks = {
            scripts: (html.match(/<script\b/gi) || []).length === (html.match(/<\/script>/gi) || []).length,
            styles: (html.match(/<style\b/gi) || []).length === (html.match(/<\/style>/gi) || []).length,
            duplicateFunctions: duplicates.length === 0,
            missingInlineHandlers: missing.length === 0,
            standaloneAsync: !/^\s*async\s*$/m.test(html),
            version: html.includes('v143 UI COHERENCE + METRIC PATCH') && html.includes('__mini4wdV143UiCoherenceMetricPatch'),
            scopedUi: html.includes('group-size-control-v143') && html.includes('body.ui-mode-mobile:not(.tv-mode)') && html.includes('body.tv-mode .tv90-result.is-point-v143'),
            metricFix: html.includes('getDashboardPointWinnerKeys') && html.includes('pointWinnerKeys.has(pointWinnerKey)'),
            internalVenueHidden: !html.includes(': [raceText, updated ? `최근 갱신 ${updated}` : "진행중인 LIVE 없음", item.venueId || "대기 상태"]')
          };
          console.log(JSON.stringify(checks));
          if (Object.values(checks).some(value => !value)) {
            console.error({ duplicates, missing });
            process.exit(1);
          }

      - name: Package index only
        shell: python
        run: |
          from zipfile import ZipFile, ZIP_DEFLATED
          target = 'mini4wd_v143_ui_coherence_metric_patch.zip'
          with ZipFile(target, 'w', ZIP_DEFLATED) as archive:
              archive.write('index.html', 'index.html')
          with ZipFile(target) as archive:
              assert archive.namelist() == ['index.html']
              assert archive.read('index.html') == open('index.html', 'rb').read()

      - name: Commit generated release
        run: |
          rm .codex-v143.patch .github/workflows/codex-v143-apply.yml
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve UI coherence and lane metrics"
          git push origin codex/v143-ui-coherence-metric
