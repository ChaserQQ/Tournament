<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini 4WD Tournament Maker</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0b1511;
      --panel: #121e18;
      --panel2: #07100d;
      --panel3: #1b2a22;
      --line: #33483b;
      --text: #eee9df;
      --muted: #cfc8bb;
      --dim: #9e968a;
      --point: #d84d89;
      --point-dark: #160811;
      --danger: #fb7185;
      --gold: #f8d56b;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 86% 12%, rgba(216, 77, 137, .22), transparent 27%),
        radial-gradient(circle at 12% 88%, rgba(216, 77, 137, .11), transparent 32%),
        var(--bg);
      color: var(--text);
    }
    button, input, textarea, select { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel3);
      color: var(--text);
      border-radius: 14px;
      padding: 11px 13px;
      font-weight: 900;
      cursor: pointer;
    }
    button:hover { border-color: var(--point); }
    button.primary, button.active, button.selected {
      background: var(--point);
      color: var(--point-dark);
      border-color: var(--point);
    }
    button.ghost { background: transparent; }
    button.danger { background: transparent; color: #fca5a5; border-color: #7f1d1d; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .wrap { max-width: 1560px; margin: 0 auto; padding: 24px 18px 90px; }
    .header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 28px;
      border: 1px solid rgba(216, 77, 137, .36);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(18, 30, 24, .96), rgba(9, 18, 14, .96));
      margin-bottom: 22px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.2);
    }
    .header::after {
      content: "";
      position: absolute;
      inset: auto -80px -120px auto;
      width: 320px;
      height: 320px;
      border-radius: 999px;
      background: rgba(216, 77, 137, .18);
      filter: blur(40px);
      pointer-events: none;
    }
    .header-copy { position: relative; z-index: 1; min-width: 0; }
    .header-logo {
      position: relative;
      z-index: 1;
      width: clamp(112px, 18vw, 210px);
      max-height: 132px;
      object-fit: contain;
      filter: drop-shadow(0 18px 26px rgba(0,0,0,.42));
    }
    .eyebrow { color: var(--point); font-size: 13px; letter-spacing: .22em; font-weight: 1000; margin-bottom: 8px; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); }
    .maker { color: var(--muted); font-weight: 900; margin-top: 6px; font-size: 14px; }
    .desc { color: var(--muted); line-height: 1.7; max-width: 860px; margin: 10px 0 0; }

    .layout { display: grid; grid-template-columns: 1fr 400px; gap: 20px; align-items: start; }
    .main-area, .side-area { min-width: 0; }
    .card, .round-card, .stage-card {
      border: 1px solid rgba(51,72,59,.9);
      border-radius: 24px;
      background: rgba(18,30,24,.92);
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,.18);
    }
    .card { margin-bottom: 16px; }
    .card h2 { margin: 0 0 14px; font-size: 20px; }
    label { display: block; color: var(--muted); font-size: 14px; font-weight: 900; margin-bottom: 8px; }
    .btnrow { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
    .btnrow.four { grid-template-columns: repeat(4, 1fr); }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    textarea {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel2);
      color: var(--text);
      padding: 14px;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      outline: none;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--point); }
    input[type="number"], select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel2);
      color: var(--text);
      padding: 10px 12px;
      font-weight: 900;
      outline: none;
    }
    input[type="checkbox"] { accent-color: var(--point); transform: scale(1.1); }
    .hint { color: var(--dim); font-size: 13px; line-height: 1.6; margin: 0 0 10px; }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 12px; }
    .stat { background: var(--panel3); border-radius: 16px; padding: 12px; text-align: center; }
    .stat small { display: block; color: var(--dim); font-size: 11px; }
    .stat strong { display: block; font-size: 22px; margin-top: 2px; }
    .error { display:none; border: 1px solid var(--danger); color: #fecdd3; background: rgba(244,63,94,.1); border-radius: 16px; padding: 12px; font-size: 14px; margin-top: 12px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom: 14px; }
    .toolbar .grow { flex: 1; }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 14px;
      padding: 10px;
      background: rgba(7,16,13,.62);
      border: 1px solid var(--line);
      border-radius: 20px;
    }
    .tab-btn {
      display: grid;
      gap: 2px;
      min-width: 150px;
      text-align: left;
      padding: 12px 14px;
    }
    .tab-btn small {
      display: block;
      font-size: 11px;
      font-weight: 900;
      color: inherit;
      opacity: .74;
    }

    .round-card { margin-bottom: 18px; }
    .round-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      flex-wrap:wrap;
      margin-bottom: 14px;
    }
    .round-title { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .round-title h2 { margin:0; font-size: 27px; }
    .round-badge {
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:6px 10px;
      background: var(--panel3);
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }
    .finalist-badge { background: var(--point); color: var(--point-dark); }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(216,77,137,.18);
      color: var(--point);
      border: 1px solid rgba(216,77,137,.45);
    }
    .stage-list { display:grid; gap: 14px; }
    .stage-card { padding: 16px; background: rgba(7,16,13,.76); }
    .stage-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom: 12px;
    }
    .stage-head h3 { margin:0; font-size: 21px; }
    .meta { color: var(--dim); font-size:13px; margin-top:4px; }
    .groups { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px; }
    .group { border:1px solid var(--line); background: var(--panel2); border-radius:20px; padding:14px; }
    .group-title { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
    .group-title strong { font-size:17px; }
    .badge { font-size:11px; color:var(--muted); background:var(--panel3); border-radius:999px; padding:5px 9px; white-space: nowrap; }
    .slot { width:100%; text-align:left; margin-bottom:8px; line-height:1.4; }
    .slot.selected { background:var(--point); color:var(--point-dark); border-color:var(--point); }
    .slot .team { color:inherit; opacity:.72; font-size:12px; font-weight:800; }
    .slot-inner { display:flex; align-items:center; gap:12px; }
    .lane-label {
      flex: 0 0 auto;
      min-width: 76px;
      font-size: 20px;
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -.04em;
      color: var(--point);
    }
    .slot.selected .lane-label { color: var(--point-dark); }
    .player-info { min-width:0; flex:1; }
    .advance-mark { font-size:12px; font-weight:1000; }
    .empty { min-height:360px; display:flex; align-items:center; justify-content:center; text-align:center; border:1px dashed var(--line); border-radius:24px; color:var(--dim); padding: 30px; }
    .final-box {
      border: 1px solid rgba(248,213,107,.45);
      background: linear-gradient(135deg, rgba(248,213,107,.12), rgba(216,77,137,.12));
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .final-box h2 { margin:0 0 12px; font-size: 26px; color: var(--gold); }
    .finalist-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
    .finalist-item { background: var(--panel3); border-radius: 16px; padding: 12px; font-size: 14px; }
    .champion {
      background: var(--point);
      color: var(--point-dark);
      border-radius: 20px;
      padding: 16px;
      margin-top: 12px;
    }
    .champion small { display:block; letter-spacing:.22em; font-weight:1000; }
    .champion strong { display:block; font-size: 32px; margin-top: 2px; }

    /* TV VIEW */
    body.tv-mode { background: #07100d; overflow: hidden; }
    .tv-wrap {
      min-height: 100vh;
      padding: 26px 34px 30px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 16px;
    }
    .tv-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:28px;
      border-bottom: 2px solid rgba(216,77,137,.42);
      padding-bottom: 16px;
    }
    .tv-brand small { display:block; color:var(--point); letter-spacing:.28em; font-size:16px; font-weight:1000; }
    .tv-brand strong { display:block; font-size: clamp(34px, 4.4vw, 70px); line-height:1.05; margin-top: 4px; }
    .tv-brand .maker { font-size: clamp(16px, 1.5vw, 26px); margin-top: 8px; color: var(--muted); }
    .tv-logo { width: min(18vw, 230px); max-height: 130px; object-fit: contain; }
    .tv-controls {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      background: rgba(18,30,24,.8);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 12px;
    }
    .tv-stage { min-height:0; display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:16px; }
    .tv-group {
      min-height: 0;
      border: 2px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(18,30,24,.96), rgba(7,16,13,.96));
      padding: 18px;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }
    .tv-group-title { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .tv-group-title strong { font-size: clamp(26px, 2.8vw, 44px); color:var(--text); }
    .tv-lane {
      display:grid;
      grid-template-columns: 132px 1fr auto;
      align-items:center;
      gap: 14px;
      border-radius: 18px;
      background:#101b16;
      border:1px solid rgba(51,72,59,.9);
      padding: 14px 16px;
    }
    .tv-lane.selected { background: var(--point); color: var(--point-dark); border-color: var(--point); }
    .tv-lane-no { font-size: clamp(28px, 3vw, 48px); font-weight: 1000; letter-spacing:-.06em; color:var(--point); }
    .tv-lane.selected .tv-lane-no { color: var(--point-dark); }
    .tv-player { min-width:0; }
    .tv-player strong { display:block; font-size: clamp(25px, 2.5vw, 42px); line-height:1.12; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tv-player span { display:block; color:inherit; opacity:.72; font-size: clamp(14px, 1.4vw, 22px); font-weight:900; margin-top: 4px; }
    .tv-adv { font-size: clamp(16px, 1.6vw, 24px); font-weight:1000; }
    .tv-foot { display:flex; justify-content:space-between; color:var(--dim); font-size:18px; font-weight:900; }
    .mobile-view { max-width: 720px; margin: 0 auto; padding: 18px; }
    .mobile-view .groups { grid-template-columns: 1fr; }

    @media (max-width: 1240px) {
      .layout { grid-template-columns: 1fr; }
      .side-area { order: 2; }
      .main-area { order: 1; }
      .groups { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 760px) {
      .header { flex-direction: column-reverse; align-items: flex-start; }
      .header-logo { align-self: flex-end; width: 118px; }
      .groups, .finalist-grid { grid-template-columns: 1fr; }
      .btnrow.four { grid-template-columns: repeat(2,1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .tab-btn { min-width: calc(50% - 4px); }
    }

    /* refined layout */
    .toolbar {
      background: rgba(7, 16, 13, .66);
      border: 1px solid rgba(51, 72, 59, .95);
      border-radius: 22px;
      padding: 12px;
      box-shadow: 0 16px 36px rgba(0,0,0,.16);
    }
    .toolbar button { min-height: 44px; }
    .side-area {
      position: sticky;
      top: 18px;
    }
    .card, .round-card, .stage-card, .final-box {
      backdrop-filter: blur(10px);
    }
    .tabs {
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.015), 0 14px 34px rgba(0,0,0,.12);
    }
    .tab-btn {
      border-radius: 16px;
      background: rgba(27, 42, 34, .86);
    }
    .tab-btn.active {
      box-shadow: 0 10px 24px rgba(216,77,137,.22);
    }
    .stage-card {
      border-radius: 22px;
    }
    .group {
      transition: transform .16s ease, border-color .16s ease;
    }
    .group:hover {
      transform: translateY(-1px);
      border-color: rgba(216,77,137,.52);
    }
    .slot {
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .slot:hover {
      transform: translateY(-1px);
    }
    .header-logo {
      background: transparent;
    }

    /* DB page */
    .db-page { max-width: 1480px; margin: 0 auto; padding: 24px 18px 80px; }
    .db-grid { display:grid; grid-template-columns: 420px 1fr; gap:20px; align-items:start; }
    .db-panel-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .db-panel-title h2 { margin:0; }
    .db-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .selected-box { position: sticky; top: 18px; }
    .roster-table-wrap {
      overflow:auto;
      border:1px solid var(--line);
      border-radius:20px;
      background:rgba(7,16,13,.72);
    }
    .roster-table { width:100%; border-collapse: collapse; min-width: 880px; }
    .roster-table th, .roster-table td { border-bottom:1px solid rgba(51,72,59,.8); padding:10px 8px; text-align:left; font-size:14px; vertical-align:middle; }
    .roster-table th { color:var(--muted); font-size:12px; background:var(--panel3); position: sticky; top:0; z-index:1; }
    .roster-table tr:last-child td { border-bottom:0; }
    .roster-table tr:hover td { background:rgba(216,77,137,.065); }
    .pill { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:5px 9px; color:var(--muted); font-size:12px; font-weight:900; }
    .mini-input { min-width:0; width:100%; border:1px solid var(--line); border-radius:12px; background:var(--panel2); color:var(--text); padding:9px 10px; font-weight:800; outline:none; }
    .mini-input:focus { border-color:var(--point); }
    .db-empty { padding:34px; text-align:center; color:var(--dim); }
    .db-stat-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:12px; }
    .db-stat { border:1px solid rgba(51,72,59,.8); border-radius:16px; padding:12px; background:rgba(27,42,34,.8); }
    .db-stat small { display:block; color:var(--dim); font-size:11px; font-weight:900; }
    .db-stat strong { display:block; font-size:22px; margin-top:2px; }
    .page-link {
      color: var(--point);
      font-weight: 1000;
      text-decoration: none;
    }
    .page-link:hover { text-decoration: underline; }

    @media (max-width: 1240px) {
      .side-area { position: static; }
    }
    @media (max-width: 980px) {
      .db-grid { grid-template-columns: 1fr; }
      .selected-box { position: static; }
      .db-stat-grid { grid-template-columns: 1fr; }
    }


    /* visual refinement v6 */
    body {
      font-family: "Pretendard", "Inter", "SUIT", "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      letter-spacing: -0.018em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, textarea, select {
      font-family: inherit;
    }
    button {
      font-size: 14px;
      letter-spacing: -0.015em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }
    button.primary, button.active, button.selected {
      box-shadow: 0 10px 26px rgba(216,77,137,.20), inset 0 1px 0 rgba(255,255,255,.15);
    }
    .header {
      padding: 24px 30px;
      border-radius: 30px;
      background:
        linear-gradient(135deg, rgba(20, 33, 26, .97), rgba(7, 15, 12, .97)),
        radial-gradient(circle at 80% 10%, rgba(216,77,137,.18), transparent 34%);
    }
    .brand-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .eyebrow {
      margin-bottom: 0;
      font-size: 12px;
      letter-spacing: .20em;
      line-height: 1.15;
    }
    .maker {
      margin-top: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .02em;
      opacity: .88;
      white-space: nowrap;
    }
    h1 {
      font-size: clamp(22px, 2.55vw, 34px);
      line-height: 1.15;
      letter-spacing: -0.055em;
      font-weight: 1000;
    }
    .desc {
      font-size: 14px;
      line-height: 1.65;
      color: rgba(207,200,187,.9);
    }
    .card, .round-card, .stage-card, .final-box {
      border-radius: 26px;
      border-color: rgba(72, 94, 78, .72);
      background: linear-gradient(180deg, rgba(18,30,24,.94), rgba(11,21,17,.92));
    }
    .card h2, .final-box h2 {
      font-size: 19px;
      letter-spacing: -0.04em;
      font-weight: 1000;
    }
    .round-title h2 {
      font-size: 28px;
      letter-spacing: -0.055em;
      font-weight: 1000;
    }
    .stage-head h3 {
      font-size: 20px;
      letter-spacing: -0.045em;
      font-weight: 1000;
    }
    label {
      font-size: 13px;
      letter-spacing: -0.02em;
    }
    .hint, .meta {
      font-size: 12.5px;
      line-height: 1.62;
    }
    .tabs {
      padding: 8px;
      gap: 8px;
      border-radius: 22px;
      background: rgba(6, 14, 11, .72);
    }
    .tab-btn {
      min-width: 146px;
      padding: 13px 15px;
      border-radius: 17px;
      font-size: 14px;
    }
    .tab-btn span {
      font-weight: 1000;
      letter-spacing: -0.035em;
    }
    .tab-btn small {
      font-size: 11px;
      margin-top: 2px;
    }
    .group {
      border-radius: 22px;
      padding: 15px;
      background: linear-gradient(180deg, rgba(8,18,14,.96), rgba(4,10,8,.96));
    }
    .group-title strong {
      font-size: 16px;
      letter-spacing: -0.035em;
      font-weight: 1000;
    }
    .slot {
      padding: 11px 12px;
      border-radius: 15px;
      background: rgba(27,42,34,.86);
    }
    .lane-label {
      min-width: 80px;
      font-size: 21px;
      letter-spacing: -0.07em;
    }
    .player-info strong {
      font-size: 15px;
      letter-spacing: -0.035em;
    }
    .slot .team {
      margin-top: 2px;
      font-size: 11.5px;
    }
    .badge, .round-badge, .pill {
      font-size: 11px;
      letter-spacing: -0.01em;
    }
    .stat strong, .db-stat strong {
      font-size: 21px;
      letter-spacing: -0.04em;
    }
    .mini-input, input[type="number"], select, textarea {
      font-size: 13.5px;
      letter-spacing: -0.018em;
    }
    .roster-table th {
      font-size: 11.5px;
      letter-spacing: -0.015em;
    }
    .roster-table td {
      font-size: 13.5px;
    }
    .tv-brand-line {
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .tv-brand small {
      font-size: clamp(13px, 1.1vw, 18px);
      letter-spacing: .24em;
    }
    .tv-brand .maker {
      font-size: clamp(13px, 1.1vw, 18px);
      margin-top: 0;
    }
    .tv-brand strong {
      letter-spacing: -0.06em;
      font-weight: 1000;
    }
    .tv-group {
      border-radius: 28px;
      border-color: rgba(72,94,78,.9);
    }
    .tv-group-title strong {
      letter-spacing: -0.055em;
      font-weight: 1000;
    }
    .tv-player strong {
      letter-spacing: -0.06em;
      font-weight: 1000;
    }
    .tv-lane-no {

    function makeInitialState(laneCount) {

          excludeFinalists: true,

        },
        activeRoundIndex: 0,

        },

    function makeQualifierRounds(laneCount) {
      return Array.from({ length: laneCount }, (_, index) => ({
        id: `qr-${index + 1}`,
        index: index + 1,
        title: `${index + 1}차 라운드`,

    function parseParticipants(text = state.inputText) {
      return text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map((line, index) => {
          const parts = line.includes("/") ? line.split("/") : line.includes("\t") ? line.split("\t") : line.split(",");
          const name = (parts[0] || `참가자 ${index + 1}`).trim();
          const team = (parts[1] || "").trim();
          return { id: `p-${index + 1}-${name}`, name, team };

    function shuffle(array) {
      const result = [...array];
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function collectLaneHistory() {
      const history = new Map();

      function addPlayer(player) {
        if (!player || !player.id || !player.lane) return;
        const key = `${player.id}|${player.lane}`;
        history.set(key, (history.get(key) || 0) + 1);
      }

      state.qualifierRounds.forEach(round => {
        (round.stages || []).forEach(stage => {
          (stage.groups || []).forEach(group => {
            (group.slots || []).forEach(addPlayer);
          });
        });

        state.finalRace.group.slots.forEach(addPlayer);

      const result = [];

      function backtrack(current, used) {
        if (current.length === length) {
          result.push([...current]);
          return;
        }

        shuffle(lanes).forEach(lane => {
          if (used.has(lane)) return;
          used.add(lane);
          current.push(lane);
          backtrack(current, used);
          current.pop();
          used.delete(lane);
        });
      }

      backtrack([], new Set());
      return result;
    }

    function assignLanes(players, laneCount) {
      const lanes = Array.from({ length: laneCount }, (_, index) => index + 1);
      const shuffledPlayers = shuffle(players);

      if (!state.settings.sameLanePrevention) {
        const laneNumbers = shuffle(lanes).slice(0, players.length);
        return shuffledPlayers
          .map((player, index) => ({ ...player, lane: laneNumbers[index] }))
          .sort((a, b) => a.lane - b.lane);
      }

      const history = collectLaneHistory();
      const laneOrders = makeLaneOrders(lanes, shuffledPlayers.length);

      let bestOrder = laneOrders[0] || lanes.slice(0, shuffledPlayers.length);
      let bestScore = Number.POSITIVE_INFINITY;

      laneOrders.forEach(order => {
        const score = order.reduce((sum, lane, index) => {
          const player = shuffledPlayers[index];
          return sum + ((history.get(`${player.id}|${lane}`) || 0) * 100);
        }, 0);

        if (score < bestScore || (score === bestScore && Math.random() < 0.5)) {
          bestScore = score;
          bestOrder = order;
        }
      });

      return shuffledPlayers
        .map((player, index) => ({ ...player, lane: bestOrder[index] }))
        .sort((a, b) => a.lane - b.lane);
    }

    function estimateStageCount(playerCount, laneCount) {
      if (playerCount <= laneCount) return 1;
      let count = playerCount;
      let stages = 0;
      while (count > laneCount) {
        stages += 1;
        count = Math.ceil(count / laneCount);
      }
      return stages + 1;
    }

    function makeStagePlan(playerCount, laneCount) {
      const total = estimateStageCount(playerCount, laneCount);
      const base = ["예선", "본선", "준결승", "라운드 결승"];

      if (total <= 4) return base.slice(4 - total);
      if (total === 5) return ["예선", "본선", "준준결승", "준결승", "라운드 결승"];

      const extraPrelimCount = total - 4;
      const extras = Array.from({ length: extraPrelimCount }, (_, index) => `${index + 1}차 예선`);
      return [...extras, "본선", "준준결승", "준결승", "라운드 결승"];
    }

    function getAttemptCount() {
      const level = state.settings.avoidance;
      if (level === "none") return 1;
      if (level === "low") return 120;
      if (level === "medium") return 500;
      return 1500;
    }

    function scoreGroups(groups) {
      if (state.settings.avoidance === "none") return 0;

      let score = 0;
      groups.forEach(group => {
        const teamCount = new Map();
        group.forEach(p => {
          if (!p || !p.team) return;
          teamCount.set(p.team, (teamCount.get(p.team) || 0) + 1);
        });

        teamCount.forEach(count => {
          if (count >= 2) {
            const pairCount = count * (count - 1) / 2;
            score += pairCount * (state.settings.avoidance === "high" ? 300 : state.settings.avoidance === "medium" ? 180 : 100);
          }
          if (count >= 3) score += count * 200;
        });
      });

      return score;
    }

    function sameTeamGroupCount(groups) {
      return groups.reduce((sum, group) => {
        const map = new Map();
        group.forEach(p => {
          if (!p || !p.team) return;
          map.set(p.team, (map.get(p.team) || 0) + 1);
        });
        return sum + ([...map.values()].some(v => v >= 2) ? 1 : 0);
      }, 0);
    }

    function getForcedGroupCount() {
      const raw = String(state.settings.forcedGroupCount || "").trim();
      if (!raw) return null;
      const value = Number(raw);
      if (!Number.isInteger(value) || value < 1) return null;
      return value;
    }

    function buildCandidateGroups(players, stageName) {
      const laneCount = state.settings.laneCount;
      const forced = stageName === "예선" || stageName.includes("예선") ? getForcedGroupCount() : null;
      const autoGroupCount = Math.ceil(players.length / laneCount);
      const groupCount = Math.max(autoGroupCount, forced || autoGroupCount);
      const groups = Array.from({ length: groupCount }, () => []);

      shuffle(players).forEach(player => {
        const options = groups
          .map((group, index) => ({ group, index }))
          .filter(item => item.group.length < laneCount)
          .map(item => item.index);

        const ranked = shuffle(options).map(index => {
          const temp = groups.map((group, groupIndex) => groupIndex === index ? [...group, player] : [...group]);
          return {
            index,
            score: scoreGroups(temp),
            size: groups[index].length
          };
        }).sort((a, b) => a.score - b.score || a.size - b.size || Math.random() - .5);

        groups[ranked[0].index].push(player);
      });

      return groups.filter(group => group.length > 0);
    }

    function generateStage(players, qualifierIndex, stageIndex, stageName) {
      const laneCount = state.settings.laneCount;
      const tries = players.length <= laneCount ? 1 : getAttemptCount();
      let best = null;
      let bestScore = Infinity;

      for (let i = 0; i < tries; i += 1) {
        const candidate = buildCandidateGroups(players, stageName);
        const score = scoreGroups(candidate);
        if (score < bestScore) {
          best = candidate;
          bestScore = score;
        }
      }

      return {
        id: `q${qualifierIndex}-s${stageIndex}-${Math.random().toString(36).slice(2, 8)}`,
        qualifierIndex,
        stageIndex,
        name: stageName,
        groups: best.map((slots, index) => ({
          id: `q${qualifierIndex}-s${stageIndex}-g${index + 1}-${Math.random().toString(36).slice(2, 8)}`,
          name: `${index + 1}조`,
          slots: assignLanes(slots, laneCount),
          advanceIds: []
        })),
        meta: {
          attempts: tries,
          score: bestScore,
          sameTeam: sameTeamGroupCount(best)
        }
      };
    }

    function getEligibleParticipants() {
      const participants = parseParticipants();
      if (!state.settings.excludeFinalists) return participants;

      const finalizedIds = new Set(
        state.qualifierRounds
          .filter(round => round.finalist)
          .map(round => round.finalist.id)
      );
      return participants.filter(player => !finalizedIds.has(player.id));
    }

    function validateStart(players, stageName = "예선") {
      if (players.length < 2) return "참가자는 최소 2명 이상 필요합니다.";
      if (players.length > 100) return "현재 단일 파일 버전은 100명 이하를 권장합니다.";

      const names = parseParticipants().map(p => p.name);
      const duplicated = [...new Set(names.filter((name, index) => names.indexOf(name) !== index))];
      if (duplicated.length) return "동명이인이 있습니다. 이름 뒤에 번호 등을 붙여 구분하세요: " + duplicated.join(", ");

      const forced = getForcedGroupCount();
      if (forced && (stageName === "예선" || stageName.includes("예선"))) {
        const minimum = Math.ceil(players.length / state.settings.laneCount);
        if (forced < minimum) return `${state.settings.laneCount}레인 기준 현재 참가자는 최소 ${minimum}조 이상 필요합니다.`;
        if (forced > players.length) return `조편성(수동)는 참가자 수 ${players.length}개를 초과할 수 없습니다.`;
      }

      return "";
    }

    function setActiveRound(roundIndex) {
      activeRoundIndex = roundIndex;
      state.activeRoundIndex = roundIndex;

      const round = state.qualifierRounds[roundIndex];
      if (round && round.stages.length) {
        state.broadcast = {
          mode: "stage",
          roundIndex,
          stageIndex: round.stages.length - 1
        };
      }

      renderOperator();
    }

    function startQualifierRound(roundIndex) {
      const round = state.qualifierRounds[roundIndex];
      const players = getEligibleParticipants();
      const error = validateStart(players, "예선");
      if (error) return showError(error);

      const plan = makeStagePlan(players.length, state.settings.laneCount);
      round.stagePlan = plan;
      round.stages = [];
      round.finalist = null;
      round.stages = [generateStage(players, round.index, 1, plan[0])];
      state.finalRace = null;
      state.broadcast = { mode: "stage", roundIndex, stageIndex: 0 };
      activeRoundIndex = roundIndex;
      renderOperator();
    }

    function resetQualifierRound(roundIndex) {
      const round = state.qualifierRounds[roundIndex];
      round.stagePlan = [];
      round.stages = [];
      round.finalist = null;
      state.finalRace = null;

      if (state.broadcast.roundIndex === roundIndex) {
        state.broadcast = { mode: "stage", roundIndex, stageIndex: 0 };
      }

      renderOperator();
    }

    function getSelectedFromStage(stage) {
      const selected = [];
      stage.groups.forEach(group => {
        (group.advanceIds || []).forEach(id => {
          const player = group.slots.find(slot => slot.id === id);
          if (player) selected.push({ id: player.id, name: player.name, team: player.team });
        });
      });
      return selected;
    }

    function getNextStageName(round, nextPlayersCount) {
      if (nextPlayersCount <= state.settings.laneCount) return "라운드 결승";

      const nextIndex = round.stages.length;
      const planned = round.stagePlan[nextIndex];
      if (planned && planned !== "라운드 결승") return planned;

      const dynamicPlan = makeStagePlan(nextPlayersCount, state.settings.laneCount);
      return dynamicPlan[0] === "라운드 결승" ? "준결승" : dynamicPlan[0];
    }

    function createNextStage(roundIndex) {
      const round = state.qualifierRounds[roundIndex];
      if (!round || !round.stages.length) return showError("먼저 해당 라운드를 시작하세요.");

      const lastStage = round.stages[round.stages.length - 1];
      if (lastStage.name === "라운드 결승") return showError("라운드 결승에서는 다음 단계 생성 대신 결승 진출자를 확정하세요.");

      const selected = getSelectedFromStage(lastStage);
      if (selected.length === 0) return showError("다음 단계로 보낼 진출자가 없습니다.");
      if (selected.length === 1) return showError("다음 단계 생성은 진출자 2명 이상부터 가능합니다.");

      const nextName = getNextStageName(round, selected.length);
      round.stages.push(generateStage(selected, round.index, round.stages.length + 1, nextName));
      state.broadcast = { mode: "stage", roundIndex, stageIndex: round.stages.length - 1 };
      activeRoundIndex = roundIndex;
      renderOperator();
      requestAnimationFrame(() => document.getElementById("currentStageTop")?.scrollIntoView({ behavior: "smooth", block: "start" }));
    }

    function confirmRoundFinalist(roundIndex) {
      const round = state.qualifierRounds[roundIndex];
      if (!round || !round.stages.length) return showError("먼저 해당 라운드를 진행하세요.");

      const lastStage = round.stages[round.stages.length - 1];
      if (lastStage.name !== "라운드 결승") return showError("라운드 결승 단계에서만 최종 결승 진출자를 확정할 수 있습니다.");

      const selected = getSelectedFromStage(lastStage);
      if (selected.length === 0) return showError("라운드 결승에서 진출자를 선택하세요.");
      if (selected.length > 1) return showError("각 라운드의 최종 결승 진출자는 1명만 선택해야 합니다.");

      round.finalist = selected[0];
      state.finalRace = null;
      state.broadcast = { mode: "stage", roundIndex, stageIndex: round.stages.length - 1 };
      renderOperator();
    }

    function setBroadcastStage(roundIndex, stageIndex) {
      state.broadcast = { mode: "stage", roundIndex, stageIndex };
      activeRoundIndex = roundIndex;
      renderOperator();
    }

    function toggleAdvance(roundIndex, stageIndex, groupId, playerId) {
      const stage = state.qualifierRounds[roundIndex]?.stages[stageIndex];
      if (!stage) return;
      const group = stage.groups.find(item => item.id === groupId);
      if (!group) return;

      group.advanceIds = group.advanceIds || [];
      if (group.advanceIds.includes(playerId)) {
        group.advanceIds = group.advanceIds.filter(id => id !== playerId);
      } else {
        group.advanceIds.push(playerId);
      }

      state.broadcast = { mode: "stage", roundIndex, stageIndex };
      activeRoundIndex = roundIndex;
      renderOperator();
    }

    function createFinalRace() {
      const finalists = state.qualifierRounds.map(round => round.finalist).filter(Boolean);
      if (finalists.length < state.settings.laneCount) {
        return showError(`${state.settings.laneCount}명의 최종 결승 진출자가 모두 확정되어야 합니다.`);
      }

      state.finalRace = {
        id: `final-${Math.random().toString(36).slice(2, 8)}`,
        name: "최종 결승",
        groupSize: state.settings.laneCount,
        group: {
          id: `final-group-${Math.random().toString(36).slice(2, 8)}`,
          name: "FINAL",
          slots: assignLanes(finalists, state.settings.laneCount),
          advanceIds: []
        }
      };

      state.broadcast = { mode: "final" };
      renderOperator();
    }

    function toggleFinalWinner(playerId) {
      if (!state.finalRace) return;
      const ids = state.finalRace.group.advanceIds || [];
      if (ids.includes(playerId)) {
        state.finalRace.group.advanceIds = ids.filter(id => id !== playerId);
      } else {
        state.finalRace.group.advanceIds = [...ids, playerId];
      }
      state.broadcast = { mode: "final" };
      renderOperator();
    }

    function resetTournament() {
      state.qualifierRounds = makeQualifierRounds(state.settings.laneCount);
      state.finalRace = null;
      state.broadcast = { mode: "stage", roundIndex: 0, stageIndex: 0 };
      activeRoundIndex = 0;
      renderOperator();
    }

    function setLaneCount(laneCount) {
      if (state.qualifierRounds.some(round => round.stages.length) || state.finalRace) {
        if (!confirm("경기 타입을 바꾸면 현재 대진표가 초기화됩니다. 계속할까요?")) return;
      }
      const inputText = state.inputText;
      const avoidance = state.settings.avoidance;
      const forcedGroupCount = state.settings.forcedGroupCount;
      const excludeFinalists = state.settings.excludeFinalists;
      const sameLanePrevention = state.settings.sameLanePrevention;

      state = makeInitialState(laneCount);
      state.inputText = inputText;
      state.settings.avoidance = avoidance;
      state.settings.forcedGroupCount = forcedGroupCount;
      state.settings.excludeFinalists = excludeFinalists;
      state.settings.sameLanePrevention = sameLanePrevention;
      activeRoundIndex = 0;
      renderOperator();
    }

    function setSetting(key, value) {
      state.settings[key] = value;
      renderOperator();
    }

    function refreshInput(value) {
      state.inputText = value;
      const players = parseParticipants();
      const statPlayers = document.getElementById("statPlayers");
      const statGroups = document.getElementById("statGroups");
      if (statPlayers) statPlayers.textContent = players.length;
      if (statGroups) statGroups.textContent = players.length ? Math.ceil(players.length / state.settings.laneCount) : 0;
      saveLiveState();
    }

    function showError(message) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = message ? "block" : "none";
      el.textContent = message;
    }

    function encodePayload(payload) {
      return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    }

    function decodePayload(text) {
      return JSON.parse(decodeURIComponent(escape(atob(text))));
    }

    function getHashParams() {
      const raw = location.hash.startsWith("#") ? location.hash.slice(1) : "";
      return new URLSearchParams(raw);
    }

    function exportState() {
      return {
        settings: state.settings,
        activeRoundIndex,
        broadcast: state.broadcast,
        qualifierRounds: state.qualifierRounds,
        finalRace: state.finalRace,
        updatedAt: state.updatedAt || Date.now()
      };
    }

    function makeSnapshotUrl(view) {
      return `${location.origin}${location.pathname}#view=${view}&data=${encodePayload(exportState())}`;
    }

    function makeLiveTvUrl() {
      return `${location.origin}${location.pathname}#view=tv-live`;
    }

    function openTvView() {
      saveLiveState();
      window.open(makeLiveTvUrl(), "_blank", "noopener,noreferrer");
    }

    function shareMobileView() {
      copyOrShare(makeSnapshotUrl("mobile"), "모바일 공유 링크");
    }

    function copyOrShare(url, label) {
      if (navigator.share) {
        navigator.share({ title: "MINI 4WD TOURNAMENT MAKER", url }).catch(() => copyText(url, label));
      } else {
        copyText(url, label);
      }
    }

    function copyText(url, label) {
      navigator.clipboard?.writeText(url).then(() => {
        alert(`${label}가 복사되었습니다.`);
      }).catch(() => {
        prompt(`${label}를 복사하세요.`, url);
      });
    }

    function startAllFirstStages() {
      const players = getEligibleParticipants();
      const error = validateStart(players, "예선");
      if (error) return showError(error);

      state.qualifierRounds.forEach(round => {
        round.stagePlan = [];
        round.stages = [];
        round.finalist = null;
      });
      state.finalRace = null;

      state.qualifierRounds.forEach((round, index) => {
        const roundPlayers = state.settings.excludeFinalists ? getEligibleParticipants() : parseParticipants();
        const plan = makeStagePlan(roundPlayers.length, state.settings.laneCount);
        round.stagePlan = plan;
        round.stages = [generateStage(roundPlayers, round.index, 1, plan[0])];
      });
      state.broadcast = { mode: "stage", roundIndex: 0, stageIndex: 0 };
      activeRoundIndex = 0;
      renderOperator();
    }

    function renderOperator() {
      document.body.classList.remove("tv-mode");
      saveLiveState();

      const players = parseParticipants();
      const estimatedGroups = players.length ? Math.ceil(players.length / state.settings.laneCount) : 0;
      const finalizedCount = state.qualifierRounds.filter(round => round.finalist).length;
      activeRoundIndex = Math.min(activeRoundIndex, state.qualifierRounds.length - 1);
      const activeRound = state.qualifierRounds[activeRoundIndex];

      app.innerHTML = `
        <div class="wrap">
          <header class="header">
            <div class="header-copy">
              <div class="brand-line">
                <div class="eyebrow">MINI 4WD TOURNAMENT MAKER</div>
                <div class="maker">by GEEKS 마이</div>
              </div>
              <h1>${state.settings.laneCount}레인 토너먼트 대진표</h1>
              <p class="desc">${state.settings.laneCount}레인 기준 총 ${state.settings.laneCount}개의 라운드를 진행하고, 각 라운드 결승 우승자 ${state.settings.laneCount}명이 최종 결승을 진행합니다.</p>
            </div>
            <img class="header-logo" src="${LOGO_SRC}" alt="Geeks logo" />
          </header>

          <div class="layout">

                <button class="ghost" onclick="openDbPage()">PLAYER DB</button>

              <div class="tabs">
                ${state.qualifierRounds.map((round, index) => renderRoundTab(round, index)).join("")}

                <div class="btnrow">
                  <button class="${state.settings.laneCount === 3 ? "active" : ""}" onclick="setLaneCount(3)">3레인</button>

                  TV 화면 탭을 크롬캐스트로 송출하세요.
                </p>
                <div class="finalist-grid" style="grid-template-columns:1fr;">
                  ${renderBroadcastStatus()}
                  <div class="finalist-item"><b>같은 레인 방지</b><br>${state.settings.sameLanePrevention ? "ON" : "OFF"}</div>
                </div>
              </section>
            </aside>
          </div>
        </div>
      `;
    }

    function renderRoundTab(round, index) {
      const status = getRoundStatus(round);
      return `
        <button class="tab-btn ${activeRoundIndex === index ? "active" : ""}" onclick="setActiveRound(${index})">
          <span>${round.title}</span>
          <small>${status}</small>
        </button>
      `;
    }

    function getRoundStatus(round) {
      if (round.finalist) return `확정 · ${round.finalist.name}`;
      if (round.stages.length) return `진행중 · ${round.stages[round.stages.length - 1].name}`;
      return "미진행";
    }

    function renderBroadcastStatus() {
      const target = getBroadcastTarget(state);
      if (!target) return `<div class="finalist-item">현재 송출 대상 없음</div>`;
      return `<div class="finalist-item"><b>현재 TV 송출</b><br>${escapeHtml(target.title)}</div>`;
    }

    function renderActiveRound(round, roundIndex) {
      const currentStageIndex = round.stages.length ? round.stages.length - 1 : -1;
      const currentStage = currentStageIndex >= 0 ? round.stages[currentStageIndex] : null;
      const pastStages = currentStageIndex > 0 ? round.stages.slice(0, currentStageIndex) : [];

      return `
        <section class="round-card">
          <div class="round-head">
            <div>
              <div class="round-title">
                <h2>${escapeHtml(round.title)}</h2>
                <span class="round-badge">${state.settings.laneCount}레인 결승 진출자 선발</span>
                ${round.finalist ? `<span class="round-badge finalist-badge">확정: ${escapeHtml(round.finalist.name)}</span>` : `<span class="round-badge">미확정</span>`}
              </div>
              <div class="meta">
                단계 구조: ${round.stagePlan.length ? round.stagePlan.join(" → ") : makeStagePlan(Math.max(2, parseParticipants().length), state.settings.laneCount).join(" → ")}
              </div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="primary" onclick="startQualifierRound(${roundIndex})">${round.stages.length ? "이 라운드 재추첨" : "이 라운드 시작"}</button>
              <button class="ghost" onclick="createNextStage(${roundIndex})">선택 인원으로 다음 단계</button>
              <button class="ghost" onclick="confirmRoundFinalist(${roundIndex})">결승 진출자 확정</button>
              <button class="danger" onclick="resetQualifierRound(${roundIndex})">초기화</button>
            </div>
          </div>

          ${currentStage ? `
            <div id="currentStageTop" class="current-stage-area">
              <div class="section-label">현재 진행</div>
              ${renderStage(currentStage, roundIndex, currentStageIndex, false)}
            </div>
            ${pastStages.length ? `
              <details class="history-panel">
                <summary>과거 경기 기록 · ${pastStages.length}단계</summary>
                <div class="stage-list history-list">
                  ${pastStages.slice().reverse().map((stage, offset) => {
                    const originalIndex = pastStages.length - 1 - offset;
                    return renderStage(stage, roundIndex, originalIndex, true);
                  }).join("")}
                </div>
              </details>
            ` : ""}
          ` : `<div class="empty"><div><h3>${round.title} 대진이 아직 없습니다</h3><p>이 라운드 시작 버튼으로 예선 또는 첫 단계를 생성하세요.</p></div></div>`}
        </section>
      `;
    }

    function renderStage(stage, roundIndex, stageIndex, isPast = false) {
      const isBroadcast = state.broadcast.mode === "stage" && state.broadcast.roundIndex === roundIndex && state.broadcast.stageIndex === stageIndex;
      return `
        <section class="stage-card ${isPast ? "past-stage" : "current-stage"}">
          <div class="stage-head">
            <div>
              <h3>${escapeHtml(stage.name)} ${isBroadcast ? `<span class="round-badge live-badge">● TV 송출중</span>` : ""}</h3>
              <div class="meta">${stage.groups.length}개 조 · 회피 점수 ${stage.meta.score} · 같은 팀 중복 조 ${stage.meta.sameTeam}개</div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="${isBroadcast ? "primary" : "ghost"}" onclick="setBroadcastStage(${roundIndex}, ${stageIndex})">이 단계 TV 송출</button>
              <span class="badge">후보 생성 ${stage.meta.attempts.toLocaleString()}회</span>
            </div>
          </div>

          ${stage.meta.sameTeam > 0 ? `<div class="error" style="display:block; margin-bottom:12px; border-color:#fb923c; color:#fed7aa; background:rgba(251,146,60,.1);">같은 팀 매칭이 일부 발생했습니다. 참가자 팀 분포상 완전 회피가 어려운 경우입니다.</div>` : ""}

          <div class="groups">
            ${stage.groups.map(group => renderGroup(group, roundIndex, stageIndex)).join("")}
          </div>
        </section>
      `;
    }

    function renderGroup(group, roundIndex, stageIndex) {
      return `
        <article class="group">
          <div class="group-title">
            <strong>${escapeHtml(group.name)}</strong>
            <span class="badge">${group.slots.length}명 경기</span>
          </div>
          ${group.slots.map(player => renderPlayerSlot(player, group, roundIndex, stageIndex)).join("")}
        </article>
      `;
    }

    function renderPlayerSlot(player, group, roundIndex, stageIndex) {
      const selected = (group.advanceIds || []).includes(player.id);
      return `
        <button class="slot ${selected ? "selected" : ""}" onclick="toggleAdvance(${roundIndex}, ${stageIndex}, '${escapeAttr(group.id)}', '${escapeAttr(player.id)}')">
          <div class="slot-inner">
            <span class="lane-label">${player.lane}LANE</span>
            <div class="player-info">
              <strong>${escapeHtml(player.name)}</strong>
              ${player.team ? `<div class="team">${escapeHtml(player.team)}</div>` : ""}
            </div>
            ${selected ? `<span class="advance-mark">진출</span>` : ""}
          </div>
        </button>
      `;
    }

    function renderFinalRace() {
      const finalists = state.qualifierRounds.map(round => round.finalist).filter(Boolean);

      if (!state.finalRace) {
        return `
          <section class="final-box">
            <h2>최종 결승</h2>
            <p class="hint">${state.settings.laneCount}명의 라운드 결승 진출자가 모두 확정되면 최종 결승을 생성할 수 있습니다.</p>
            <div class="finalist-grid">
              ${state.qualifierRounds.map(round => `<div class="finalist-item"><b>${round.title}</b><br>${round.finalist ? `${escapeHtml(round.finalist.name)}${round.finalist.team ? " / " + escapeHtml(round.finalist.team) : ""}` : "미확정"}</div>`).join("")}
            </div>
            <button class="primary" style="margin-top:12px;" onclick="createFinalRace()">FINAL 생성</button>
          </section>
        `;
      }

      const winners = state.finalRace.group.slots.filter(player => state.finalRace.group.advanceIds.includes(player.id));
      const isBroadcast = state.broadcast.mode === "final";

      return `
        <section class="final-box">
          <div class="round-head" style="margin-bottom:12px;">
            <h2>최종 결승 ${isBroadcast ? `<span class="round-badge live-badge">● TV 송출중</span>` : ""}</h2>
            <button class="${isBroadcast ? "primary" : "ghost"}" onclick="state.broadcast={mode:'final'}; renderOperator();">최종 결승 TV 송출</button>
          </div>
          <div class="groups" style="grid-template-columns:1fr;">
            <article class="group">
              <div class="group-title">
                <strong>FINAL</strong>
                <span class="badge">${state.settings.laneCount}레인</span>
              </div>
              ${state.finalRace.group.slots.map(player => {
                const selected = state.finalRace.group.advanceIds.includes(player.id);
                return `
                  <button class="slot ${selected ? "selected" : ""}" onclick="toggleFinalWinner('${escapeAttr(player.id)}')">
                    <div class="slot-inner">
                      <span class="lane-label">${player.lane}LANE</span>
                      <div class="player-info">
                        <strong>${escapeHtml(player.name)}</strong>
                        ${player.team ? `<div class="team">${escapeHtml(player.team)}</div>` : ""}
                      </div>
                      ${selected ? `<span class="advance-mark">최종</span>` : ""}
                    </div>
                  </button>
                `;
              }).join("")}
            </article>
          </div>
          ${winners.length ? `<div class="champion"><small>FINAL RESULT</small><strong>${winners.map(p => escapeHtml(p.name)).join(", ")}</strong><span>${winners.length > 1 ? "공동 최종 선정" : "최종 우승자"}</span></div>` : ""}
        </section>
      `;
    }

    function avoidanceLabel(level) {
      return { none: "없음", low: "낮음", medium: "보통", high: "높음" }[level] || level;
    }

    function getBroadcastTarget(payload) {
      const broadcast = payload.broadcast || { mode: "stage", roundIndex: 0, stageIndex: 0 };

      if (broadcast.mode === "final" && payload.finalRace) {
        return {
          title: "최종 결승",
          laneCount: payload.settings.laneCount,
          groups: [payload.finalRace.group],
          isFinal: true
        };
      }

      const round = payload.qualifierRounds?.[broadcast.roundIndex];
      const stage = round?.stages?.[broadcast.stageIndex];
      if (!round || !stage) {
        const fallbackRound = payload.qualifierRounds?.find(item => item.stages?.length);
        const fallbackStage = fallbackRound?.stages?.[fallbackRound.stages.length - 1];
        if (!fallbackRound || !fallbackStage) return null;
        return {
          title: `${fallbackRound.title} · ${fallbackStage.name}`,
          laneCount: payload.settings.laneCount,
          groups: fallbackStage.groups,
          isFinal: false
        };
      }

      return {
        title: `${round.title} · ${stage.name}`,
        laneCount: payload.settings.laneCount,
        groups: stage.groups,
        isFinal: false
      };
    }

    function renderTvLiveView() {
      document.body.classList.add("tv-mode");

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { tvState = JSON.parse(saved); } catch (error) { tvState = null; }
      }

      if (!tvState) {
        app.innerHTML = `<div class="tv-wrap"><div class="tv-head"><div class="tv-brand"><div class="tv-brand-line"><small>MINI 4WD TOURNAMENT MAKER</small><div class="maker">by GEEKS 마이</div></div><strong>라이브 대기중</strong></div><img class="tv-logo" src="${LOGO_SRC}" alt="Geeks logo" /></div><div class="empty"><h2>운영자 화면에서 대진표를 생성하면 자동 표시됩니다.</h2></div></div>`;
        return;
      }

      renderTvStage();
    }

    function renderTvSnapshot(payload, viewType = "tv") {
      tvState = payload;

      if (viewType === "mobile") {
        document.body.classList.remove("tv-mode");
        app.innerHTML = `
          <div class="mobile-view">
            <header class="header" style="margin-bottom:16px;">
              <div class="header-copy">
                <div class="eyebrow">MINI 4WD TOURNAMENT MAKER</div>
                <div class="maker">by GEEKS 마이</div>
                <h1>모바일 대진표</h1>
                <p class="desc">${payload.settings.laneCount}레인 · ${payload.settings.laneCount}개 라운드 · 최종 결승 진출자 선발 방식</p>
              </div>
              <img class="header-logo" src="${LOGO_SRC}" alt="Geeks logo" />
            </header>
            ${renderReadOnlyPayload(payload)}
          </div>
        `;
        return;
      }

      document.body.classList.add("tv-mode");
      renderTvStage();
    }

    function renderTvStage() {
      const target = getBroadcastTarget(tvState);
      if (!target) {
        app.innerHTML = `<div class="tv-wrap"><div class="tv-head"><div class="tv-brand"><div class="tv-brand-line"><small>MINI 4WD TOURNAMENT MAKER</small><div class="maker">by GEEKS 마이</div></div><strong>대진표 없음</strong></div><img class="tv-logo" src="${LOGO_SRC}" alt="Geeks logo" /></div><div class="empty"><h2>현재 송출할 라운드가 없습니다.</h2></div></div>`;
        return;
      }

      const pages = chunk(target.groups, tvGroupsPerPage);
      if (tvPage >= pages.length) tvPage = 0;
      const currentGroups = pages[tvPage] || [];
      const columns = tvGroupsPerPage <= 4 ? 2 : 3;

      app.innerHTML = `
        <div class="tv-wrap">
          <header class="tv-head">
            <div class="tv-brand">
              <div class="tv-brand-line">
                <small>MINI 4WD TOURNAMENT MAKER</small>
                <div class="maker">by GEEKS 마이</div>
              </div>
              <strong>${escapeHtml(target.title)}</strong>
            </div>
            <img class="tv-logo" src="${LOGO_SRC}" alt="Geeks logo" />
          </header>

          <section class="tv-controls">
            <div>
              <b>LIVE</b> · 운영자 화면 변경사항 자동 반영
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button onclick="tvPrevPage()">이전</button>
              <button onclick="tvNextPage()">다음</button>
              <button onclick="toggleTvAuto()">자동 넘김</button>
              <button class="primary" onclick="document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()">전체화면</button>
            </div>
          </section>

          <main class="tv-stage" style="grid-template-columns: repeat(${columns}, minmax(0,1fr));">
            ${currentGroups.map(group => renderTvGroup(group, target.isFinal)).join("")}
          </main>

          <footer class="tv-foot">
            <span>${target.laneCount} LANE · ${target.groups.length} GROUPS</span>
            <span>PAGE ${tvPage + 1} / ${Math.max(1, pages.length)}</span>
          </footer>
        </div>
      `;
    }

    function renderTvGroup(group, isFinal) {
      return `
        <article class="tv-group">
          <div class="tv-group-title">
            <strong>${escapeHtml(group.name)}</strong>
            <span class="badge">${group.slots.length}명 경기</span>
          </div>
          ${group.slots.map(player => {
            const selected = (group.advanceIds || []).includes(player.id);
            return `
              <div class="tv-lane ${selected ? "selected" : ""}">
                <div class="tv-lane-no">${player.lane}LANE</div>
                <div class="tv-player">
                  <strong>${escapeHtml(player.name)}</strong>
                  ${player.team ? `<span>${escapeHtml(player.team)}</span>` : ""}
                </div>
                <div class="tv-adv">${selected ? (isFinal ? "최종" : "진출") : ""}</div>
              </div>
            `;
          }).join("")}
        </article>
      `;
    }

    function tvNextPage() {
      const target = getBroadcastTarget(tvState);
      if (!target) return;
      const pageCount = Math.max(1, Math.ceil(target.groups.length / tvGroupsPerPage));
      tvPage = (tvPage + 1) % pageCount;
      renderTvStage();
    }

    function tvPrevPage() {
      const target = getBroadcastTarget(tvState);
      if (!target) return;
      const pageCount = Math.max(1, Math.ceil(target.groups.length / tvGroupsPerPage));
      tvPage = (tvPage - 1 + pageCount) % pageCount;
      renderTvStage();
    }

    function toggleTvAuto() {
      if (tvTimer) {
        clearInterval(tvTimer);
        tvTimer = null;
        alert("자동 넘김을 중지했습니다.");
      } else {
        tvTimer = setInterval(tvNextPage, 10000);
        alert("자동 넘김을 시작했습니다. 10초마다 다음 페이지로 이동합니다.");
      }
    }

    function renderReadOnlyPayload(payload) {
      const finalHtml = payload.finalRace ? `
        <section class="final-box">
          <h2>최종 결승</h2>
          <div class="groups" style="grid-template-columns:1fr;">
            ${renderReadOnlyGroup(payload.finalRace.group, true)}
          </div>
        </section>
      ` : "";

      const qualifierHtml = (payload.qualifierRounds || []).map(round => `
        <section class="round-card">
          <div class="round-head">
            <div>
              <div class="round-title">
                <h2>${escapeHtml(round.title)}</h2>
                ${round.finalist ? `<span class="round-badge finalist-badge">확정: ${escapeHtml(round.finalist.name)}</span>` : `<span class="round-badge">미확정</span>`}
              </div>
            </div>
          </div>
          <div class="stage-list">
            ${(round.stages || []).map(stage => `
              <section class="stage-card">
                <div class="stage-head"><div><h3>${escapeHtml(stage.name)}</h3><div class="meta">${stage.groups.length}개 조</div></div></div>
                <div class="groups">
                  ${stage.groups.map(group => renderReadOnlyGroup(group, false)).join("")}
                </div>
              </section>
            `).join("")}
          </div>
        </section>
      `).join("");

      return finalHtml + qualifierHtml;
    }

    function renderReadOnlyGroup(group, isFinal) {
      return `
        <article class="group">
          <div class="group-title"><strong>${escapeHtml(group.name)}</strong><span class="badge">${group.slots.length}명 경기</span></div>
          ${group.slots.map(player => {
            const selected = (group.advanceIds || []).includes(player.id);
            return `
              <div class="slot ${selected ? "selected" : ""}" style="cursor:default;">
                <div class="slot-inner">
                  <span class="lane-label">${player.lane}LANE</span>
                  <div class="player-info">
                    <strong>${escapeHtml(player.name)}</strong>
                    ${player.team ? `<div class="team">${escapeHtml(player.team)}</div>` : ""}
                  </div>
                  ${selected ? `<span class="advance-mark">${isFinal ? "최종" : "진출"}</span>` : ""}
                </div>
              </div>
            `;
          }).join("")}
        </article>
      `;
    }

    function chunk(items, size) {
      const result = [];
      for (let i = 0; i < items.length; i += size) result.push(items.slice(i, i + size));
      return result;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    window.addEventListener("storage", (event) => {
      if (event.key !== STORAGE_KEY || !document.body.classList.contains("tv-mode")) return;
      try {
        tvState = JSON.parse(event.newValue);
        tvPage = 0;
        renderTvStage();
      } catch (error) {}
    });


    function openDbPage() {
      location.hash = "view=db";
      renderDbPage();
    }

    function loadRoster() {
      try {
        const raw = localStorage.getItem(ROSTER_KEY);
        const data = raw ? JSON.parse(raw) : [];
        return Array.isArray(data) ? data : [];
      } catch (error) {
        return [];
      }
    }

    function saveRoster(roster) {
      localStorage.setItem(ROSTER_KEY, JSON.stringify(roster));
    }

    function rosterId() {
      return `roster-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function addRosterPlayer() {
      const name = document.getElementById("dbName")?.value.trim();
      const team = document.getElementById("dbTeam")?.value.trim();
      const nickname = document.getElementById("dbNickname")?.value.trim();
      const memo = document.getElementById("dbMemo")?.value.trim();

      if (!name) {
        alert("선수명을 입력하세요.");
        return;
      }

      const roster = loadRoster();
      const duplicated = roster.find(player => player.name === name && (player.team || "") === (team || ""));
      if (duplicated && !confirm("같은 이름/팀의 선수가 이미 있습니다. 그래도 추가할까요?")) return;

      roster.push({
        id: rosterId(),
        name,
        team: team || "",
        nickname: nickname || "",
        memo: memo || "",
        favorite: false,
        active: true,
        createdAt: new Date().toISOString()
      });

      saveRoster(roster);
      renderDbPage();
    }

    function toggleRosterField(id, field) {
      const roster = loadRoster().map(player => {
        if (player.id !== id) return player;
        return { ...player, [field]: !player[field] };
      });
      saveRoster(roster);
      renderDbPage();
    }

    function deleteRosterPlayer(id) {
      if (!confirm("이 선수를 명부에서 삭제할까요?")) return;
      const roster = loadRoster().filter(player => player.id !== id);
      dbSelectedIds.delete(id);
      saveRoster(roster);
      renderDbPage();
    }

    function updateRosterInline(id, field, value) {
      const roster = loadRoster().map(player => {
        if (player.id !== id) return player;
        return { ...player, [field]: value };
      });
      saveRoster(roster);
    }

    function toggleDbSelected(id, checked) {
      if (checked) dbSelectedIds.add(id);
      else dbSelectedIds.delete(id);
      updateSelectedPreview();
    }

    function updateSelectedPreview() {
      const roster = loadRoster();
      const selected = roster.filter(player => dbSelectedIds.has(player.id));
      const el = document.getElementById("selectedPreview");
      const count = document.getElementById("selectedCount");
      if (count) count.textContent = selected.length;
      if (!el) return;

      if (!selected.length) {
        el.innerHTML = `<div class="hint">선택된 선수가 없습니다.</div>`;
        return;
      }

      el.innerHTML = selected.map(player => `<div class="finalist-item"><b>${escapeHtml(player.name)}</b>${player.team ? ` / ${escapeHtml(player.team)}` : ""}${player.nickname ? `<br><span class="hint">${escapeHtml(player.nickname)}</span>` : ""}</div>`).join("");
    }

    function selectFavoritePlayers() {
      dbSelectedIds = new Set(loadRoster().filter(player => player.favorite && player.active).map(player => player.id));
      renderDbPage();
    }

    function selectRecentPlayers() {
      let ids = [];
      try {
        ids = JSON.parse(localStorage.getItem(RECENT_PARTICIPANTS_KEY) || "[]");
      } catch (error) {
        ids = [];
      }
      dbSelectedIds = new Set(ids);
      renderDbPage();
    }

    function clearSelectedPlayers() {
      dbSelectedIds = new Set();
      renderDbPage();
    }

    function applySelectedPlayersToTournament() {
      const roster = loadRoster();
      const selected = roster.filter(player => dbSelectedIds.has(player.id) && player.active);

      if (!selected.length) {
        alert("오늘 참가자를 선택하세요.");
        return;
      }

      const text = selected.map(player => `${player.name}/${player.team || ""}`).join("\n");
      localStorage.setItem(PENDING_PARTICIPANTS_KEY, text);
      localStorage.setItem(RECENT_PARTICIPANTS_KEY, JSON.stringify(selected.map(player => player.id)));

      state.inputText = text;
      saveLiveState();
      location.hash = "";
      renderOperator();
    }

    function exportRosterCsv() {
      const roster = loadRoster();
      const rows = [["선수명", "팀명", "닉네임", "즐겨찾기", "활성", "메모", "등록일"]];
      roster.forEach(player => {
        rows.push([
          player.name || "",
          player.team || "",
          player.nickname || "",
          player.favorite ? "Y" : "N",
          player.active ? "Y" : "N",
          player.memo || "",
          player.createdAt || ""
        ]);
      });

      downloadTextFile("mini4wd_roster.csv", toCsv(rows));
    }

    function exportRosterJson() {
      downloadTextFile("mini4wd_roster_backup.json", JSON.stringify(loadRoster(), null, 2));
    }

    function importRosterJsonFromText() {
      const text = document.getElementById("importJsonText")?.value.trim();
      if (!text) {
        alert("불러올 JSON 내용을 붙여넣으세요.");
        return;
      }

      try {
        const data = JSON.parse(text);
        if (!Array.isArray(data)) throw new Error("not array");
        const cleaned = data.map(player => ({
          id: player.id || rosterId(),
          name: String(player.name || "").trim(),
          team: String(player.team || "").trim(),
          nickname: String(player.nickname || "").trim(),
          memo: String(player.memo || "").trim(),
          favorite: Boolean(player.favorite),
          active: player.active !== false,
          createdAt: player.createdAt || new Date().toISOString()
        })).filter(player => player.name);

        if (!cleaned.length) {
          alert("불러올 선수가 없습니다.");
          return;
        }

        if (!confirm(`선수 ${cleaned.length}명을 불러옵니다. 기존 명부를 교체할까요?`)) return;
        saveRoster(cleaned);
        dbSelectedIds = new Set();
        renderDbPage();
      } catch (error) {
        alert("JSON 형식이 올바르지 않습니다.");
      }
    }

    function quickImportRosterLines() {
      const text = document.getElementById("quickImportText")?.value.trim();
      if (!text) {
        alert("이름/팀명 목록을 붙여넣으세요.");
        return;
      }

      const current = loadRoster();
      const existingKey = new Set(current.map(player => `${player.name}|${player.team || ""}`));

      const added = text.split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {
          const parts = line.includes("/") ? line.split("/") : line.includes("\t") ? line.split("\t") : line.split(",");
          return {
            name: (parts[0] || "").trim(),
            team: (parts[1] || "").trim()
          };
        })
        .filter(player => player.name)
        .filter(player => {
          const key = `${player.name}|${player.team || ""}`;
          if (existingKey.has(key)) return false;
          existingKey.add(key);
          return true;
        })
        .map(player => ({
          id: rosterId(),
          name: player.name,
          team: player.team,
          nickname: "",
          memo: "",
          favorite: false,
          active: true,
          createdAt: new Date().toISOString()
        }));

      if (!added.length) {
        alert("새로 추가할 선수가 없습니다.");
        return;
      }

      saveRoster([...current, ...added]);
      renderDbPage();
    }

    function setDbSearch(value) {
      dbSearchText = value;
      renderDbPage();
    }

    function setDbTeamFilter(value) {
      dbTeamFilter = value;
      renderDbPage();
    }

    function toCsv(rows) {
      return rows.map(row => row.map(value => {
        const text = String(value ?? "");
        return `"${text.replace(/"/g, '""')}"`;
      }).join(",")).join("\n");
    }

    function downloadTextFile(filename, text) {
      const blob = new Blob(["\ufeff" + text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function renderDbPage() {
      document.body.classList.remove("tv-mode");

      const roster = loadRoster();
      const search = dbSearchText.trim().toLowerCase();
      const teams = Array.from(new Set(roster.map(player => player.team).filter(Boolean))).sort();
      const filtered = roster.filter(player => {
        const matchesSearch = !search || [player.name, player.team, player.nickname, player.memo].some(value => String(value || "").toLowerCase().includes(search));
        const matchesTeam = dbTeamFilter === "전체" || (player.team || "") === dbTeamFilter;
        return matchesSearch && matchesTeam;
      });
      const activeCount = roster.filter(player => player.active).length;
      const favoriteCount = roster.filter(player => player.favorite).length;

      app.innerHTML = `
        <div class="db-page">
          <header class="header">
            <div class="header-copy">
              <div class="brand-line">
                <div class="eyebrow">MINI 4WD TOURNAMENT MAKER</div>
                <div class="maker">by GEEKS 마이</div>
              </div>
              <h1>선수 DB / 오늘 참가자 관리</h1>
              <p class="desc">자주 참가하는 선수를 명부로 저장하고, 오늘 참가자만 선택해서 대진표로 보낼 수 있습니다.</p>
            </div>
            <img class="header-logo" src="${LOGO_SRC}" alt="Geeks logo" />
          </header>

          <div class="toolbar">
            <button class="primary" onclick="location.hash=''; renderOperator();">TOURNAMENT</button>
            <button class="ghost" onclick="exportRosterCsv()">CSV 다운로드</button>
            <button class="ghost" onclick="exportRosterJson()">JSON 백업</button>
          </div>

          <div class="db-grid">
            <aside>
              <section class="card">
                <div class="db-panel-title"><h2>선수 빠른 추가</h2><span class="pill">Roster</span></div>
                <div class="form-grid">
                  <div><label>선수명</label><input class="mini-input" id="dbName" placeholder="홍길동" /></div>
                  <div><label>팀명</label><input class="mini-input" id="dbTeam" placeholder="GEEKS" /></div>
                  <div><label>닉네임</label><input class="mini-input" id="dbNickname" placeholder="마이" /></div>
                  <div><label>메모</label><input class="mini-input" id="dbMemo" placeholder="차량/특이사항" /></div>
                </div>
                <button class="primary" style="width:100%; margin-top:12px;" onclick="addRosterPlayer()">선수 추가</button>
              </section>

              <section class="card selected-box">
                <div class="db-panel-title"><h2>오늘 참가자</h2><span class="pill"><span id="selectedCount">0</span>명 선택</span></div>
                <div class="db-actions" style="margin-bottom:10px;">
                  <button class="ghost" onclick="selectRecentPlayers()">최근 참가자</button>
                  <button class="ghost" onclick="selectFavoritePlayers()">즐겨찾기</button>
                  <button class="ghost" onclick="clearSelectedPlayers()">선택 해제</button>
                </div>
                <div id="selectedPreview" class="finalist-grid" style="grid-template-columns:1fr;"></div>
                <button class="primary" style="width:100%; margin-top:12px;" onclick="applySelectedPlayersToTournament()">선택 선수로 대진 생성 준비</button>
              </section>

              <section class="card">
                <h2>목록 일괄 추가</h2>
                <p class="hint">한 줄에 한 명씩 입력합니다. 형식: 이름/팀명</p>
                <textarea id="quickImportText" style="min-height:150px;" placeholder="홍길동/GEEKS&#10;김철수/A팀"></textarea>
                <button class="ghost" style="width:100%; margin-top:10px;" onclick="quickImportRosterLines()">목록에서 선수 추가</button>
              </section>

              <section class="card">
                <h2>JSON 복원</h2>
                <p class="hint">백업 JSON 내용을 붙여넣으면 기존 선수 명부를 교체합니다.</p>
                <textarea id="importJsonText" style="min-height:130px;"></textarea>
                <button class="danger" style="width:100%; margin-top:10px;" onclick="importRosterJsonFromText()">JSON 불러오기</button>
              </section>
            </aside>

            <main>
              <section class="card">
                <div class="db-panel-title">
                  <div>
                    <h2>선수 명부</h2>
                    <div class="meta">총 ${roster.length}명 · 표시 ${filtered.length}명</div>
                  </div>
                  <div class="db-actions">
                    <input class="mini-input" placeholder="검색" value="${escapeHtml(dbSearchText)}" oninput="setDbSearch(this.value)" style="width:180px;" />
                    <select onchange="setDbTeamFilter(this.value)" style="width:150px;">
                      <option value="전체">전체 팀</option>
                      ${teams.map(team => `<option value="${escapeHtml(team)}" ${team === dbTeamFilter ? "selected" : ""}>${escapeHtml(team)}</option>`).join("")}
                    </select>
                  </div>
                </div>

                <div class="db-stat-grid">
                  <div class="db-stat"><small>전체 선수</small><strong>${roster.length}</strong></div>
                  <div class="db-stat"><small>활성 선수</small><strong>${activeCount}</strong></div>
                  <div class="db-stat"><small>즐겨찾기</small><strong>${favoriteCount}</strong></div>
                </div>

                <div class="roster-table-wrap">
                  <table class="roster-table">
                    <thead>
                      <tr>
                        <th>참가</th>
                        <th>★</th>
                        <th>선수명</th>
                        <th>팀명</th>
                        <th>닉네임</th>
                        <th>상태</th>
                        <th>메모</th>
                        <th>관리</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${filtered.map(player => renderRosterRow(player)).join("") || `<tr><td colspan="8"><div class="db-empty">등록된 선수가 없습니다.</div></td></tr>`}
                    </tbody>
                  </table>
                </div>
              </section>
            </main>
          </div>
        </div>
      `;

      updateSelectedPreview();
    }

    function renderRosterRow(player) {
      return `
        <tr>
          <td data-label="참가"><input type="checkbox" data-roster-select value="${escapeAttr(player.id)}" ${dbSelectedIds.has(player.id) ? "checked" : ""} ${player.active ? "" : "disabled"} onchange="toggleDbSelected('${escapeAttr(player.id)}', this.checked)" /></td>
          <td data-label="즐겨찾기"><button class="ghost" onclick="toggleRosterField('${escapeAttr(player.id)}', 'favorite')">${player.favorite ? "★" : "☆"}</button></td>
          <td data-label="선수명"><input class="mini-input" value="${escapeHtml(player.name)}" onchange="updateRosterInline('${escapeAttr(player.id)}', 'name', this.value)" /></td>
          <td data-label="팀명"><input class="mini-input" value="${escapeHtml(player.team || "")}" onchange="updateRosterInline('${escapeAttr(player.id)}', 'team', this.value)" /></td>
          <td data-label="닉네임"><input class="mini-input" value="${escapeHtml(player.nickname || "")}" onchange="updateRosterInline('${escapeAttr(player.id)}', 'nickname', this.value)" /></td>
          <td data-label="상태"><button class="${player.active ? "primary" : "ghost"}" onclick="toggleRosterField('${escapeAttr(player.id)}', 'active')">${player.active ? "활성" : "비활성"}</button></td>
          <td data-label="메모"><input class="mini-input" value="${escapeHtml(player.memo || "")}" onchange="updateRosterInline('${escapeAttr(player.id)}', 'memo', this.value)" /></td>
          <td data-label="관리"><button class="danger" onclick="deleteRosterPlayer('${escapeAttr(player.id)}')">삭제</button></td>
        </tr>
      `;
    }

    function boot() {
      const params = getHashParams();
      const view = params.get("view");
      const data = params.get("data");

      if (view === "db") {
        renderDbPage();
        return;
      }

      if (view === "tv-live") {
        renderTvLiveView();
        return;
      }

      if ((view === "tv" || view === "mobile") && data) {
        try {
          renderTvSnapshot(decodePayload(data), view);
        } catch (error) {
          app.innerHTML = `<div class="wrap"><div class="empty"><div><h2>공유 데이터를 읽을 수 없습니다</h2><p>링크가 손상되었거나 너무 깁니다.</p></div></div></div>`;
        }
        return;
      }

      const pending = localStorage.getItem(PENDING_PARTICIPANTS_KEY);
      if (pending) {
        state.inputText = pending;
        localStorage.removeItem(PENDING_PARTICIPANTS_KEY);
      }

      renderOperator();
    }

    boot();
  </script>
</body>
</html>
