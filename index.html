<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini 4WD Tournament Maker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 85% 12%, rgba(216, 77, 137, .24), transparent 28%),
        radial-gradient(circle at 10% 85%, rgba(216, 77, 137, .12), transparent 30%),
        #0b1511;
      color: #eee9df;
    }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 28px 18px 80px; }
    .header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 24px 28px;
      border: 1px solid rgba(216, 77, 137, .36);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(18, 30, 24, .96), rgba(9, 18, 14, .96));
      margin-bottom: 22px;
      overflow: hidden;
    }
    .header::after {
      content: "";
      position: absolute;
      inset: auto -80px -120px auto;
      width: 320px;
      height: 320px;
      border-radius: 999px;
      background: rgba(216, 77, 137, .18);
      filter: blur(40px);
      pointer-events: none;
    }
    .header-copy { position: relative; z-index: 1; min-width: 0; }
    .header-logo {
      position: relative;
      z-index: 1;
      width: clamp(112px, 20vw, 210px);
      max-height: 132px;
      object-fit: contain;
      filter: drop-shadow(0 18px 26px rgba(0,0,0,.42));
    }
    .eyebrow { color: #d84d89; font-size: 13px; letter-spacing: .22em; font-weight: 900; margin-bottom: 8px; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); }
    .desc { color: #cfc8bb; line-height: 1.7; max-width: 760px; }
    .grid { display: grid; grid-template-columns: 390px 1fr; gap: 20px; align-items: start; }
    .card {
      border: 1px solid #1b2a22;
      border-radius: 24px;
      background: #121e18;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,.18);
    }
    .card h2 { margin: 0 0 14px; font-size: 20px; }
    label { display: block; color: #cfc8bb; font-size: 14px; font-weight: 800; margin-bottom: 8px; }
    .btnrow { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
    .btnrow.three { grid-template-columns: repeat(3, 1fr); }
    .btnrow.four { grid-template-columns: repeat(4, 1fr); }
    button {
      border: 1px solid #33483b;
      background: #1b2a22;
      color: #eee9df;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 900;
      cursor: pointer;
    }
    button:hover { border-color: #d84d89; }
    button.active { background: #d84d89; color: #0f172a; border-color: #d84d89; }
    button.green { background: #d84d89; color: #160811; border-color: #d84d89; }
    button.danger { background: transparent; color: #fca5a5; border-color: #7f1d1d; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .checkrow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border: 1px solid #33483b;
      background: #1b2a22;
      padding: 13px 14px;
      border-radius: 16px;
      margin-bottom: 14px;
    }
    textarea {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      border: 1px solid #33483b;
      border-radius: 18px;
      background: #07100d;
      color: #eee9df;
      padding: 14px;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      outline: none;
    }
    textarea:focus { border-color: #d84d89; }
    .hint { color: #9e968a; font-size: 13px; line-height: 1.6; margin: 0 0 10px; }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 12px; }
    .stat { background: #1b2a22; border-radius: 16px; padding: 12px; text-align: center; }
    .stat small { display: block; color: #9e968a; font-size: 11px; }
    .stat strong { display: block; font-size: 22px; margin-top: 2px; }
    .error { display:none; border: 1px solid #fb7185; color: #fecdd3; background: rgba(244,63,94,.1); border-radius: 16px; padding: 12px; font-size: 14px; margin-top: 12px; }
    .round { border: 1px solid #1b2a22; background: #121e18; border-radius: 24px; padding: 20px; margin-bottom: 18px; }
    .roundtop { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .round h2 { margin: 0; font-size: 24px; }
    .meta { color:#9e968a; font-size:13px; margin-top:4px; }
    .groups { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px; }
    .group { border:1px solid #33483b; background:#07100d; border-radius:20px; padding:14px; }
    .group-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .group-title strong { font-size:17px; }
    .badge { font-size:11px; color:#cfc8bb; background:#1b2a22; border-radius:999px; padding:5px 9px; }
    .slot {
      width:100%;
      text-align:left;
      margin-bottom:8px;
      line-height:1.4;
    }
    .slot.winner { background:#d84d89; color:#160811; border-color:#d84d89; }
    .slot.bye { color:#64748b; }
    .slot .team { color:inherit; opacity:.72; font-size:12px; font-weight:700; }
    .champion { display:none; background:#d84d89; color:#121e18; border-radius:24px; padding:22px; margin-bottom:18px; }
    .champion small { display:block; letter-spacing:.22em; font-weight:900; }
    .champion strong { display:block; font-size:34px; margin-top:4px; }
    .sticky { position: sticky; bottom: 14px; border:1px solid #33483b; background:rgba(15,23,42,.96); backdrop-filter: blur(8px); border-radius:24px; padding:16px; display:none; justify-content:space-between; align-items:center; gap:12px; }
    .empty { min-height:520px; display:flex; align-items:center; justify-content:center; text-align:center; border:1px dashed #33483b; border-radius:24px; color:#9e968a; }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      .header { align-items: flex-start; }
      .header-logo { width: 120px; }
      .groups { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 620px) {
      .header { flex-direction: column-reverse; }
      .header-logo { align-self: flex-end; width: 118px; }
      .groups { grid-template-columns: 1fr; }
      .btnrow.three, .btnrow.four { grid-template-columns: 1fr; }
      .sticky { flex-direction:column; align-items:stretch; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="header-copy">
        <div class="eyebrow">MINI 4WD TOURNAMENT MAKER</div>
        <h1>3레인 & 5레인 토너먼트 대진표</h1>
        <p class="desc">참가자 명단에 따라 대진표를 자동 생성합니다.</p>
      </div>
      <img class="header-logo" src="geeks-logo.webp" alt="Geeks logo" />
    </header>

    <div class="grid">
      <aside>
        <section class="card">
          <h2>대회 설정</h2>
          <label>경기 타입</label>
          <div class="btnrow">
            <button id="size3" class="active" onclick="setGroupSize(3)">3레인</button>
            <button id="size5" onclick="setGroupSize(5)">5레인</button>
          </div>

          <label>같은 팀 회피 강도</label>
          <div class="btnrow four">
            <button id="avoidNone" onclick="setAvoidance('none')">없음</button>
            <button id="avoidLow" onclick="setAvoidance('low')">낮음</button>
            <button id="avoidMedium" class="active" onclick="setAvoidance('medium')">보통</button>
            <button id="avoidHigh" onclick="setAvoidance('high')">높음</button>
          </div>
        </section>

        <section class="card">
          <h2>참가자 입력</h2>
          <p class="hint">한 줄에 한 명씩 입력합니다. 형식: <b>이름/팀명</b><br>예: 홍길동/타미야팀</p>
          <textarea id="participantInput"></textarea>
          <div class="stats">
            <div class="stat"><small>참가자</small><strong id="statPlayers">0</strong></div>
            <div class="stat"><small>예상 조</small><strong id="statGroups">0</strong></div>
            <div class="stat"><small>BYE</small><strong id="statBye">0</strong></div>
          </div>
          <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="green" style="flex:1" onclick="generateFirstRound()">대진표 생성</button>
            <button class="danger" onclick="resetTournament()">초기화</button>
          </div>
          <div id="error" class="error"></div>
        </section>
      </aside>

      <main>
        <div id="champion" class="champion"></div>
        <div id="output" class="empty">
          <div>
            <h2>아직 생성된 대진표가 없습니다</h2>
            <p>왼쪽에서 참가자와 설정을 확인한 뒤 대진표를 생성하세요.</p>
          </div>
        </div>
        <div id="nextPanel" class="sticky">
          <div>
            <strong>다음 진행</strong><br>
            <span class="hint">각 조 승자를 선택한 뒤 다음 라운드를 생성하세요.</span>
          </div>
          <button class="green" onclick="createNextRound()">다음 라운드 생성</button>
        </div>
      </main>
    </div>
  </div>

  <script>
    const SAMPLE_TEXT = `김철수/A팀
박민수/B팀
이영희/C팀
최준호/D팀
강민재/A팀
정다은/B팀
한지우/C팀
오세훈/D팀
윤서준/A팀
문하린/B팀
배도윤/C팀
신유진/D팀
장현우/E팀
권민서/F팀
임지훈/E팀
홍서연/F팀
조태민/G팀
백나연/H팀
남기준/G팀
서아린/H팀`;

    let groupSize = 3;
    let avoidance = "medium";
    let rounds = [];

    const groupNames = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const input = document.getElementById("participantInput");
    input.value = SAMPLE_TEXT;
    input.addEventListener("input", updateStats);
    document.getElementById("useSeed").addEventListener("change", () => {});
    updateStats();

    function setGroupSize(size) {
      groupSize = size;
      document.getElementById("size3").classList.toggle("active", size === 3);
      document.getElementById("size5").classList.toggle("active", size === 5);
      updateStats();
    }

    function setAvoidance(level) {
      avoidance = level;
      document.getElementById("avoidNone").classList.toggle("active", level === "none");
      document.getElementById("avoidLow").classList.toggle("active", level === "low");
      document.getElementById("avoidMedium").classList.toggle("active", level === "medium");
      document.getElementById("avoidHigh").classList.toggle("active", level === "high");
    }

    function parseParticipants() {
      return input.value
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map((line, index) => {
          const parts = line.includes("/") ? line.split("/") : line.includes("	") ? line.split("	") : line.split(",");
          const name = (parts[0] || `참가자 ${index + 1}`).trim();
          const team = (parts[1] || "").trim();
          return { id: `p-${index + 1}-${name}`, name, team };
        });
    }

    function updateStats() {
      const players = parseParticipants();
      const groupCount = players.length ? Math.ceil(players.length / groupSize) : 0;
      const bye = players.length ? groupCount * groupSize - players.length : 0;
      document.getElementById("statPlayers").textContent = players.length;
      document.getElementById("statGroups").textContent = groupCount;
      document.getElementById("statBye").textContent = bye;
    }

    function showError(message) {
      const el = document.getElementById("error");
      el.style.display = message ? "block" : "none";
      el.textContent = message;
    }

    function shuffle(array) {
      const result = [...array];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function attemptCount() {
      if (avoidance === "none") return 1;
      if (avoidance === "low") return 120;
      if (avoidance === "medium") return 500;
      return 1500;
    }

    function seedGroupOrder(groupCount) {
      const order = [];
      let left = 0;
      let right = groupCount - 1;
      while (left <= right) {
        order.push(left);
        if (left !== right) order.push(right);
        left++;
        right--;
      }
      return order;
    }

    function scoreGroups(groups) {
      let score = 0;
      if (avoidance === "none") return score;
      groups.forEach(group => {
        const teamCount = new Map();
        group.forEach(p => {
          if (!p || !p.team) return;
          teamCount.set(p.team, (teamCount.get(p.team) || 0) + 1);
        });
        teamCount.forEach(count => {
          if (count >= 2) {
            const pairCount = count * (count - 1) / 2;
            score += pairCount * (avoidance === "high" ? 300 : avoidance === "medium" ? 180 : 100);
          }
          if (count >= 3) score += count * 200;
        });
      });

      if (avoidance !== "low") {
        for (let start = 0; start < groups.length; start += groupSize) {
          const block = groups.slice(start, start + groupSize).flat();
          const blockTeamCount = new Map();
          block.forEach(p => {
            if (!p || !p.team) return;
            blockTeamCount.set(p.team, (blockTeamCount.get(p.team) || 0) + 1);
          });
          blockTeamCount.forEach(count => {
            if (count >= 2) score += count * (avoidance === "high" ? 60 : 25);
          });
        }
      }
      return score;
    }

    function buildCandidate(players, roundNumber, useSeed) {
      const groupCount = Math.ceil(players.length / groupSize);
      const groups = Array.from({ length: groupCount }, () => []);

      shuffle(players).forEach(player => {
        const options = groups
          .map((g, i) => ({ group: g, index: i }))
          .filter(x => x.group.length < groupSize)
          .map(x => x.index);

        const ranked = shuffle(options).map(index => {
          const temp = groups.map((g, gi) => gi === index ? [...g, player] : [...g]);
          return { index, score: scoreGroups(temp), size: groups[index].length };
        }).sort((a, b) => a.score - b.score || a.size - b.size || Math.random() - .5);

        groups[ranked[0].index].push(player);
      });

      return groups.map(g => {
        const padded = [...g];
        while (padded.length < groupSize) padded.push(null);
        return padded;
      });
    }

    function sameTeamGroupCount(groups) {
      return groups.reduce((sum, group) => {
        const map = new Map();
        group.forEach(p => {
          if (!p || !p.team) return;
          map.set(p.team, (map.get(p.team) || 0) + 1);
        });
        return sum + ([...map.values()].some(v => v >= 2) ? 1 : 0);
      }, 0);
    }

    function generateRound(players, roundNumber, applySeed) {
      const tries = players.length <= groupSize ? 1 : attemptCount();
      let best = null;
      let bestScore = Infinity;
      for (let i = 0; i < tries; i++) {
        const candidate = buildCandidate(players, roundNumber, applySeed);
        const score = scoreGroups(candidate);
        if (score < bestScore) {
          best = candidate;
          bestScore = score;
        }
      }

      const groups = best.map((slots, index) => {
        const active = slots.filter(Boolean);
        return {
          id: `r${roundNumber}-g${index + 1}-${Math.random().toString(36).slice(2, 8)}`,
          round: roundNumber,
          name: `${groupNames[index] || index + 1}조`,
          slots,
          winnerId: active.length === 1 ? active[0].id : null
        };
      });

      return {
        round: roundNumber,
        groups,
        meta: {
          attempts: tries,
          score: bestScore,
          sameTeam: sameTeamGroupCount(best),
          bye: best.flat().filter(x => x === null).length
        }
      };
    }

    function generateFirstRound() {
      showError("");
      const players = parseParticipants();
      if (players.length < 2) return showError("참가자는 최소 2명 이상 필요합니다.");
      if (players.length > 80) return showError("현재 단일 파일 버전은 80명 이하를 권장합니다.");

      const names = players.map(p => p.name);
      const duplicated = [...new Set(names.filter((name, index) => names.indexOf(name) !== index))];
      if (duplicated.length) return showError("동명이인이 있습니다. 이름 뒤에 번호 등을 붙여 구분하세요: " + duplicated.join(", "));

      rounds = [generateRound(players, 1, false)];
      render();
    }

    function resetTournament() {
      rounds = [];
      showError("");
      document.getElementById("champion").style.display = "none";
      document.getElementById("nextPanel").style.display = "none";
      document.getElementById("output").className = "empty";
      document.getElementById("output").innerHTML = `<div><h2>아직 생성된 대진표가 없습니다</h2><p>왼쪽에서 참가자와 설정을 확인한 뒤 대진표를 생성하세요.</p></div>`;
    }

    function selectWinner(roundIndex, groupId, winnerId) {
      rounds[roundIndex].groups = rounds[roundIndex].groups.map(g => g.id === groupId ? { ...g, winnerId } : g);
      render();
    }

    function createNextRound() {
      showError("");
      const last = rounds[rounds.length - 1];
      const missing = last.groups.filter(g => g.slots.filter(Boolean).length > 1 && !g.winnerId);
      if (missing.length) return showError("승자를 선택하지 않은 조가 있습니다: " + missing.map(g => g.name).join(", "));

      const winners = last.groups
        .map(g => g.slots.find(p => p && p.id === g.winnerId))
        .filter(Boolean);

      if (winners.length <= 1) return showError("이미 우승자가 결정된 상태입니다.");
      rounds.push(generateRound(winners, last.round + 1, false));
      render();
    }

    function playerText(p) {
      if (!p) return "BYE";
      return `${p.name}`;
    }

    function render() {
      const output = document.getElementById("output");
      output.className = "";
      output.innerHTML = rounds.map((round, roundIndex) => {
        const isFinal = round.groups.length === 1;
        const title = isFinal ? "결승" : `${round.round}라운드`;
        const warning = round.meta.sameTeam > 0
          ? `<div class="error" style="display:block; margin-bottom:12px; border-color:#fb923c; color:#fed7aa; background:rgba(251,146,60,.1);">같은 팀 매칭이 일부 발생했습니다. 참가자 팀 분포상 완전 회피가 어려운 경우입니다.</div>`
          : "";

        const groupsHtml = round.groups.map(group => {
          const activeCount = group.slots.filter(Boolean).length;
          const slotsHtml = group.slots.map(p => {
            const isBye = !p;
            const isWinner = p && p.id === group.winnerId;
            const team = p && p.team ? `<div class="team">${p.team}</div>` : "";
            return `<button class="slot ${isBye ? "bye" : ""} ${isWinner ? "winner" : ""}" ${isBye ? "disabled" : ""} onclick="selectWinner(${roundIndex}, '${group.id}', '${p ? p.id : ""}')">
              <strong>${playerText(p)}</strong>${team}${isWinner ? `<span style="float:right;font-size:12px;">WIN</span>` : ""}
            </button>`;
          }).join("");

          return `<article class="group">
            <div class="group-title"><strong>${group.name}</strong><span class="badge">${activeCount}명 경기</span></div>
            ${slotsHtml}
          </article>`;
        }).join("");

        return `<section class="round">
          <div class="roundtop">
            <div>
              <h2>${title}</h2>
              <div class="meta">${round.groups.length}개 조 · 회피 점수 ${round.meta.score} · 같은 팀 중복 조 ${round.meta.sameTeam}개 · BYE ${round.meta.bye}개</div>
            </div>
            <div class="badge">후보 생성 ${round.meta.attempts.toLocaleString()}회</div>
          </div>
          ${warning}
          <div class="groups">${groupsHtml}</div>
        </section>`;
      }).join("");

      document.getElementById("nextPanel").style.display = rounds.length ? "flex" : "none";
      renderChampion();
    }

    function renderChampion() {
      const champ = document.getElementById("champion");
      const last = rounds[rounds.length - 1];
      if (!last || last.groups.length !== 1 || !last.groups[0].winnerId) {
        champ.style.display = "none";
        champ.innerHTML = "";
        return;
      }
      const winner = last.groups[0].slots.find(p => p && p.id === last.groups[0].winnerId);
      if (!winner) {
        champ.style.display = "none";
        return;
      }
      champ.style.display = "block";
      champ.innerHTML = `<small>CHAMPION</small><strong>${winner.name}</strong><span>${winner.team || "소속팀 없음"}</span>`;
    }
  </script>
</body>
</html>
