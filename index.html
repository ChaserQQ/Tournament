  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0b1511;
      --panel: #121e18;
      --panel2: #07100d;
      --panel3: #1b2a22;
      --line: #33483b;
      --text: #eee9df;
      --muted: #cfc8bb;
      --dim: #9e968a;
      --point: #d84d89;
      --point-dark: #160811;
      --danger: #fb7185;
      --gold: #f8d56b;

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        radial-gradient(circle at 12% 88%, rgba(216, 77, 137, .11), transparent 32%),

      color: var(--text);

    button, input, textarea, select { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel3);
      color: var(--text);
      border-radius: 14px;
      padding: 11px 13px;
      font-weight: 900;
      cursor: pointer;
    }
    button:hover { border-color: var(--point); }
    button.primary, button.active, button.selected {
      background: var(--point);
      color: var(--point-dark);
      border-color: var(--point);

    button.ghost { background: transparent; }
    button.danger { background: transparent; color: #fca5a5; border-color: #7f1d1d; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .wrap { max-width: 1560px; margin: 0 auto; padding: 24px 18px 90px; }
    .header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 28px;
      border: 1px solid rgba(216, 77, 137, .36);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(18, 30, 24, .96), rgba(9, 18, 14, .96));
      margin-bottom: 22px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.2);
    }
    .header::after {
      content: "";
      position: absolute;
      inset: auto -80px -120px auto;
      width: 320px;
      height: 320px;
      border-radius: 999px;
      background: rgba(216, 77, 137, .18);
      filter: blur(40px);
      pointer-events: none;

    .header-copy { position: relative; z-index: 1; min-width: 0; }
    .header-logo {
      position: relative;
      z-index: 1;
      width: clamp(112px, 18vw, 210px);
      max-height: 132px;
      object-fit: contain;
      filter: drop-shadow(0 18px 26px rgba(0,0,0,.42));

    .eyebrow { color: var(--point); font-size: 13px; letter-spacing: .22em; font-weight: 1000; margin-bottom: 8px; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); }
    .maker { color: var(--muted); font-weight: 900; margin-top: 6px; font-size: 14px; }
    .desc { color: var(--muted); line-height: 1.7; max-width: 860px; margin: 10px 0 0; }

    .layout { display: grid; grid-template-columns: 1fr 400px; gap: 20px; align-items: start; }
    .main-area, .side-area { min-width: 0; }
    .card, .round-card, .stage-card {
      border: 1px solid rgba(51,72,59,.9);
      border-radius: 24px;
      background: rgba(18,30,24,.92);
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,.18);
    }
    .card { margin-bottom: 16px; }
    .card h2 { margin: 0 0 14px; font-size: 20px; }
    label { display: block; color: var(--muted); font-size: 14px; font-weight: 900; margin-bottom: 8px; }
    .btnrow { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
    .btnrow.four { grid-template-columns: repeat(4, 1fr); }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    textarea {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel2);
      color: var(--text);
      padding: 14px;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      outline: none;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--point); }
    input[type="number"], select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel2);
      color: var(--text);
      padding: 10px 12px;
      font-weight: 900;
      outline: none;

    input[type="checkbox"] { accent-color: var(--point); transform: scale(1.1); }
    .hint { color: var(--dim); font-size: 13px; line-height: 1.6; margin: 0 0 10px; }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 12px; }
    .stat { background: var(--panel3); border-radius: 16px; padding: 12px; text-align: center; }
    .stat small { display: block; color: var(--dim); font-size: 11px; }
    .stat strong { display: block; font-size: 22px; margin-top: 2px; }
    .error { display:none; border: 1px solid var(--danger); color: #fecdd3; background: rgba(244,63,94,.1); border-radius: 16px; padding: 12px; font-size: 14px; margin-top: 12px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom: 14px; }
    .toolbar .grow { flex: 1; }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 14px;
      padding: 10px;
      background: rgba(7,16,13,.62);
      border: 1px solid var(--line);
      border-radius: 20px;
    }
    .tab-btn {
      display: grid;
      gap: 2px;
      min-width: 150px;
      text-align: left;
      padding: 12px 14px;
    }
    .tab-btn small {
      display: block;
      font-size: 11px;
      font-weight: 900;
      color: inherit;
      opacity: .74;
    }

    .round-card { margin-bottom: 18px; }
    .round-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      flex-wrap:wrap;
      margin-bottom: 14px;

    .round-title { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .round-title h2 { margin:0; font-size: 27px; }
    .round-badge {
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:6px 10px;
      background: var(--panel3);
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;

    .finalist-badge { background: var(--point); color: var(--point-dark); }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(216,77,137,.18);
      color: var(--point);
      border: 1px solid rgba(216,77,137,.45);

    .stage-list { display:grid; gap: 14px; }
    .stage-card { padding: 16px; background: rgba(7,16,13,.76); }
    .stage-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom: 12px;
    }
    .stage-head h3 { margin:0; font-size: 21px; }
    .meta { color: var(--dim); font-size:13px; margin-top:4px; }
    .groups { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px; }
    .group { border:1px solid var(--line); background: var(--panel2); border-radius:20px; padding:14px; }
    .group-title { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
    .group-title strong { font-size:17px; }
    .badge { font-size:11px; color:var(--muted); background:var(--panel3); border-radius:999px; padding:5px 9px; white-space: nowrap; }
    .slot { width:100%; text-align:left; margin-bottom:8px; line-height:1.4; }
    .slot.selected { background:var(--point); color:var(--point-dark); border-color:var(--point); }
    .slot .team { color:inherit; opacity:.72; font-size:12px; font-weight:800; }
    .slot-inner { display:flex; align-items:center; gap:12px; }
    .lane-label {
      flex: 0 0 auto;
      min-width: 76px;
      font-size: 20px;
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -.04em;
      color: var(--point);
    }
    .slot.selected .lane-label { color: var(--point-dark); }
    .player-info { min-width:0; flex:1; }
    .advance-mark { font-size:12px; font-weight:1000; }
    .empty { min-height:360px; display:flex; align-items:center; justify-content:center; text-align:center; border:1px dashed var(--line); border-radius:24px; color:var(--dim); padding: 30px; }
    .final-box {
      border: 1px solid rgba(248,213,107,.45);
      background: linear-gradient(135deg, rgba(248,213,107,.12), rgba(216,77,137,.12));
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 18px;

    .final-box h2 { margin:0 0 12px; font-size: 26px; color: var(--gold); }
    .finalist-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
    .finalist-item { background: var(--panel3); border-radius: 16px; padding: 12px; font-size: 14px; }
    .champion {
      background: var(--point);
      color: var(--point-dark);
      border-radius: 20px;
      padding: 16px;
      margin-top: 12px;
    }
    .champion small { display:block; letter-spacing:.22em; font-weight:1000; }
    .champion strong { display:block; font-size: 32px; margin-top: 2px; }

    /* TV VIEW */
    body.tv-mode { background: #07100d; overflow: hidden; }
    .tv-wrap {
      min-height: 100vh;
      padding: 26px 34px 30px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 16px;
    }
    .tv-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:28px;
      border-bottom: 2px solid rgba(216,77,137,.42);
      padding-bottom: 16px;
    }
    .tv-brand small { display:block; color:var(--point); letter-spacing:.28em; font-size:16px; font-weight:1000; }
    .tv-brand strong { display:block; font-size: clamp(34px, 4.4vw, 70px); line-height:1.05; margin-top: 4px; }
    .tv-brand .maker { font-size: clamp(16px, 1.5vw, 26px); margin-top: 8px; color: var(--muted); }
    .tv-logo { width: min(18vw, 230px); max-height: 130px; object-fit: contain; }
    .tv-controls {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      background: rgba(18,30,24,.8);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 12px;
    }
    .tv-stage { min-height:0; display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:16px; }
    .tv-group {
      min-height: 0;
      border: 2px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(18,30,24,.96), rgba(7,16,13,.96));
      padding: 18px;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }
    .tv-group-title { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .tv-group-title strong { font-size: clamp(26px, 2.8vw, 44px); color:var(--text); }
    .tv-lane {
      display:grid;
      grid-template-columns: 132px 1fr auto;
      align-items:center;
      gap: 14px;
      border-radius: 18px;
      background:#101b16;
      border:1px solid rgba(51,72,59,.9);
      padding: 14px 16px;
    }
    .tv-lane.selected { background: var(--point); color: var(--point-dark); border-color: var(--point); }
    .tv-lane-no { font-size: clamp(28px, 3vw, 48px); font-weight: 1000; letter-spacing:-.06em; color:var(--point); }
    .tv-lane.selected .tv-lane-no { color: var(--point-dark); }
    .tv-player { min-width:0; }
    .tv-player strong { display:block; font-size: clamp(25px, 2.5vw, 42px); line-height:1.12; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tv-player span { display:block; color:inherit; opacity:.72; font-size: clamp(14px, 1.4vw, 22px); font-weight:900; margin-top: 4px; }
    .tv-adv { font-size: clamp(16px, 1.6vw, 24px); font-weight:1000; }
    .tv-foot { display:flex; justify-content:space-between; color:var(--dim); font-size:18px; font-weight:900; }
    .mobile-view { max-width: 720px; margin: 0 auto; padding: 18px; }

      .groups { grid-template-columns: repeat(2, minmax(0,1fr)); }

    @media (max-width: 760px) {

      .header-logo { align-self: flex-end; width: 118px; }
      .groups, .finalist-grid { grid-template-columns: 1fr; }
      .btnrow.four { grid-template-columns: repeat(2,1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .tab-btn { min-width: calc(50% - 4px); }

    /* refined layout */
    .toolbar {
      background: rgba(7, 16, 13, .66);
      border: 1px solid rgba(51, 72, 59, .95);
      border-radius: 22px;
      padding: 12px;
      box-shadow: 0 16px 36px rgba(0,0,0,.16);

    .toolbar button { min-height: 44px; }
    .side-area {
      position: sticky;

    .card, .round-card, .stage-card, .final-box {

    .stage-card {
      border-radius: 22px;

    .group {
      transition: transform .16s ease, border-color .16s ease;
    }
    .group:hover {
      transform: translateY(-1px);
      border-color: rgba(216,77,137,.52);
    }
    .slot {
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .slot:hover {
      transform: translateY(-1px);
    }
    .header-logo {
      background: transparent;
    }

    /* DB page */
    .db-page { max-width: 1480px; margin: 0 auto; padding: 24px 18px 80px; }
    .db-grid { display:grid; grid-template-columns: 420px 1fr; gap:20px; align-items:start; }
    .db-panel-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .db-panel-title h2 { margin:0; }
    .db-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .selected-box { position: sticky; top: 18px; }
    .roster-table-wrap {
      overflow:auto;
      border:1px solid var(--line);
      border-radius:20px;
      background:rgba(7,16,13,.72);
    }
    .roster-table { width:100%; border-collapse: collapse; min-width: 880px; }
    .roster-table th, .roster-table td { border-bottom:1px solid rgba(51,72,59,.8); padding:10px 8px; text-align:left; font-size:14px; vertical-align:middle; }
    .roster-table th { color:var(--muted); font-size:12px; background:var(--panel3); position: sticky; top:0; z-index:1; }

    .roster-table tr:hover td { background:rgba(216,77,137,.065); }
    .pill { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:5px 9px; color:var(--muted); font-size:12px; font-weight:900; }
    .mini-input { min-width:0; width:100%; border:1px solid var(--line); border-radius:12px; background:var(--panel2); color:var(--text); padding:9px 10px; font-weight:800; outline:none; }
    .mini-input:focus { border-color:var(--point); }
    .db-empty { padding:34px; text-align:center; color:var(--dim); }
    .db-stat-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:12px; }
    .db-stat { border:1px solid rgba(51,72,59,.8); border-radius:16px; padding:12px; background:rgba(27,42,34,.8); }
    .db-stat small { display:block; color:var(--dim); font-size:11px; font-weight:900; }
    .db-stat strong { display:block; font-size:22px; margin-top:2px; }
    .page-link {
      color: var(--point);
      font-weight: 1000;
      text-decoration: none;
    }
    .page-link:hover { text-decoration: underline; }

    @media (max-width: 1240px) {
      .side-area { position: static; }
    }
    @media (max-width: 980px) {
      .db-grid { grid-template-columns: 1fr; }
      .selected-box { position: static; }
      .db-stat-grid { grid-template-columns: 1fr; }
    }

        activeRoundIndex: 0,
        broadcast: {
          mode: "stage",
          roundIndex: 0,
          stageIndex: 0
        },
        qualifierRounds: makeQualifierRounds(laneCount, "basic"),
        finalRace: null,
        updatedAt: Date.now()
      };
    }

    function makeQualifierRounds(laneCount, matchMode = "basic") {
      if (matchMode === "revival") {
        return [{
          id: "revival-main",
          index: 1,
          title: "패자부활 토너먼트",
          stagePlan: [],
          stages: [],
          finalist: null
        }];
      }

      return Array.from({ length: laneCount }, (_, index) => ({
        id: `qr-${index + 1}`,
        index: index + 1,
        title: `${index + 1}차 라운드`,
        stagePlan: [],
        stages: [],
        finalist: null
      }));
    }

    function saveLiveState() {
      state.updatedAt = Date.now();
      state.activeRoundIndex = activeRoundIndex;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(exportState()));
    }

    function parseParticipants(text = state.inputText) {
      return text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map((line, index) => {
          const parts = line.includes("/") ? line.split("/") : line.includes("\t") ? line.split("\t") : line.split(",");
          const name = (parts[0] || `참가자 ${index + 1}`).trim();
          const team = (parts[1] || "").trim();
          return { id: `p-${index + 1}-${name}`, name, team };
        });
    }

    function shuffle(array) {
      const result = [...array];
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function collectLaneHistory() {
      const history = new Map();

      function addPlayer(player) {
        if (!player || !player.id || !player.lane || player.isEmptyLane) return;
        const key = `${player.id}|${player.lane}`;
        history.set(key, (history.get(key) || 0) + 1);
      }

      state.qualifierRounds.forEach(round => {
        (round.stages || []).forEach(stage => {
          (stage.groups || []).forEach(group => {
            (group.slots || []).forEach(addPlayer);
          });
        });
      });

      if (state.finalRace?.group?.slots) {
        state.finalRace.group.slots.forEach(addPlayer);
      }

      return history;
    }

    function makeLaneOrders(lanes, length) {
      const result = [];

      function backtrack(current, used) {
        if (current.length === length) {
          result.push([...current]);
          return;
        }

        shuffle(lanes).forEach(lane => {
          if (used.has(lane)) return;
          used.add(lane);
          current.push(lane);
          backtrack(current, used);
          current.pop();
          used.delete(lane);
        });
      }

      backtrack([], new Set());
      return result;
    }

    function assignLanes(players, laneCount) {
      const lanes = Array.from({ length: laneCount }, (_, index) => index + 1);
      const shuffledPlayers = shuffle(players);
      let assignedPlayers = [];

      if (!state.settings.sameLanePrevention) {
        const laneNumbers = shuffle(lanes).slice(0, players.length);
        assignedPlayers = shuffledPlayers.map((player, index) => ({ ...player, lane: laneNumbers[index] }));
      } else {
        const history = collectLaneHistory();
        const laneOrders = makeLaneOrders(lanes, shuffledPlayers.length);
        let bestOrder = laneOrders[0] || lanes.slice(0, shuffledPlayers.length);
        let bestScore = Number.POSITIVE_INFINITY;

        laneOrders.forEach(order => {
          const score = order.reduce((sum, lane, index) => {
            const player = shuffledPlayers[index];
            return sum + ((history.get(`${player.id}|${lane}`) || 0) * 100);
          }, 0);

          if (score < bestScore || (score === bestScore && Math.random() < 0.5)) {
            bestScore = score;
            bestOrder = order;
          }
        });

        assignedPlayers = shuffledPlayers.map((player, index) => ({ ...player, lane: bestOrder[index] }));
      }

      const assignedByLane = new Map(assignedPlayers.map(player => [player.lane, player]));

      return lanes.map(lane => assignedByLane.get(lane) || {
        id: `empty-lane-${lane}-${Math.random().toString(36).slice(2, 8)}`,
        name: "빈 레인",
        team: "",
        lane,
        isEmptyLane: true
      });
    }

    function estimateStageCount(playerCount, laneCount) {
      if (playerCount <= laneCount) return 1;
      let count = playerCount;
      let stages = 0;
      while (count > laneCount) {
        stages += 1;
        count = Math.ceil(count / laneCount);
      }
      return stages + 1;
    }

    function makeStagePlan(playerCount, laneCount) {
      const total = estimateStageCount(playerCount, laneCount);
      const base = ["예선", "본선", "준결승", "라운드 결승"];

      if (total <= 4) return base.slice(4 - total);
      if (total === 5) return ["예선", "본선", "준준결승", "준결승", "라운드 결승"];

      const extraPrelimCount = total - 4;
      const extras = Array.from({ length: extraPrelimCount }, (_, index) => `${index + 1}차 예선`);
      return [...extras, "본선", "준준결승", "준결승", "라운드 결승"];
    }

    function getAttemptCount() {
      const level = state.settings.avoidance;
      if (level === "none") return 1;
      if (level === "low") return 120;
      if (level === "medium") return 500;
      return 1500;
    }

    function scoreGroups(groups) {
      if (state.settings.avoidance === "none") return 0;

      let score = 0;
      groups.forEach(group => {
        const teamCount = new Map();
        group.forEach(p => {
          if (!p || !p.team) return;
          teamCount.set(p.team, (teamCount.get(p.team) || 0) + 1);
        });

        teamCount.forEach(count => {
          if (count >= 2) {
            const pairCount = count * (count - 1) / 2;
            score += pairCount * (state.settings.avoidance === "high" ? 300 : state.settings.avoidance === "medium" ? 180 : 100);
          }
          if (count >= 3) score += count * 200;
        });
      });

      return score;
    }

    function sameTeamGroupCount(groups) {
      return groups.reduce((sum, group) => {
        const map = new Map();
        group.forEach(p => {
          if (!p || !p.team) return;
          map.set(p.team, (map.get(p.team) || 0) + 1);
        });
        return sum + ([...map.values()].some(v => v >= 2) ? 1 : 0);
      }, 0);
    }

    function getForcedGroupCount() {
      const raw = String(state.settings.forcedGroupCount || "").trim();
      if (!raw) return null;
      const value = Number(raw);
      if (!Number.isInteger(value) || value < 1) return null;
      return value;
    }

    function getNextGroupSize() {
      const size = Number(state.settings.nextGroupSize || 0);
      if (!size || size < 2 || size > state.settings.laneCount) return state.settings.laneCount;
      return size;
    }

    function setNextGroupSize(size) {
      state.settings.nextGroupSize = size;
      renderOperator();
    }

    function renderGroupSizeControl() {
      const options = ["", ...Array.from({ length: Math.max(0, state.settings.laneCount - 1) }, (_, index) => index + 2)];
      return `
        <div class="group-size-control">
          <span>다음 경기 조 인원</span>
          <div>
            ${options.map(option => `
              <button class="${String(state.settings.nextGroupSize || "") === String(option) ? "active" : ""}" onclick="setNextGroupSize('${option}')">${option === "" ? "자동" : `${option}명`}</button>
            `).join("")}
          </div>
        </div>
      `;
    }

    function buildCandidateGroups(players, stageName) {
      const laneCount = state.settings.laneCount;
      const targetGroupSize = getNextGroupSize();
      const forced = stageName === "예선" || stageName.includes("예선") ? getForcedGroupCount() : null;

      let groupCount = forced || Math.ceil(players.length / targetGroupSize);

      if (!forced && players.length > 1) {
        const minGroups = Math.ceil(players.length / laneCount);
        const maxGroupsWithoutSingle = Math.max(1, Math.floor(players.length / 2));
        groupCount = Math.max(minGroups, Math.min(groupCount, maxGroupsWithoutSingle));
      }

      const groups = Array.from({ length: groupCount }, () => []);

      shuffle(players).forEach(player => {
        const options = groups
          .map((group, index) => ({ group, index }))
          .filter(item => item.group.length < laneCount)
          .map(item => item.index);

        if (!options.length) {
          groups.push([player]);
          return;
        }

        const ranked = shuffle(options).map(index => {
          const temp = groups.map((group, groupIndex) => groupIndex === index ? [...group, player] : [...group]);
          const targetPenalty = Math.max(0, temp[index].length - targetGroupSize) * 10;
          return {
            index,
            score: scoreGroups(temp) + targetPenalty,
            size: groups[index].length
          };
        }).sort((a, b) => a.score - b.score || a.size - b.size || Math.random() - .5);

        groups[ranked[0].index].push(player);
      });

      const activeGroups = groups.filter(group => group.length > 0);

      if (activeGroups.length > 1) {
        const singleIndex = activeGroups.findIndex(group => group.length === 1);
        if (singleIndex >= 0) {
          const targetIndex = activeGroups.findIndex((group, index) => index !== singleIndex && group.length < laneCount);
          if (targetIndex >= 0) {
            activeGroups[targetIndex].push(activeGroups[singleIndex][0]);
            activeGroups.splice(singleIndex, 1);
          }
        }
      }

      return activeGroups;
    }

    function generateStage(players, qualifierIndex, stageIndex, stageName) {
      const laneCount = state.settings.laneCount;
      const tries = players.length <= laneCount ? 1 : getAttemptCount();
      let best = null;
      let bestScore = Infinity;

      for (let i = 0; i < tries; i += 1) {
        const candidate = buildCandidateGroups(players, stageName);
        const score = scoreGroups(candidate);
        if (score < bestScore) {
          best = candidate;
          bestScore = score;
        }
      }

      return {
        id: `q${qualifierIndex}-s${stageIndex}-${Math.random().toString(36).slice(2, 8)}`,
        qualifierIndex,
        stageIndex,
        name: stageName,
        groups: best.map((slots, index) => ({
          id: `q${qualifierIndex}-s${stageIndex}-g${index + 1}-${Math.random().toString(36).slice(2, 8)}`,
          name: `${index + 1}조`,
          slots: assignLanes(slots, laneCount),
          advanceIds: []
        })),
        meta: {
          attempts: tries,
          score: bestScore,
          sameTeam: sameTeamGroupCount(best),
          groupSize: getNextGroupSize()
        }
      };
    }

    function getEligibleParticipants() {
      const participants = parseParticipants();
      if (!state.settings.excludeFinalists) return participants;

      const finalizedIds = new Set(
        state.qualifierRounds
          .filter(round => round.finalist)
          .map(round => round.finalist.id)
      );
      return participants.filter(player => !finalizedIds.has(player.id));
    }

    function validateStart(players, stageName = "예선") {
      if (players.length < 2) return "참가자는 최소 2명 이상 필요합니다.";
      if (players.length > 150) return "현재 버전은 150명 이하를 권장합니다.";

      const names = parseParticipants().map(p => p.name);
      const duplicated = [...new Set(names.filter((name, index) => names.indexOf(name) !== index))];
      if (duplicated.length) return "동명이인이 있습니다. 이름 뒤에 번호 등을 붙여 구분하세요: " + duplicated.join(", ");

      const forced = getForcedGroupCount();
      if (forced && (stageName === "예선" || stageName.includes("예선"))) {
        const minimum = Math.ceil(players.length / state.settings.laneCount);
        if (forced < minimum) return `${state.settings.laneCount}레인 기준 현재 참가자는 최소 ${minimum}조 이상 필요합니다.`;
        if (forced > players.length) return `조편성(수동)는 참가자 수 ${players.length}개를 초과할 수 없습니다.`;
      }

      return "";
    }

    function setActiveRound(roundIndex) {
      activeRoundIndex = roundIndex;
      state.activeRoundIndex = roundIndex;

      const round = state.qualifierRounds[roundIndex];
      if (round && round.stages.length) {
        state.broadcast = {
          mode: "stage",
          roundIndex,
          stageIndex: round.stages.length - 1
        };
      }

      renderOperator();
    }


    function ensureStateDefaults() {
      state.settings = state.settings || {};
      if (!state.settings.matchMode) state.settings.matchMode = "basic";
      if (state.settings.sameLanePrevention === undefined) state.settings.sameLanePrevention = true;
      if (!state.tournament) {
        state.tournament = { name: "", venue: "", status: "draft", startedAtISO: "", startedAtDisplay: "", endedAtISO: "", endedAtDisplay: "" };
      }
      if (state.tournament.name === undefined) state.tournament.name = "";
      if (state.tournament.venue === undefined) state.tournament.venue = "";
      if (state.tournament.status === undefined) state.tournament.status = state.tournament.startedAtISO ? "running" : "draft";
      if (state.tournament.startedAtISO === undefined) state.tournament.startedAtISO = "";
      if (state.tournament.startedAtDisplay === undefined) state.tournament.startedAtDisplay = "";
      if (state.tournament.endedAtISO === undefined) state.tournament.endedAtISO = "";
      if (state.tournament.endedAtDisplay === undefined) state.tournament.endedAtDisplay = "";
    }

    function statusLabel(status = state.tournament?.status) {
      return {
        draft: "준비중",
        running: "진행중",
        finished: "종료",
        archived: "저장 완료"
      }[status] || "준비중";
    }

    function startTournament() {
      ensureStateDefaults();
      if (!state.tournament.name.trim() && !confirm("대회명이 비어 있습니다. 그대로 시작할까요?")) return;
      if (!state.tournament.venue.trim() && !confirm("경기장이 비어 있습니다. 그대로 시작할까요?")) return;

      ensureTournamentStarted();
      state.tournament.status = "running";
      state.tournament.lockedParticipants = state.inputText;
      state.tournament.lockedSettings = {
        matchMode: state.settings.matchMode,
        laneCount: state.settings.laneCount
      };
      renderOperator();
    }

    function finishTournament() {
      ensureStateDefaults();
      if (state.tournament.status !== "running" && !confirm("현재 진행중 상태가 아닙니다. 그래도 종료할까요?")) return;
      const now = new Date();
      state.tournament.endedAtISO = now.toISOString();
      state.tournament.endedAtDisplay = formatDateTimeLocal(now);
      state.tournament.status = "finished";
      renderOperator();
    }

    function reopenTournament() {
      ensureStateDefaults();
      if (!confirm("종료 상태를 해제하고 다시 진행중으로 변경할까요?")) return;
      state.tournament.status = "running";
      state.tournament.endedAtISO = "";
      state.tournament.endedAtDisplay = "";
      renderOperator();
    }

    function archiveTournament() {
      ensureStateDefaults();
      state.tournament.status = "archived";
      renderOperator();
    }

    function isTournamentLocked() {
      ensureStateDefaults();
      return state.tournament.status === "running" || state.tournament.status === "finished" || state.tournament.status === "archived";
    }

    function formatDateTimeLocal(date) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      const hh = String(date.getHours()).padStart(2, "0");
      const mi = String(date.getMinutes()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd} ${hh}:${mi}`;
    }

    function ensureTournamentStarted() {
      ensureStateDefaults();
      if (!state.tournament.startedAtISO) {
        const now = new Date();
        state.tournament.startedAtISO = now.toISOString();
        state.tournament.startedAtDisplay = formatDateTimeLocal(now);
        state.tournament.id = state.tournament.id || `tournament-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}-${String(now.getHours()).padStart(2,"0")}${String(now.getMinutes()).padStart(2,"0")}`;
      }
    }

    function setTournamentField(field, value) {
      ensureStateDefaults();
      state.tournament[field] = value;
      saveLiveState();
    }

    function ruleSummary(mode = state.settings.matchMode) {
      return {
        basic: "라운드별 결승 진출자를 모아 최종 결승을 진행합니다.",
        points: "1차 라운드는 포인트 합산 결선으로 진행하고, 이후 라운드는 토너먼트 방식으로 진행합니다.",
        revival: "원하는 시점에 패자부활전을 추가하고, 진출자를 합류시켜 다음 경기를 진행합니다."
      }[mode] || "라운드별 결승 진출자를 모아 최종 결승을 진행합니다.";
    }

    function matchModeLabel(mode = state.settings.matchMode) {
      return {
        basic: "기본 토너먼트",
        points: "1라운드 포인트전",
        revival: "패자부활 토너먼트"
      }[mode] || "기본 토너먼트";
    }

    function setMatchMode(mode) {
      ensureStateDefaults();
      if (isTournamentLocked() && !confirm("대회가 시작/종료된 상태입니다. 경기 방식을 바꾸면 기록이 꼬일 수 있습니다. 계속할까요?")) return;

      if (state.qualifierRounds.some(round => round.stages.length) || state.finalRace) {
        if (!confirm("경기 방식을 바꾸면 현재 대진표가 라운드 초기화됩니다. 계속할까요?")) return;
      }

      const currentTournament = { ...state.tournament };
      const inputText = state.inputText;
      const previousSettings = { ...state.settings };

      state = makeInitialState(previousSettings.laneCount || 3);
      state.inputText = inputText;
      state.tournament = currentTournament;
      state.settings = { ...state.settings, ...previousSettings, matchMode: mode };
      state.qualifierRounds = makeQualifierRounds(state.settings.laneCount, mode);
      state.finalRace = null;
      activeRoundIndex = 0;
      renderOperator();
    }

    function isPointRound(roundIndex) {
      return state.settings.matchMode === "points" && roundIndex === 0;
    }

    function isRevivalMode() {
      return state.settings.matchMode === "revival";
    }

    function getPointOptions(stageName) {
      return stageName === "포인트 3차전" ? [5, 2, 1, 0] : [3, 2, 1, 0];
    }

    function generatePointStage(players, qualifierIndex, stageIndex, stageName) {
      const stage = generateStage(players, qualifierIndex, stageIndex, stageName);
      return {
        ...stage,
        type: "points",
        pointOptions: getPointOptions(stageName),
        groups: stage.groups.map(group => ({ ...group, points: {} }))
      };
    }

    function getPointPlayers(round) {
      const playerMap = new Map();
      (round.stages || []).filter(stage => stage.type === "points").forEach(stage => {
        stage.groups.forEach(group => {
          group.slots.forEach(player => {
            if (player.isEmptyLane) return;
            if (!playerMap.has(player.id)) playerMap.set(player.id, { id: player.id, name: player.name, team: player.team });
          });
        });
      });
      return Array.from(playerMap.values());
    }

    function computePointTotals(round) {
      const totals = new Map();
      (round.stages || []).filter(stage => stage.type === "points").forEach(stage => {
        stage.groups.forEach(group => {
          group.slots.forEach(player => {
            if (player.isEmptyLane) return;
            const current = totals.get(player.id) || { id: player.id, name: player.name, team: player.team, total: 0, heats: [] };
            const score = Number((group.points || {})[player.id] ?? 0);
            current.total += score;
            current.heats.push({ stage: stage.name, score });
            totals.set(player.id, current);
          });
        });
      });
      return Array.from(totals.values()).sort((a, b) => b.total - a.total || a.name.localeCompare(b.name, "ko"));
    }

    function setPointScore(roundIndex, stageIndex, groupId, playerId, score) {
      const stage = state.qualifierRounds[roundIndex]?.stages?.[stageIndex];
      if (!stage || stage.type !== "points") return;
      const group = stage.groups.find(item => item.id === groupId);
      if (!group) return;
      const player = group.slots.find(item => item.id === playerId);
      if (!player || player.isEmptyLane) return;
      group.points = group.points || {};
      group.points[playerId] = Number(score);
      state.broadcast = { mode: "stage", roundIndex, stageIndex };
      activeRoundIndex = roundIndex;
      renderOperator();
    }

    function createPointNextStage(roundIndex) {
      const round = state.qualifierRounds[roundIndex];
      const lastStage = round.stages[round.stages.length - 1];
      if (lastStage.type === "pointFinal") return showError("상위 3명 결정전에서는 결승 진출자 확정을 사용하세요.");
      if (lastStage.type !== "points") return showError("포인트전 단계가 아닙니다.");

      const pointStageCount = round.stages.filter(stage => stage.type === "points").length;
      const allPlayers = getPointPlayers(round);

      if (pointStageCount < 3) {
        const nextIndex = pointStageCount + 1;
        round.stages.push(generatePointStage(allPlayers, round.index, round.stages.length + 1, `포인트 ${nextIndex}차전`));
      } else {
        const top3 = computePointTotals(round).slice(0, state.settings.laneCount);
        if (top3.length < 2) return showError("상위 결정전을 만들 참가자가 부족합니다.");
        const finalStage = generateStage(top3.map(p => ({ id: p.id, name: p.name, team: p.team })), round.index, round.stages.length + 1, `포인트 상위 ${state.settings.laneCount}명 결정전`);
        finalStage.type = "pointFinal";
        round.stages.push(finalStage);
      }

      state.broadcast = { mode: "stage", roundIndex, stageIndex: round.stages.length - 1 };
      activeRoundIndex = roundIndex;
      renderOperator();
      requestAnimationFrame(() => document.getElementById("currentStageTop")?.scrollIntoView({ behavior: "smooth", block: "start" }));
    }

    function getActualPlayersFromStage(stage) {
      const players = [];
      stage.groups.forEach(group => group.slots.forEach(player => {
        if (!player.isEmptyLane) players.push({ id: player.id, name: player.name, team: player.team });
      }));
      return players;
    }

    function getLosersFromStage(stage) {
      const selected = new Set(getSelectedFromStage(stage).map(player => player.id));
      return getActualPlayersFromStage(stage).filter(player => !selected.has(player.id));
    }

    function createRevivalStage(roundIndex) {
      const round = state.qualifierRounds[roundIndex];
      if (!round || !round.stages.length) return showError("패자부활전을 만들 기준 단계가 없습니다.");

      const baseStageIndex = round.stages.length - 1;
      const baseStage = round.stages[baseStageIndex];

      if (baseStage.type === "points" || baseStage.type === "pointFinal") {
        return showError("포인트전 단계에서는 패자부활전을 생성하지 않습니다.");
      }
      if (baseStage.type === "revival") {
        return showError("패자부활전 안에서 다시 패자부활전을 만들 수 없습니다.");
      }

      const winners = getSelectedFromStage(baseStage);
      if (!winners.length) return showError("현재 단계에서 먼저 진출자를 선택하세요.");

      const losers = getLosersFromStage(baseStage);
      if (losers.length < 2) return showError("패자부활전을 만들 탈락자가 부족합니다.");

      const revivalStage = generateStage(losers, round.index, round.stages.length + 1, `패자부활전`);
      revivalStage.type = "revival";
      revivalStage.revivalBaseStageIndex = baseStageIndex;
      revivalStage.revivalBaseStageName = baseStage.name;
      round.stages.push(revivalStage);

      state.broadcast = { mode: "stage", roundIndex, stageIndex: round.stages.length - 1 };
      activeRoundIndex = roundIndex;
      renderOperator();
      requestAnimationFrame(() => document.getElementById("currentStageTop")?.scrollIntoView({ behavior: "smooth", block: "start" }));
    }

    function createRevivalNextStage(roundIndex) {
      const round = state.qualifierRounds[roundIndex];
      const lastStage = round.stages[round.stages.length - 1];

      if (lastStage.type === "revival") {
        const baseStage = round.stages[lastStage.revivalBaseStageIndex];
        const baseWinners = baseStage ? getSelectedFromStage(baseStage) : [];
        const revivalWinners = getSelectedFromStage(lastStage);
        const merged = [...baseWinners, ...revivalWinners];
        const unique = Array.from(new Map(merged.map(player => [player.id, player])).values());

        if (unique.length < 2) return showError("합류 후 다음 단계를 만들 참가자가 부족합니다.");
        const nextName = getNextStageName(round, unique.length);
        const nextStage = generateStage(unique, round.index, round.stages.length + 1, nextName);
        nextStage.type = "merged";
        nextStage.mergedFromRevival = true;
        round.stages.push(nextStage);
      } else {
        const selected = getSelectedFromStage(lastStage);
        if (selected.length === 0) return showError("다음 단계로 보낼 진출자가 없습니다.");
        if (selected.length === 1) return showError("다음 단계 생성은 진출자 2명 이상부터 가능합니다.");
        const nextName = getNextStageName(round, selected.length);
        round.stages.push(generateStage(selected, round.index, round.stages.length + 1, nextName));
      }

      state.broadcast = { mode: "stage", roundIndex, stageIndex: round.stages.length - 1 };
      activeRoundIndex = roundIndex;
      renderOperator();
      requestAnimationFrame(() => document.getElementById("currentStageTop")?.scrollIntoView({ behavior: "smooth", block: "start" }));
    }

    function startQualifierRound(roundIndex) {
      ensureStateDefaults();
      ensureTournamentStarted();

      const round = state.qualifierRounds[roundIndex];
      const players = getEligibleParticipants();
      const error = validateStart(players, "예선");
      if (error) return showError(error);

      if (isPointRound(roundIndex)) {
        round.stagePlan = ["포인트 1차전", "포인트 2차전", "포인트 3차전", `포인트 상위 ${state.settings.laneCount}명 결정전`];
        round.stages = [];
        round.finalist = null;
        round.stages = [generatePointStage(players, round.index, 1, "포인트 1차전")];
      } else if (isRevivalMode()) {
        const plan = makeStagePlan(players.length, state.settings.laneCount).map(name => name === "라운드 결승" ? "결승" : name);
        round.stagePlan = [...plan, "패자부활 삽입 가능"];
        round.stages = [];
        round.finalist = null;
        round.stages = [generateStage(players, round.index, 1, plan[0])];
      } else {
        const plan = makeStagePlan(players.length, state.settings.laneCount);
        round.stagePlan = plan;
        round.stages = [];
        round.finalist = null;
        round.stages = [generateStage(players, round.index, 1, plan[0])];
      }

      state.finalRace = null;
      state.broadcast = { mode: "stage", roundIndex, stageIndex: 0 };
      activeRoundIndex = roundIndex;
      renderOperator();
    }

    function resetQualifierRound(roundIndex) {
      const round = state.qualifierRounds[roundIndex];
      round.stagePlan = [];
      round.stages = [];
      round.finalist = null;
      state.finalRace = null;

      if (state.broadcast.roundIndex === roundIndex) {
        state.broadcast = { mode: "stage", roundIndex, stageIndex: 0 };
      }

      renderOperator();
    }

    function getSelectedFromStage(stage) {
      const selected = [];
      stage.groups.forEach(group => {
        (group.advanceIds || []).forEach(id => {
          const player = group.slots.find(slot => slot.id === id);
          if (player && !player.isEmptyLane) selected.push({ id: player.id, name: player.name, team: player.team });
        });
      });
      return selected;
    }

    function getNextStageName(round, nextPlayersCount) {
      if (nextPlayersCount <= state.settings.laneCount) return isRevivalMode() ? "결승" : "라운드 결승";

      const nextIndex = round.stages.length;
      const planned = round.stagePlan[nextIndex];
      if (planned && planned !== "라운드 결승") return planned;

      const dynamicPlan = makeStagePlan(nextPlayersCount, state.settings.laneCount);
      return dynamicPlan[0] === "라운드 결승" ? "준결승" : dynamicPlan[0];
    }

    function createNextStage(roundIndex) {
      ensureStateDefaults();
      const round = state.qualifierRounds[roundIndex];
      if (!round || !round.stages.length) return showError("먼저 해당 라운드를 시작하세요.");

      if (isPointRound(roundIndex)) return createPointNextStage(roundIndex);
      if (isRevivalMode()) return createRevivalNextStage(roundIndex);

      const lastStage = round.stages[round.stages.length - 1];
      if (lastStage.name === "라운드 결승") return showError("라운드 결승에서는 다음 단계 생성 대신 결승 진출자를 확정하세요.");

      const selected = getSelectedFromStage(lastStage);
      if (selected.length === 0) return showError("다음 단계로 보낼 진출자가 없습니다.");
      if (selected.length === 1) return showError("다음 단계 생성은 진출자 2명 이상부터 가능합니다.");

      const nextName = getNextStageName(round, selected.length);
      round.stages.push(generateStage(selected, round.index, round.stages.length + 1, nextName));
      state.broadcast = { mode: "stage", roundIndex, stageIndex: round.stages.length - 1 };
      activeRoundIndex = roundIndex;
      renderOperator();
      requestAnimationFrame(() => document.getElementById("currentStageTop")?.scrollIntoView({ behavior: "smooth", block: "start" }));
    }

    function confirmRoundFinalist(roundIndex) {
      const round = state.qualifierRounds[roundIndex];
      if (!round || !round.stages.length) return showError("먼저 해당 라운드를 진행하세요.");

      const lastStage = round.stages[round.stages.length - 1];
      const validFinalStage = lastStage.name === "라운드 결승" || lastStage.name === "결승" || lastStage.type === "pointFinal";
      if (!validFinalStage) return showError(isRevivalMode() ? "결승 경기에서만 우승자를 확정할 수 있습니다." : "라운드 결승 또는 포인트 상위 결정전에서만 최종 결승 진출자를 확정할 수 있습니다.");

      const selected = getSelectedFromStage(lastStage);
      if (selected.length === 0) return showError(isRevivalMode() ? "우승자를 선택하세요." : "최종 결승 진출자를 선택하세요.");
      if (selected.length > 1) return showError(isRevivalMode() ? "우승자는 1명만 선택해야 합니다." : "각 라운드의 최종 결승 진출자는 1명만 선택해야 합니다.");

      round.finalist = selected[0];
      state.finalRace = null;
      state.broadcast = { mode: "stage", roundIndex, stageIndex: round.stages.length - 1 };
      renderOperator();
    }

    function setBroadcastStage(roundIndex, stageIndex) {
      state.broadcast = { mode: "stage", roundIndex, stageIndex };
      activeRoundIndex = roundIndex;
      renderOperator();
    }

    function toggleAdvance(roundIndex, stageIndex, groupId, playerId) {
      const stage = state.qualifierRounds[roundIndex]?.stages[stageIndex];
      if (!stage) return;
      const group = stage.groups.find(item => item.id === groupId);
      if (!group) return;

      const player = group.slots.find(item => item.id === playerId);
      if (!player || player.isEmptyLane) return;

      group.advanceIds = group.advanceIds || [];
      if (group.advanceIds.includes(playerId)) {
        group.advanceIds = group.advanceIds.filter(id => id !== playerId);
      } else {
        group.advanceIds.push(playerId);
      }

      state.broadcast = { mode: "stage", roundIndex, stageIndex };
      activeRoundIndex = roundIndex;
      renderOperator();
    }

    function createFinalRace() {
      const finalists = state.qualifierRounds.map(round => round.finalist).filter(Boolean);
      if (finalists.length < state.settings.laneCount) {
        return showError(`${state.settings.laneCount}명의 최종 결승 진출자가 모두 확정되어야 합니다.`);
      }

      state.finalRace = {
        id: `final-${Math.random().toString(36).slice(2, 8)}`,
        name: "최종 결승",
        groupSize: state.settings.laneCount,
        group: {
          id: `final-group-${Math.random().toString(36).slice(2, 8)}`,
          name: "FINAL",
          slots: assignLanes(finalists, state.settings.laneCount),
          advanceIds: []
        }
      };

      state.broadcast = { mode: "final" };
      renderOperator();
    }

    function toggleFinalWinner(playerId) {
      if (!state.finalRace) return;
      const player = state.finalRace.group.slots.find(item => item.id === playerId);
      if (!player || player.isEmptyLane) return;
      const ids = state.finalRace.group.advanceIds || [];
      if (ids.includes(playerId)) {
        state.finalRace.group.advanceIds = ids.filter(id => id !== playerId);
      } else {
        state.finalRace.group.advanceIds = [...ids, playerId];
      }
      state.broadcast = { mode: "final" };
      renderOperator();
    }

    function resetTournament() {
      state.qualifierRounds = makeQualifierRounds(state.settings.laneCount);
      state.finalRace = null;
      state.broadcast = { mode: "stage", roundIndex: 0, stageIndex: 0 };
      activeRoundIndex = 0;
      renderOperator();
    }

    function setLaneCount(laneCount) {
      ensureStateDefaults();
      if (isTournamentLocked() && !confirm("대회가 시작/종료된 상태입니다. 레인 수를 바꾸면 기록이 꼬일 수 있습니다. 계속할까요?")) return;
      if (state.qualifierRounds.some(round => round.stages.length) || state.finalRace) {
        if (!confirm("경기 타입을 바꾸면 현재 대진표가 라운드 초기화됩니다. 계속할까요?")) return;
      }

      const inputText = state.inputText;
      const previousSettings = { ...state.settings };
      const previousTournament = { ...state.tournament };

      state = makeInitialState(laneCount);
      state.inputText = inputText;
      state.settings = { ...state.settings, ...previousSettings, laneCount, nextGroupSize: "" };
      state.tournament = previousTournament;
      state.qualifierRounds = makeQualifierRounds(laneCount, state.settings.matchMode);
      state.finalRace = null;
      activeRoundIndex = 0;
      renderOperator();
    }

    function setSetting(key, value) {
      state.settings[key] = value;
      renderOperator();
    }

    function refreshInput(value) {
      state.inputText = value;
      const players = parseParticipants();
      const statPlayers = document.getElementById("statPlayers");
      const statGroups = document.getElementById("statGroups");
      if (statPlayers) statPlayers.textContent = players.length;
      if (statGroups) statGroups.textContent = players.length ? Math.ceil(players.length / state.settings.laneCount) : 0;
      saveLiveState();
    }

    function showError(message) {
      const el = document.getElementById("error");
      if (!el) return;
      el.style.display = message ? "block" : "none";
      el.textContent = message;
    }

    function encodePayload(payload) {
      return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    }

    function decodePayload(text) {
      return JSON.parse(decodeURIComponent(escape(atob(text))));
    }

    function getHashParams() {
      const raw = location.hash.startsWith("#") ? location.hash.slice(1) : "";
      return new URLSearchParams(raw);
    }

    function exportState() {
      return {
        settings: state.settings,
        tournament: state.tournament,
        activeRoundIndex,
        broadcast: state.broadcast,
        qualifierRounds: state.qualifierRounds,
        finalRace: state.finalRace,
        updatedAt: state.updatedAt || Date.now()
      };
    }

    function makeSnapshotUrl(view) {
      return `${location.origin}${location.pathname}#view=${view}&data=${encodePayload(exportState())}`;
    }

    function makeLiveTvUrl() {
      return `${location.origin}${location.pathname}#view=tv-live`;
    }

    function openTvView() {
      saveLiveState();
      window.open(makeLiveTvUrl(), "_blank", "noopener,noreferrer");
    }

    function shareMobileView() {
      copyOrShare(makeSnapshotUrl("mobile"), "모바일 공유 링크");
    }

    function copyOrShare(url, label) {
      if (navigator.share) {
        navigator.share({ title: "MINI4WD TOURNAMENT MAKER", url }).catch(() => copyText(url, label));
      } else {
        copyText(url, label);
      }
    }

    function copyText(url, label) {
      navigator.clipboard?.writeText(url).then(() => {
        alert(`${label}가 복사되었습니다.`);
      }).catch(() => {
        prompt(`${label}를 복사하세요.`, url);
      });
    }

    function startAllFirstStages() {
      ensureStateDefaults();
      ensureTournamentStarted();

      const players = getEligibleParticipants();
      const error = validateStart(players, "예선");
      if (error) return showError(error);

      state.qualifierRounds.forEach(round => {
        round.stagePlan = [];
        round.stages = [];
        round.finalist = null;
      });
      state.finalRace = null;

      state.qualifierRounds.forEach((round, index) => {
        const roundPlayers = state.settings.excludeFinalists ? getEligibleParticipants() : parseParticipants();

        if (isPointRound(index)) {
          round.stagePlan = ["포인트 1차전", "포인트 2차전", "포인트 3차전", `포인트 상위 ${state.settings.laneCount}명 결정전`];
          round.stages = [generatePointStage(roundPlayers, round.index, 1, "포인트 1차전")];
        } else if (isRevivalMode()) {
          const plan = makeStagePlan(roundPlayers.length, state.settings.laneCount).map(name => name === "라운드 결승" ? "결승" : name);
          round.stagePlan = [...plan, "패자부활 삽입 가능"];
          round.stages = [generateStage(roundPlayers, round.index, 1, plan[0])];
        } else {
          const plan = makeStagePlan(roundPlayers.length, state.settings.laneCount);
          round.stagePlan = plan;
          round.stages = [generateStage(roundPlayers, round.index, 1, plan[0])];
        }
      });

      state.broadcast = { mode: "stage", roundIndex: 0, stageIndex: 0 };
      activeRoundIndex = 0;
      renderOperator();
    }

    function renderOperator() {
      ensureStateDefaults();
      document.body.classList.remove("tv-mode");
      saveLiveState();

      const players = parseParticipants();
      const estimatedGroups = players.length ? Math.ceil(players.length / state.settings.laneCount) : 0;
      const finalizedCount = state.qualifierRounds.filter(round => round.finalist).length;
      activeRoundIndex = Math.min(activeRoundIndex, state.qualifierRounds.length - 1);
      const activeRound = state.qualifierRounds[activeRoundIndex];

      app.innerHTML = `
        <div class="wrap">
          <header class="header">
            <div class="header-copy">
              <div class="brand-line">
                <div class="eyebrow">MINI4WD TOURNAMENT MAKER</div>
                <div class="maker">made by GEEKS 마이 · Special Thanks to SOON.D</div>
              </div>
              <h1>${matchModeLabel()} · ${state.settings.laneCount}레인</h1>
              <p class="desc">${ruleSummary()}</p>
            </div>
            <img class="header-logo" src="${LOGO_SRC}" alt="Geeks logo" />
          </header>

          <div class="layout">
            <main class="main-area">
              <div class="toolbar">
                <button class="primary" onclick="openTvView()">TV LIVE</button>
                <button class="ghost" onclick="shareMobileView()">MOBILE LINK</button>
                <button class="ghost" onclick="openDbPage()">PLAYER DB</button>
                <button class="ghost" onclick="openPrintView()">PRINT</button>
                <div class="grow"></div>
                ${!isRevivalMode() ? `<button class="ghost" onclick="createFinalRace()">최종 결승 진행</button>` : ""}
              </div>

              ${renderTournamentStatusPanel()}

              ${!isRevivalMode() ? renderFinalRace() : ""}

              ${!isRevivalMode() ? `
                <div class="tabs">
                  ${state.qualifierRounds.map((round, index) => renderRoundTab(round, index)).join("")}
                </div>
              ` : ""}

              ${renderActiveRound(activeRound, activeRoundIndex)}

              <div class="error" id="error"></div>
            </main>

            <aside class="side-area">
              <section class="card">
                <h2>대회 설정</h2>

                <div class="form-grid">
                  <div>
                    <label>대회명</label>
                    <input class="mini-input" placeholder="OPEN CLASS" value="${escapeHtml(state.tournament.name || "")}" oninput="setTournamentField('name', this.value)" onblur="renderOperator()" />
                  </div>
                  <div>
                    <label>경기장</label>
                    <input class="mini-input" placeholder="" value="${escapeHtml(state.tournament.venue || "")}" oninput="setTournamentField('venue', this.value)" onblur="renderOperator()" />
                  </div>
                </div>
                <p class="hint">대회명과 경기장을 입력하면 결과 다운로드와 출력용 대진표에 함께 표시됩니다.</p>
                <div style="margin:8px 0 14px;">
                  <span class="pill">경기일시: ${state.tournament.startedAtDisplay || "대회 시작 시 자동 기록"}</span>
                </div>

                <label>경기 방식</label>
                <div class="btnrow mode-row">
                  <button class="${state.settings.matchMode === 'basic' ? "active" : ""}" onclick="setMatchMode('basic')">기본 토너먼트</button>
                  <button class="${state.settings.matchMode === 'points' ? "active" : ""}" onclick="setMatchMode('points')">1R 포인트전</button>
                  <button class="${state.settings.matchMode === 'revival' ? "active" : ""}" onclick="setMatchMode('revival')">패자부활</button>
                </div>

                <label>경기 타입</label>
                <div class="btnrow">
                  <button class="${state.settings.laneCount === 3 ? "active" : ""}" onclick="setLaneCount(3)">3레인</button>
                  <button class="${state.settings.laneCount === 5 ? "active" : ""}" onclick="setLaneCount(5)">5레인</button>
                </div>

                <label>팀킬 방지</label>
                <div class="btnrow four">
                  ${["none", "low", "medium", "high"].map(level => `<button class="${state.settings.avoidance === level ? "active" : ""}" onclick="setSetting('avoidance', '${level}')">${avoidanceLabel(level)}</button>`).join("")}
                </div>

<label>같은 레인 방지</label>
                <div class="btnrow">
                  <button class="${!state.settings.sameLanePrevention ? "active" : ""}" onclick="setSetting('sameLanePrevention', false)">없음</button>
                  <button class="${state.settings.sameLanePrevention ? "active" : ""}" onclick="setSetting('sameLanePrevention', true)">적용</button>
                </div>
                <p class="hint">이전 경기에서 배정된 레인 이력에 따라, 가능하면 같은 레인을 피해서 배정합니다.</p>

                

                <div class="form-grid">
                  <div>
                    <label>조편성(수동)</label>
                    <input type="number" min="1" placeholder="자동" value="${escapeHtml(state.settings.forcedGroupCount)}" oninput="setSetting('forcedGroupCount', this.value)" />
                  </div>
                  <div>
                    <label>라운드 수</label>
                    <input type="number" value="${state.settings.laneCount}" disabled />
                  </div>
                </div>

                <label style="display:flex; align-items:center; gap:8px; margin-top:14px;">
                  <input type="checkbox" ${state.settings.excludeFinalists ? "checked" : ""} onchange="setSetting('excludeFinalists', this.checked)" />
                  이미 확정된 최종 결승 진출자는 다음 라운드에서 제외
                </label>
              </section>

              <section class="card">
                <h2>참가자 입력</h2>
                <p class="hint">한 줄에 한 명씩 입력합니다. 형식: <b>이름/팀명</b><br>예: 홍길동/타미야팀</p>
                <textarea oninput="refreshInput(this.value)">${escapeHtml(state.inputText)}</textarea>
                <div class="stats">
                  <div class="stat"><small>참가자</small><strong id="statPlayers">${players.length}</strong></div>
                  <div class="stat"><small>예상 조</small><strong id="statGroups">${estimatedGroups}</strong></div>
                  <div class="stat"><small>확정 진출자</small><strong>${finalizedCount}/${state.settings.laneCount}</strong></div>
                </div>
                <div style="display:flex; gap:8px; margin-top:12px;">
                  <button class="primary" style="flex:1" onclick="startAllFirstStages()">전체 라운드 시작</button>
                  <button class="danger" onclick="resetTournament()">라운드 초기화</button>
                </div>
              </section>

              <section class="card">
                <h2>운영 정보</h2>
                <button class="primary manual-open-button" onclick="openUsageManual()">사용설명서</button>
                <div class="finalist-grid" style="grid-template-columns:1fr;">
                  <div class="finalist-item"><b>경기 방식</b><br>${matchModeLabel()}</div>
                  <div class="finalist-item"><b>대회명</b><br>${escapeHtml(state.tournament.name || "미입력")}</div>
                  <div class="finalist-item"><b>경기장</b><br>${escapeHtml(state.tournament.venue || "미입력")}</div>
                  ${renderBroadcastStatus()}
                  <div class="finalist-item"><b>같은 레인 방지</b><br>${state.settings.sameLanePrevention ? "ON" : "OFF"}</div>
                  <div class="finalist-item download-mini"><b>기록 다운로드</b><br><button onclick="exportTournamentCsv()">결과 CSV</button><button onclick="exportTournamentJson()">기록 JSON</button></div>
                </div>
              </section>
            </aside>
          </div>
        </div>
      `;
    }

    function openUsageManual() {
      closeUsageManual();

      const modal = document.createElement("div");
      modal.className = "manual-modal";
      modal.id = "usageManualModal";
      modal.innerHTML = `
        <div class="manual-backdrop" onclick="closeUsageManual()"></div>
        <section class="manual-panel" role="dialog" aria-modal="true" aria-label="사용설명서">
          <header class="manual-head">
            <div>
              <strong>MINI4WD TOURNAMENT MAKER</strong>
              <span>사용설명서</span>
            </div>
            <button onclick="closeUsageManual()">닫기</button>
          </header>

          <div class="manual-body">
            <h2>1. 기본 흐름</h2>
            <ol>
              <li>대회명은 기본 예시인 <b>OPEN CLASS</b>를 참고해 입력합니다. 경기장은 필요할 때만 입력합니다.</li>
              <li>경기 방식을 선택합니다. 기본 토너먼트, 1R 포인트전, 패자부활 중 하나를 고릅니다.</li>
              <li>경기 타입을 3레인 또는 5레인으로 선택합니다. 레인 수는 실제 경기장 레인 수입니다.</li>
              <li>참가자 명단을 한 줄에 한 명씩 입력합니다. 형식은 <b>이름/팀명</b>입니다.</li>
              <li><b>대회 시작</b>을 누르면 시작 시간이 기록됩니다.</li>
              <li>각 조에서 진출자를 선택하고 <b>다음 경기 진행</b>을 누릅니다.</li>
              <li>마지막 결승 또는 최종 결승에서 우승자를 확정합니다.</li>
            </ol>

            <h2>2. 경기 방식</h2>
            <h3>기본 토너먼트</h3>
            <p>3레인은 1차~3차 라운드, 5레인은 1차~5차 라운드로 운영합니다. 각 라운드의 결승 진출자가 모두 확정되면 최종 결승을 진행합니다.</p>

            <h3>1R 포인트전</h3>
            <p>1차 라운드만 포인트전으로 진행합니다. 1·2차전은 3점/2점/1점/0점, 3차전은 5점/2점/1점/0점입니다. 합산 상위 인원이 결선을 진행하고, 그 승자가 최종 결승에 진출합니다.</p>

            <h3>패자부활 토너먼트</h3>
            <p>패자부활은 1차/2차/3차 라운드 구조가 아니라 하나의 큰 토너먼트 흐름입니다. 원하는 시점에 <b>패자부활전 생성</b>을 누르면 현재 경기의 비진출자가 패자부활 대상으로 편성됩니다. 패자부활 진출자는 기존 진출자와 합류하여 다음 경기를 진행합니다.</p>

            <h2>3. 조 편성 규칙</h2>
            <ul>
              <li>레인 수는 실제 경기장 구조입니다. 3레인은 1~3LANE, 5레인은 1~5LANE으로 표시됩니다.</li>
              <li>다음 경기 조 인원은 레인 수와 별도로 선택할 수 있습니다. 예를 들어 3레인 경기에서도 2명씩 편성할 수 있습니다.</li>
              <li>조 인원은 기본 목표값입니다. 참가자가 정수로 나뉘지 않아도 <b>1명짜리 단독 조는 만들지 않습니다.</b></li>
              <li>남는 1명은 다른 조에 합쳐서 경기 가능한 조로 편성합니다. 단, 한 조의 실제 인원은 레인 수를 넘지 않습니다.</li>
              <li>비어 있는 레인은 <b>빈 레인</b>으로 표시되며 선택할 수 없습니다.</li>
            </ul>

            <h2>4. 운영 버튼</h2>
            <ul>
              <li><b>TV LIVE</b>: 현재 송출 대상으로 지정된 경기를 TV 화면으로 엽니다.</li>
              <li><b>MOBILE LINK</b>: 현재 상태를 모바일 확인용 링크로 만듭니다. 서버 연동 전에는 스냅샷 방식입니다.</li>
              <li><b>PRINT</b>: 현재 경기의 출력용 대진표를 엽니다.</li>
              <li><b>엑셀 다운로드</b>: PRINT 화면에서 출력용 대진표를 엑셀 파일로 저장합니다.</li>
              <li><b>결과 CSV / 기록 JSON</b>: 운영 정보 아래에서 경기 기록을 내려받습니다.</li>
            </ul>

            <h2>5. 출력 / 기록</h2>
            <p>출력용 대진표에는 팀명을 표시하지 않습니다. 조, 레인, 선수명만 표시합니다. A4 출력 기준으로 많은 조가 들어갈 수 있도록 자동 압축됩니다. 기록용 CSV/JSON에는 팀명, 점수, 결과, 레인 이력 등이 포함됩니다.</p>

            <h2>6. 주의사항</h2>
            <ul>
              <li>대회 시작 후 경기 방식과 레인 수를 바꾸면 기록이 꼬일 수 있습니다.</li>
              <li>패자부활전은 현재 단계의 진출자를 먼저 선택한 뒤 생성해야 합니다.</li>
              <li>같은 팀 방지와 같은 레인 방지는 초기값이 없음입니다. 필요할 때만 적용하세요.</li>
              <li>경기 중 수정이 많아질 경우, 중간중간 JSON 백업을 내려받아 두는 것을 권장합니다.</li>
            </ul>
          </div>
        </section>
      `;

      document.body.appendChild(modal);
    }

    function closeUsageManual() {
      const existing = document.getElementById("usageManualModal");
      if (existing) existing.remove();
    }

    function renderRoundTab(round, index) {
      const status = getRoundStatus(round);
      return `
        <button class="tab-btn ${activeRoundIndex === index ? "active" : ""}" onclick="setActiveRound(${index})">
          <span>${round.title}</span>
          <small>${status}</small>
        </button>
      `;
    }

    function getRoundStatus(round) {
      if (round.finalist) return `확정 · ${round.finalist.name}`;
      if (round.stages.length) return `진행중 · ${round.stages[round.stages.length - 1].name}`;
      return "미진행";
    }

    function renderBroadcastStatus() {
      const target = getBroadcastTarget(state);
      if (!target) return `<div class="finalist-item">현재 송출 대상 없음</div>`;
      return `<div class="finalist-item"><b>현재 TV 송출</b><br>${escapeHtml(target.title)}</div>`;
    }

    function renderActiveRound(round, roundIndex) {
      const currentStageIndex = round.stages.length ? round.stages.length - 1 : -1;
      const currentStage = currentStageIndex >= 0 ? round.stages[currentStageIndex] : null;
      const pastStages = currentStageIndex > 0 ? round.stages.slice(0, currentStageIndex) : [];

      return `
        <section class="round-card">
          <div class="round-head">
            <div>
              <div class="round-title">
                <h2>${escapeHtml(round.title)}</h2>
                ${round.finalist ? `<span class="round-badge finalist-badge">${isRevivalMode() ? "우승:" : "진출:"} ${escapeHtml(round.finalist.name)}</span>` : `<span class="round-badge">대기중</span>`}
              </div>
              <div class="meta">
                경기 순서 : ${round.stagePlan.length ? round.stagePlan.join(" → ") : makeStagePlan(Math.max(2, parseParticipants().length), state.settings.laneCount).join(" → ")}
              </div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="primary" onclick="startQualifierRound(${roundIndex})">${round.stages.length ? "이번 라운드 재추첨" : "이 라운드 시작"}</button>
              <button class="ghost" onclick="createNextStage(${roundIndex})">${currentStage?.type === "revival" ? "패자부활 진출자 합류" : "다음 경기 진행"}</button>
              ${isRevivalMode() && currentStage && currentStage.type !== "revival" && currentStage.name !== "라운드 결승" ? `<button class="ghost" onclick="createRevivalStage(${roundIndex})">패자부활전 생성</button>` : ""}
              <button class="ghost" onclick="confirmRoundFinalist(${roundIndex})">${isRevivalMode() ? "우승자 확정" : "결승 진출자 확정"}</button>
              <button class="danger" onclick="resetQualifierRound(${roundIndex})">라운드 초기화</button>
            </div>
            ${renderGroupSizeControl()}
          </div>

          ${currentStage ? `
            ${isPointRound(roundIndex) ? renderPointScoreboard(round) : ""}
            <div id="currentStageTop" class="current-stage-area">
              <div class="section-label">현재 진행</div>
              ${renderStage(currentStage, roundIndex, currentStageIndex, false)}
            </div>
            ${pastStages.length ? `
              <details class="history-panel">
                <summary>과거 경기 기록 · ${pastStages.length}단계</summary>
                <div class="stage-list history-list">
                  ${pastStages.slice().reverse().map((stage, offset) => {
                    const originalIndex = pastStages.length - 1 - offset;
                    return renderStage(stage, roundIndex, originalIndex, true);
                  }).join("")}
                </div>
              </details>
            ` : ""}
          ` : `<div class="empty"><div><h3>${round.title} 대진이 아직 없습니다</h3><p>이 라운드 시작 버튼으로 예선 또는 첫 단계를 생성하세요.</p></div></div>`}
        </section>
      `;
    }


    function renderPointScoreboard(round) {
      const totals = computePointTotals(round);
      if (!totals.length) return "";

      return `
        <section class="athens-scoreboard">
          <div class="scoreboard-head">
            <strong>포인트 합산 순위</strong>
            <span class="badge">1·2차전 3/2/1/0 · 3차전 5/2/1/0</span>
          </div>
          <div class="scoreboard-list">
            ${totals.map((player, index) => `
              <div class="score-row ${index < state.settings.laneCount ? "top-three" : ""}">
                <span class="rank">${index + 1}</span>
                <span class="score-name">${escapeHtml(player.name)}${player.team ? ` / ${escapeHtml(player.team)}` : ""}</span>
                <strong>${player.total}P</strong>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderStage(stage, roundIndex, stageIndex, isPast = false) {
      if (stage.type === "points") return renderPointStage(stage, roundIndex, stageIndex, isPast);

      const isBroadcast = state.broadcast.mode === "stage" && state.broadcast.roundIndex === roundIndex && state.broadcast.stageIndex === stageIndex;
      return `
        <section class="stage-card ${isPast ? "past-stage" : "current-stage"}">
          <div class="stage-head">
            <div>
              <h3>${escapeHtml(stage.name)} ${isBroadcast ? `<span class="round-badge live-badge">● TV 송출중</span>` : ""}</h3>
              <div class="meta">${stage.groups.length}개 조 · 배정 점수 ${stage.meta.score} · 같은 팀 배정 조 ${stage.meta.sameTeam}개</div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="${isBroadcast ? "primary" : "ghost"}" onclick="setBroadcastStage(${roundIndex}, ${stageIndex})">TV 송출</button>
              <span class="badge">대진 후보 검토 ${stage.meta.attempts.toLocaleString()}회</span>
            </div>
          </div>

          ${stage.meta.sameTeam > 0 ? `<div class="error" style="display:block; margin-bottom:12px; border-color:#fb923c; color:#fed7aa; background:rgba(251,146,60,.1);">같은 팀 매칭이 일부 발생했습니다. 참가자 팀 분포상 완전 회피가 어려운 경우입니다.</div>` : ""}

          <div class="groups">
            ${stage.groups.map(group => renderGroup(group, roundIndex, stageIndex)).join("")}
          </div>
        </section>
      `;
    }


    function renderPointStage(stage, roundIndex, stageIndex, isPast = false) {
      const isBroadcast = state.broadcast.mode === "stage" && state.broadcast.roundIndex === roundIndex && state.broadcast.stageIndex === stageIndex;
      return `
        <section class="stage-card point-stage ${isPast ? "past-stage" : "current-stage"}">
          <div class="stage-head">
            <div>
              <h3>${escapeHtml(stage.name)} ${isBroadcast ? `<span class="round-badge live-badge">● TV 송출중</span>` : ""}</h3>
              <div class="meta">포인트 선택: ${stage.pointOptions.join(" / ")}점 · ${stage.groups.length}개 조</div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="${isBroadcast ? "primary" : "ghost"}" onclick="setBroadcastStage(${roundIndex}, ${stageIndex})">TV 송출</button>
              <span class="badge">포인트전</span>
            </div>
          </div>

          <div class="groups">
            ${stage.groups.map(group => `
              <article class="group">
                <div class="group-title">
                  <strong>${escapeHtml(group.name)}</strong>
                  <span class="badge">${group.slots.filter(slot => !slot.isEmptyLane).length}명 경기</span>
                </div>
                ${group.slots.map(player => renderPointPlayerSlot(player, group, stage, roundIndex, stageIndex)).join("")}
              </article>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderPointPlayerSlot(player, group, stage, roundIndex, stageIndex) {
      if (player.isEmptyLane) {
        return `
          <div class="slot empty-lane">
            <div class="slot-inner">
              <span class="lane-label">${player.lane}LANE</span>
              <div class="player-info">
                <strong>빈 레인</strong>
              </div>
            </div>
          </div>
        `;
      }

      const selectedScore = (group.points || {})[player.id];
      return `
        <div class="slot point-slot">
          <div class="slot-inner">
            <span class="lane-label">${player.lane}LANE</span>
            <div class="player-info">
              <strong>${escapeHtml(player.name)}</strong>
              ${player.team ? `<div class="team">${escapeHtml(player.team)}</div>` : ""}
            </div>
          </div>
          <div class="point-buttons">
            ${stage.pointOptions.map(score => `
              <button class="${Number(selectedScore) === Number(score) ? "primary" : "ghost"}" onclick="setPointScore(${roundIndex}, ${stageIndex}, '${escapeAttr(group.id)}', '${escapeAttr(player.id)}', ${score})">${score}P</button>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderGroup(group, roundIndex, stageIndex) {
      return `
        <article class="group">
          <div class="group-title">
            <strong>${escapeHtml(group.name)}</strong>
            <span class="badge">${group.slots.filter(slot => !slot.isEmptyLane).length}명 경기</span>
          </div>
          ${group.slots.map(player => renderPlayerSlot(player, group, roundIndex, stageIndex)).join("")}
        </article>
      `;
    }

    function renderPlayerSlot(player, group, roundIndex, stageIndex) {
      if (player.isEmptyLane) {
        return `
          <div class="slot empty-lane">
            <div class="slot-inner">
              <span class="lane-label">${player.lane}LANE</span>
              <div class="player-info">
                <strong>빈 레인</strong>
              </div>
            </div>
          </div>
        `;
      }

      const selected = (group.advanceIds || []).includes(player.id);
      return `
        <button class="slot ${selected ? "selected" : ""}" onclick="toggleAdvance(${roundIndex}, ${stageIndex}, '${escapeAttr(group.id)}', '${escapeAttr(player.id)}')">
          <div class="slot-inner">
            <span class="lane-label">${player.lane}LANE</span>
            <div class="player-info">
              <strong>${escapeHtml(player.name)}</strong>
              ${player.team ? `<div class="team">${escapeHtml(player.team)}</div>` : ""}
            </div>
            ${selected ? `<span class="advance-mark">진출</span>` : ""}
          </div>
        </button>
      `;
    }


    function renderTournamentStatusPanel() {
      ensureStateDefaults();
      const status = state.tournament.status || "draft";
      const tournamentName = state.tournament.name || "대회명 없음";
      const venueName = state.tournament.venue || "경기장 없음";
      const actionButtons = status === "draft"
        ? `<button class="primary" onclick="startTournament()">대회 시작</button>`
        : status === "running"
          ? `<button class="primary" onclick="finishTournament()">대회 종료</button>`
          : status === "finished"
            ? `<button class="ghost" onclick="reopenTournament()">종료 취소</button><button class="ghost" onclick="archiveTournament()">기록 저장 완료</button>`
            : `<button class="ghost" onclick="reopenTournament()">다시 진행</button>`;

      return `
        <section class="status-panel">
          <div class="status-main">
            <span class="status-badge status-${status}">${statusLabel(status)}</span>
            <div class="status-title-block">
              <strong>${escapeHtml(tournamentName)}</strong>
              <span>${escapeHtml(venueName)}</span>
            </div>
          </div>
          <div class="status-time-block">
            <span>시작 ${state.tournament.startedAtDisplay || "-"}</span>
            <span>종료 ${state.tournament.endedAtDisplay || "-"}</span>
          </div>
          <div class="status-actions">${actionButtons}</div>
        </section>
      `;
    }

    function renderFinalRace() {
      const finalists = state.qualifierRounds.map(round => round.finalist).filter(Boolean);

      if (!state.finalRace) {
        return `
          <section class="final-box">
            <h2>최종 결승</h2>
            <p class="hint">${state.settings.laneCount}명의 라운드 결승 진출자가 모두 확정되면 최종 결승을 진행할 수 있습니다.</p>
            <div class="finalist-grid">
              ${state.qualifierRounds.map(round => `<div class="finalist-item"><b>${round.title}</b><br>${round.finalist ? `${escapeHtml(round.finalist.name)}${round.finalist.team ? " / " + escapeHtml(round.finalist.team) : ""}` : "대기중"}</div>`).join("")}
            </div>
            <button class="primary" style="margin-top:12px;" onclick="createFinalRace()">최종 결승 진행</button>
          </section>
        `;
      }

      const winners = state.finalRace.group.slots.filter(player => !player.isEmptyLane && state.finalRace.group.advanceIds.includes(player.id));
      const isBroadcast = state.broadcast.mode === "final";

      return `
        <section class="final-box">
          <div class="round-head" style="margin-bottom:12px;">
            <h2>최종 결승 ${isBroadcast ? `<span class="round-badge live-badge">● TV 송출중</span>` : ""}</h2>
            <button class="${isBroadcast ? "primary" : "ghost"}" onclick="state.broadcast={mode:'final'}; renderOperator();">최종 결승 TV 송출</button>
          </div>
          <div class="groups" style="grid-template-columns:1fr;">
            <article class="group">
              <div class="group-title">
                <strong>FINAL</strong>
                <span class="badge">${state.settings.laneCount}레인</span>
              </div>
              ${state.finalRace.group.slots.map(player => {
                if (player.isEmptyLane) {
                  return `
                    <div class="slot empty-lane">
                      <div class="slot-inner">
                        <span class="lane-label">${player.lane}LANE</span>
                        <div class="player-info"><strong>빈 레인</strong></div>
                      </div>
                    </div>
                  `;
                }

                const selected = state.finalRace.group.advanceIds.includes(player.id);
                return `
                  <button class="slot ${selected ? "selected" : ""}" onclick="toggleFinalWinner('${escapeAttr(player.id)}')">
                    <div class="slot-inner">
                      <span class="lane-label">${player.lane}LANE</span>
                      <div class="player-info">
                        <strong>${escapeHtml(player.name)}</strong>
                        ${player.team ? `<div class="team">${escapeHtml(player.team)}</div>` : ""}
                      </div>
                      ${selected ? `<span class="advance-mark">최종</span>` : ""}
                    </div>
                  </button>
                `;
              }).join("")}
            </article>
          </div>
          ${winners.length ? `<div class="champion"><small>FINAL RESULT</small><strong>${winners.map(p => escapeHtml(p.name)).join(", ")}</strong><span>${winners.length > 1 ? "공동 최종 선정" : "최종 우승자"}</span></div>` : ""}
