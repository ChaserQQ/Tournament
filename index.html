    function getBroadcastTarget(payload) {
      const broadcast = payload.broadcast || { mode: "stage", roundIndex: 0, stageIndex: 0 };

      if (broadcast.mode === "final" && payload.finalRace) {
        return {
          title: "최종 결승",
          laneCount: payload.settings.laneCount,
          groups: [payload.finalRace.group],
          isFinal: true,
          stageType: "final"
        };
      }

      const round = payload.qualifierRounds?.[broadcast.roundIndex];
      const stage = round?.stages?.[broadcast.stageIndex];
      if (!round || !stage) {
        const fallbackRound = payload.qualifierRounds?.find(item => item.stages?.length);
        const fallbackStage = fallbackRound?.stages?.[fallbackRound.stages.length - 1];
        if (!fallbackRound || !fallbackStage) return null;
        return {
          title: `${fallbackRound.title} · ${fallbackStage.name}`,
          laneCount: payload.settings.laneCount,
          groups: fallbackStage.groups,
          isFinal: false,
          stageType: fallbackStage.type || "normal"
        };
      }

      return {
        title: `${round.title} · ${stage.name}`,
        laneCount: payload.settings.laneCount,
        groups: stage.groups,
        isFinal: false,
        stageType: stage.type || "normal"
      };
    }

    function chunk(items, size) {
      const result = [];
      for (let i = 0; i < items.length; i += size) result.push(items.slice(i, i + size));

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");

        active: true,
        createdAt: new Date().toISOString()

      saveRoster(roster);

    function importRosterJsonFromText() {
      const text = document.getElementById("importJsonText")?.value.trim();
      if (!text) {
        alert("불러올 JSON 내용을 붙여넣으세요.");
        return;
      }

      try {
        const data = JSON.parse(text);
        if (!Array.isArray(data)) throw new Error("not array");
        const cleaned = data.map(player => ({
          id: player.id || rosterId(),
          name: String(player.name || "").trim(),
          team: String(player.team || "").trim(),
          nickname: String(player.nickname || "").trim(),
          memo: String(player.memo || "").trim(),
          favorite: Boolean(player.favorite),
          active: player.active !== false,
          createdAt: player.createdAt || new Date().toISOString()
        })).filter(player => player.name);

        if (!cleaned.length) {
          alert("불러올 선수가 없습니다.");
          return;
        }

        if (!confirm(`선수 ${cleaned.length}명을 불러옵니다. 기존 명부를 교체할까요?`)) return;
        saveRoster(cleaned);
        dbSelectedIds = new Set();
        renderDbPage();
      } catch (error) {
        alert("JSON 형식이 올바르지 않습니다.");
      }
    }

    function quickImportRosterLines() {
      const text = document.getElementById("quickImportText")?.value.trim();
      if (!text) {
        alert("이름/팀명 목록을 붙여넣으세요.");
        return;
      }

      const current = loadRoster();
      const existingKey = new Set(current.map(player => `${player.name}|${player.team || ""}`));

      const added = text.split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {
          const parts = line.includes("/") ? line.split("/") : line.includes("\t") ? line.split("\t") : line.split(",");
          return {
            name: (parts[0] || "").trim(),
            team: (parts[1] || "").trim()
          };
        })
        .filter(player => player.name)
        .filter(player => {
          const key = `${player.name}|${player.team || ""}`;
          if (existingKey.has(key)) return false;
          existingKey.add(key);
          return true;
        })
        .map(player => ({
          id: rosterId(),
          name: player.name,
          team: player.team,
          nickname: "",
          memo: "",
          favorite: false,
          active: true,
          createdAt: new Date().toISOString()
        }));

      if (!added.length) {
        alert("새로 추가할 선수가 없습니다.");
        return;
      }

      saveRoster([...current, ...added]);
      renderDbPage();
    }

    function toCsv(rows) {
      return rows.map(row => row.map(value => {
        const text = String(value ?? "");
        return `"${text.replace(/"/g, '""')}"`;
      }).join(",")).join("\n");
    }

    function downloadTextFile(filename, text) {
      const blob = new Blob(["\ufeff" + text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function renderDbPage() {
      document.body.classList.remove("tv-mode");

      const roster = loadRoster();
      const search = dbSearchText.trim().toLowerCase();
      const teams = Array.from(new Set(roster.map(player => player.team).filter(Boolean))).sort();
      const filtered = roster.filter(player => {
        const matchesSearch = !search || [player.name, player.team, player.nickname, player.memo].some(value => String(value || "").toLowerCase().includes(search));
        const matchesTeam = dbTeamFilter === "전체" || (player.team || "") === dbTeamFilter;
        return matchesSearch && matchesTeam;
      });
      const activeCount = roster.filter(player => player.active).length;
      const favoriteCount = roster.filter(player => player.favorite).length;

      app.innerHTML = `
        <div class="db-page">
          <header class="header">
            <div class="header-copy">
              <div class="brand-line">
                <div class="eyebrow">MINI4WD TOURNAMENT MAKER</div>
                <div class="maker">made by GEEKS 마이 · Special Thanks to SOON.D</div>
              </div>
              <h1>선수 DB / 오늘 참가자 관리</h1>
              <p class="desc">자주 참가하는 선수를 명부로 저장하고, 오늘 참가자만 선택해서 대진표로 보낼 수 있습니다.</p>
            </div>
            <img class="header-logo" src="${LOGO_SRC}" alt="Geeks logo" />
          </header>

          <div class="toolbar">
            <button class="primary" onclick="location.hash=''; renderOperator();">TOURNAMENT</button>
            <button class="ghost" onclick="exportRosterCsv()">CSV 다운로드</button>
            <button class="ghost" onclick="exportRosterJson()">JSON 백업</button>
            <button class="ghost" onclick="downloadRosterTemplate()">선수 양식</button>
            <label class="upload-button ghost">
              엑셀 업로드
              <input type="file" accept=".xlsx,.xls,.csv,.tsv" onchange="importRosterExcel(event)" hidden />
            </label>
          </div>

          <div class="db-grid">
            <aside>
              <section class="card">
                <div class="db-panel-title"><h2>선수 빠른 추가</h2><span class="pill">Roster</span></div>
                <div class="form-grid">
                  <div><label>선수명</label><input class="mini-input" id="dbName" placeholder="홍길동" /></div>
                  <div><label>팀명</label><input class="mini-input" id="dbTeam" placeholder="OPEN CLASS" /></div>
                  <div><label>닉네임</label><input class="mini-input" id="dbNickname" placeholder="마이" /></div>
                  <div><label>메모</label><input class="mini-input" id="dbMemo" placeholder="차량/특이사항" /></div>
                </div>
                <button class="primary" style="width:100%; margin-top:12px;" onclick="addRosterPlayer()">선수 추가</button>
              </section>

              <section class="card selected-box">
                <div class="db-panel-title"><h2>오늘 참가자</h2><span class="pill"><span id="selectedCount">0</span>명 선택</span></div>
                <div class="db-actions" style="margin-bottom:10px;">
                  <button class="ghost" onclick="selectRecentPlayers()">최근 참가자</button>
                  <button class="ghost" onclick="selectFavoritePlayers()">즐겨찾기</button>
                  <button class="ghost" onclick="clearSelectedPlayers()">선택 해제</button>
                </div>
                <div id="selectedPreview" class="finalist-grid" style="grid-template-columns:1fr;"></div>
                <button class="primary" style="width:100%; margin-top:12px;" onclick="applySelectedPlayersToTournament()">선택 선수로 대진 생성 준비</button>
              </section>

              <section class="card">
                <h2>목록 일괄 추가</h2>
                <p class="hint">한 줄에 한 명씩 입력합니다. 형식: 이름/팀명</p>
                <textarea id="quickImportText" style="min-height:150px;" placeholder="OPEN CLASS"></textarea>
                <button class="ghost" style="width:100%; margin-top:10px;" onclick="quickImportRosterLines()">목록에서 선수 추가</button>
              </section>

              <section class="card">
                <h2>JSON 복원</h2>
                <p class="hint">백업 JSON 내용을 붙여넣으면 기존 선수 명부를 교체합니다.</p>
                <textarea id="importJsonText" style="min-height:130px;"></textarea>
                <button class="danger" style="width:100%; margin-top:10px;" onclick="importRosterJsonFromText()">JSON 불러오기</button>
              </section>
            </aside>

            <main>
              <section class="card">
                <div class="db-panel-title">
                  <div>
                    <h2>선수 명부</h2>
                    <div class="meta">총 ${roster.length}명 · 표시 ${filtered.length}명</div>
                  </div>
                  <div class="db-actions">
                    <input class="mini-input" placeholder="검색" value="${escapeHtml(dbSearchText)}" oninput="setDbSearch(this.value)" style="width:180px;" />
                    <select onchange="setDbTeamFilter(this.value)" style="width:150px;">
                      <option value="전체">전체 팀</option>
                      ${teams.map(team => `<option value="${escapeHtml(team)}" ${team === dbTeamFilter ? "selected" : ""}>${escapeHtml(team)}</option>`).join("")}
                    </select>
                  </div>
                </div>

                <div class="db-stat-grid">
                  <div class="db-stat"><small>전체 선수</small><strong>${roster.length}</strong></div>
                  <div class="db-stat"><small>활성 선수</small><strong>${activeCount}</strong></div>
                  <div class="db-stat"><small>즐겨찾기</small><strong>${favoriteCount}</strong></div>
                </div>

                <div class="roster-table-wrap">
                  <table class="roster-table">
                    <thead>
                      <tr>
                        <th>참가</th>
                        <th>★</th>
                        <th>선수명</th>
                        <th>팀명</th>
                        <th>닉네임</th>
                        <th>상태</th>
                        <th>메모</th>
                        <th>관리</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${filtered.map(player => renderRosterRow(player)).join("") || `<tr><td colspan="8"><div class="db-empty">등록된 선수가 없습니다.</div></td></tr>`}
                    </tbody>
                  </table>
                </div>
              </section>
            </main>
          </div>
        </div>
      `;

      updateSelectedPreview();
    }

    function renderRosterRow(player) {
      return `
        <tr>
          <td data-label="참가"><input type="checkbox" data-roster-select value="${escapeAttr(player.id)}" ${dbSelectedIds.has(player.id) ? "checked" : ""} ${player.active ? "" : "disabled"} onchange="toggleDbSelected('${escapeAttr(player.id)}', this.checked)" /></td>
          <td data-label="즐겨찾기"><button class="ghost" onclick="toggleRosterField('${escapeAttr(player.id)}', 'favorite')">${player.favorite ? "★" : "☆"}</button></td>
          <td data-label="선수명"><input class="mini-input" value="${escapeHtml(player.name)}" onchange="updateRosterInline('${escapeAttr(player.id)}', 'name', this.value)" /></td>
          <td data-label="팀명"><input class="mini-input" value="${escapeHtml(player.team || "")}" onchange="updateRosterInline('${escapeAttr(player.id)}', 'team', this.value)" /></td>
          <td data-label="닉네임"><input class="mini-input" value="${escapeHtml(player.nickname || "")}" onchange="updateRosterInline('${escapeAttr(player.id)}', 'nickname', this.value)" /></td>
          <td data-label="상태"><button class="${player.active ? "primary" : "ghost"}" onclick="toggleRosterField('${escapeAttr(player.id)}', 'active')">${player.active ? "활성" : "비활성"}</button></td>
          <td data-label="메모"><input class="mini-input" value="${escapeHtml(player.memo || "")}" onchange="updateRosterInline('${escapeAttr(player.id)}', 'memo', this.value)" /></td>
          <td data-label="관리"><button class="danger" onclick="deleteRosterPlayer('${escapeAttr(player.id)}')">삭제</button></td>
        </tr>
      `;
    }


    function getTournamentMeta() {
      ensureStateDefaults();
      return {
        경기일시: state.tournament.startedAtDisplay || "",
        대회명: state.tournament.name || "",
        경기장: state.tournament.venue || "",
        경기방식: matchModeLabel(),
        레인수: `${state.settings.laneCount}레인`,
        대회상태: statusLabel(),
        종료일시: state.tournament.endedAtDisplay || ""
      };
    }

    function getStageResultRows() {
      const meta = getTournamentMeta();
      const rows = [];

      state.qualifierRounds.forEach(round => {
        (round.stages || []).forEach(stage => {
          stage.groups.forEach(group => {
            group.slots.forEach(player => {
              const isFinalist = round.finalist && round.finalist.id === player.id;
              const isAdvanced = (group.advanceIds || []).includes(player.id);
              const score = stage.type === "points" && !player.isEmptyLane ? Number((group.points || {})[player.id] ?? 0) : "";
              let result = "";

              if (player.isEmptyLane) result = "빈 레인";
              else if (stage.type === "points") result = "포인트";
              else if (isFinalist) result = "최종결승진출";
              else if (isAdvanced) result = "진출";
              else result = "탈락";

              rows.push({
                ...meta,
                차수: round.title,
                단계: stage.name,
                조: group.name,
                레인: `${player.lane}LANE`,
                선수명: player.name,
                팀명: player.team || "",
                점수: score,
                결과: result,
                비고: stage.type || ""
              });
            });
          });
        });
      });

      if (state.finalRace) {
        state.finalRace.group.slots.forEach(player => {
          const selected = (state.finalRace.group.advanceIds || []).includes(player.id);
          rows.push({
            ...meta,
            차수: "최종 결승",
            단계: "FINAL",
            조: "FINAL",
            레인: `${player.lane}LANE`,
            선수명: player.name,
            팀명: player.team || "",
            점수: "",
            결과: player.isEmptyLane ? "빈 레인" : selected ? "최종우승" : "결승참가",
            비고: "final"
          });
        });
      }

      return rows;
    }

    function exportTournamentCsv() {
      ensureTournamentStarted();
      const rows = getStageResultRows();
      if (!rows.length) {
        alert("다운로드할 경기 결과가 없습니다.");
        return;
      }
      const headers = ["경기일시", "종료일시", "대회상태", "대회명", "경기장", "경기방식", "레인수", "차수", "단계", "조", "레인", "선수명", "팀명", "점수", "결과", "비고"];
      const csvRows = [headers, ...rows.map(row => headers.map(header => row[header] ?? ""))];
      downloadTextFile(`tournament_result_${Date.now()}.csv`, toCsv(csvRows));
    }

    function exportTournamentJson() {
      ensureTournamentStarted();
      const payload = {
        meta: getTournamentMeta(),
        state: exportState(),
        rows: getStageResultRows()
      };
      downloadTextFile(`tournament_record_${Date.now()}.json`, JSON.stringify(payload, null, 2));
    }

    function getCurrentStageForPrint(payload = state) {
      const broadcast = payload.broadcast || { mode: "stage", roundIndex: 0, stageIndex: 0 };
      if (broadcast.mode === "final" && payload.finalRace) {
        return { title: "최종 결승 · FINAL", groups: [payload.finalRace.group], isFinal: true };
      }
      const round = payload.qualifierRounds?.[broadcast.roundIndex];
      const stage = round?.stages?.[broadcast.stageIndex] || round?.stages?.[round.stages.length - 1];
      if (!round || !stage) return null;
      return { title: `${round.title} · ${stage.name}`, groups: stage.groups, stage };
    }

    function openPrintView() {
      saveLiveState();
      window.open(`${location.origin}${location.pathname}#view=print`, "_blank", "noopener,noreferrer");
    }

    function exportPrintExcel() {
      let payload = null;
      try {
        payload = JSON.parse(localStorage.getItem(STORAGE_KEY) || "");
      } catch (error) {
        payload = exportState();
      }
      if (!payload) payload = exportState();

      const printable = getCurrentStageForPrint(payload);
      if (!printable || !printable.groups?.length) {
        alert("엑셀로 저장할 출력용 대진표가 없습니다.");
        return;
      }

      const meta = payload.tournament || {};
      const settings = payload.settings || {};
      const rows = [
        ["대회명", meta.name || ""],
        ["경기장", meta.venue || ""],
        ["경기일시", meta.startedAtDisplay || ""],
        ["경기방식", matchModeLabel(settings.matchMode)],
        ["레인수", `${settings.laneCount || 3}레인`],
        ["단계", printable.title || ""],
        [],
        ["조", "레인", "선수명"]
      ];

      printable.groups.forEach(group => {
        group.slots.forEach(slot => {
          rows.push([group.name, `${slot.lane}LANE`, slot.isEmptyLane ? "빈 레인" : slot.name]);
        });
      });

      const filename = `print_bracket_${Date.now()}.xlsx`;

      if (window.XLSX) {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws["!cols"] = [{ wch: 12 }, { wch: 12 }, { wch: 28 }];
        XLSX.utils.book_append_sheet(wb, ws, "출력용대진표");
        XLSX.writeFile(wb, filename);
      } else {
        downloadTextFile(filename.replace(".xlsx", ".csv"), toCsv(rows));
      }
    }

    function renderPrintView() {
      document.body.classList.remove("tv-mode");
      let payload = null;
      try {
        payload = JSON.parse(localStorage.getItem(STORAGE_KEY) || "");
      } catch (error) {
        payload = exportState();
      }
      if (!payload) payload = exportState();

      const printable = getCurrentStageForPrint(payload);
      const meta = payload.tournament || {};
      const settings = payload.settings || {};
      const groups = printable?.groups || [];
      const actualCount = groups.reduce((sum, group) => sum + group.slots.filter(slot => !slot.isEmptyLane).length, 0);
      const densityClass = groups.length >= 36 ? "print-ultra" : groups.length >= 24 ? "print-compact" : groups.length >= 12 ? "print-medium" : "print-wide";

      app.innerHTML = `
        <div class="print-page ${densityClass}">
          <div class="print-controls">
            <button onclick="window.print()">인쇄</button>
            <button onclick="exportPrintExcel()">엑셀 다운로드</button>
            <button onclick="location.hash=''; boot()">운영 화면</button>
          </div>

          <header class="print-header">
            <div>
              <h1>${escapeHtml(meta.name || "대회명 미입력")}</h1>
              <p>${escapeHtml(meta.venue || "경기장 미입력")} · ${escapeHtml(meta.startedAtDisplay || "")} · ${escapeHtml(matchModeLabel(settings.matchMode))} · ${settings.laneCount || 3}레인</p>
            </div>
            <strong>${escapeHtml(printable?.title || "출력할 대진 없음")}</strong>
          </header>

          <div class="print-summary">
            참가 ${actualCount}명 · ${groups.length}개 조 · 팀명 미표기 · 빈 레인 표시
          </div>

          <main class="print-grid">
            ${groups.map(group => `
              <section class="print-group">
                <h2>${escapeHtml(group.name)}</h2>
                <table>
                  <tbody>
                    ${group.slots.map(slot => `
                      <tr class="${slot.isEmptyLane ? "print-empty" : ""}">
                        <td>${slot.lane}LANE</td>
                        <td>${escapeHtml(slot.isEmptyLane ? "빈 레인" : slot.name)}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </section>
            `).join("")}
          </main>
        </div>
      `;
    }



    function downloadRosterTemplate() {
      const rows = [
        ["선수명", "팀명", "닉네임", "메모", "활성여부", "즐겨찾기"],
        ["김철수", "GEEKS", "마이", "MS 플렉스", "TRUE", "TRUE"],
        ["박민수", "ATHENS", "", "신규 참가자", "TRUE", "FALSE"]
      ];

      if (window.XLSX) {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(rows);
        XLSX.utils.book_append_sheet(wb, ws, "선수등록양식");
        XLSX.writeFile(wb, "mini4wd_player_upload_template.xlsx");
      } else {
        downloadTextFile("mini4wd_player_upload_template.csv", toCsv(rows));
      }
    }

    function parseBooleanCell(value, defaultValue = false) {
      if (value === undefined || value === null || value === "") return defaultValue;
      const text = String(value).trim().toLowerCase();
      return ["true", "y", "yes", "1", "활성", "사용", "예"].includes(text);
    }

    function importRosterExcel(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const ext = file.name.split(".").pop().toLowerCase();
      const reader = new FileReader();

      reader.onload = e => {
        try {
          let rows = [];

          if ((ext === "xlsx" || ext === "xls") && window.XLSX) {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: "array" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
          } else {
            const text = e.target.result;
            const lines = text.split(/\r?\n/).filter(Boolean);
            const headers = lines.shift().split(/,|\t/).map(h => h.replace(/^"|"$/g, "").trim());
            rows = lines.map(line => {
              const cells = line.split(/,|\t/).map(cell => cell.replace(/^"|"$/g, "").trim());
              const obj = {};
              headers.forEach((header, index) => obj[header] = cells[index] || "");
              return obj;
            });
          }

          const current = loadRoster();
          const existingKey = new Set(current.map(player => `${player.name}|${player.team || ""}`));
          const imported = [];
          const duplicated = [];

          rows.forEach(row => {
            const name = String(row["선수명"] || row["name"] || "").trim();
            const team = String(row["팀명"] || row["team"] || "").trim();
            if (!name) return;

            const key = `${name}|${team || ""}`;
            if (existingKey.has(key)) {
              duplicated.push(key);
              return;
            }

            existingKey.add(key);
            imported.push({
              id: rosterId(),
              name,
              team,
              nickname: String(row["닉네임"] || row["nickname"] || "").trim(),
              memo: String(row["메모"] || row["memo"] || "").trim(),
              active: parseBooleanCell(row["활성여부"], true),
              favorite: parseBooleanCell(row["즐겨찾기"], false),
              createdAt: new Date().toISOString()
            });
          });

          if (!imported.length) {
            alert(`추가할 선수가 없습니다. 중복 ${duplicated.length}건`);
            event.target.value = "";
            return;
          }

          const message = `선수 ${imported.length}명을 추가합니다.` + (duplicated.length ? `\\n중복 제외 ${duplicated.length}건` : "");
          if (!confirm(message)) {
            event.target.value = "";
            return;
          }

          saveRoster([...current, ...imported]);
          event.target.value = "";
          renderDbPage();
        } catch (error) {
          alert("업로드 파일을 읽는 중 오류가 발생했습니다. 선수 등록 양식을 사용해 주세요.");
          event.target.value = "";
        }
      };

      if (ext === "xlsx" || ext === "xls") reader.readAsArrayBuffer(file);
      else reader.readAsText(file, "utf-8");
    }


    function boot() {
      const params = getHashParams();
      const view = params.get("view");
      const data = params.get("data");

      if (view === "db") {
        renderDbPage();
        return;
      }

      if (view === "print") {
        renderPrintView();
        return;
      }

      if (view === "tv-live") {
        renderTvLiveView();
        return;
      }

      if ((view === "tv" || view === "mobile") && data) {
        try {
          renderTvSnapshot(decodePayload(data), view);
        } catch (error) {
          app.innerHTML = `<div class="wrap"><div class="empty"><div><h2>공유 데이터를 읽을 수 없습니다</h2><p>링크가 손상되었거나 너무 깁니다.</p></div></div></div>`;
        }
        return;
      }

      const pending = localStorage.getItem(PENDING_PARTICIPANTS_KEY);
      if (pending) {
        state.inputText = pending;
        localStorage.removeItem(PENDING_PARTICIPANTS_KEY);
      }

      renderOperator();
    }

    boot();
  </script>
</body>
