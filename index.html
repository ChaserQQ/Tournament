    async function bootV33() {
      try {
        const params = getHashParams();
        const view = params.get("view");
        const data = params.get("data");
        getCurrentTournamentId();
        initFirebase();
        if (view === "tv-live") { document.body.classList.add("tv-mode"); app.innerHTML = `<div class="tv-wrap"><div class="tv-empty"><div class="tv-brand-line"><small>MINI4WD TOURNAMENT MAKER</small><div class="maker">made by GEEKS M.Y · Special Thanks to SOON.D</div></div><strong>라이브 연결중</strong></div></div>`; watchFirebaseState("tv-live"); return; }
        if (view === "live-list" || view === "lobby") { renderLiveLobbyPage(); return; }
        if (view === "mobile-live" || view === "live") {
          const params = getHashParams();
          if (!params.get("t") && !params.get("tournamentId")) { renderLiveLobbyPage(); return; }
          app.innerHTML = `<div class="wrap"><div class="empty"><div><h2>라이브 연결중</h2><p>대회 ID: ${escapeHtml(getCurrentTournamentId())}</p></div></div></div>`;
          watchFirebaseState("mobile-live");
          return;
        }
        if ((view === "tv" || view === "mobile") && data) { try { renderTvSnapshot(decodePayload(data), view); } catch (error) { app.innerHTML = `<div class="wrap"><div class="empty"><div><h2>공유 데이터를 읽을 수 없습니다</h2><p>링크가 손상되었거나 너무 깁니다.</p></div></div></div>`; } return; }
        if (view === "dashboard") {
          await initAuthState();
          if (!currentAuthUser) { renderLoginPage("대시보드는 로그인 후 이용할 수 있습니다."); return; }
          if (!canViewDashboard()) { renderRestrictedPage("대시보드 권한 없음", "관리자가 대시보드 권한을 부여해야 합니다."); return; }
          renderDashboardPage();
          return;
        }
        await initAuthState();
        if (view === "login") { renderLoginPage("로그인하세요."); return; }
        if (!currentAuthUser) { renderLoginPage(); return; }
        if (!canOperate()) { renderRestrictedPage("운영 권한 없음", "관리자가 운영 권한을 부여해야 합니다."); return; }
        if (isVenueUser()) state.tournament.venue = currentVenueName();
        if (view === "admin") { renderAdminPage(); return; }
        if (view === "db") { renderDbPage(); return; }
        if (view === "print") { renderPrintView(); return; }
        const pending = localStorage.getItem(PENDING_PARTICIPANTS_KEY);
        if (pending) { state.inputText = pending; localStorage.removeItem(PENDING_PARTICIPANTS_KEY); }
        renderOperator();
      } catch (error) {
        console.error(error);
        app.innerHTML = `<div class="wrap"><div class="empty"><div><h2>화면을 여는 중 오류가 발생했습니다</h2><p>${escapeHtml(error.message || String(error))}</p></div></div></div>`;
      }
    }

    function setMatchMode(mode) {
      ensureStateDefaults();
      if (isTournamentLocked() && !confirm("대회가 시작/종료된 상태입니다. 경기 방식을 바꾸면 기록이 꼬일 수 있습니다. 계속할까요?")) return;
      if (state.qualifierRounds.some(round => round.stages.length) || state.finalRace) {
        if (!confirm("경기 방식을 바꾸면 현재 대진표가 라운드 초기화됩니다. 계속할까요?")) return;
      }
      const currentTournament = { ...state.tournament };
      const inputText = state.inputText;
      const previousSettings = { ...state.settings, matchMode: mode };
      if (mode === "crow") previousSettings.laneCount = 3;
      state = makeInitialState(previousSettings.laneCount || 3);
      state.inputText = inputText;
      state.tournament = currentTournament;
      state.settings = { ...state.settings, ...previousSettings, matchMode: mode };
      state.qualifierRounds = makeQualifierRounds(state.settings.laneCount, mode);
      state.finalRace = null;
      activeRoundIndex = 0;
      renderOperator();
    }

    function normalizePlayerForFinal(player, extra = {}) {
      return { id: player.id, name: player.name, nickname: player.nickname || player.name, team: player.team || "", realName: player.realName || "", contact: player.contact || "", ...extra };
    }

    function getCrowRoundRank(round, rank) {
      const list = round?.crowFinalists || [];
      return list.find(player => Number(player.crowRank) === Number(rank)) || null;
    }

    function getCrowRankHtml(round) {
      const selected = round?.crowFinalists || [];
      if (!selected.length) return `<div class="hint">라운드 결승에서 1위→2위→3위 순서로 선수를 선택한 뒤 1~3위 확정을 누르세요.</div>`;
      return `<div class="crow-rank-list">${[1,2,3].map(rank => {
        const player = selected.find(item => Number(item.crowRank) === rank);
        return `<div class="crow-rank-item"><b>${rank}위</b><span>${player ? `${escapeHtml(player.name)}${player.team ? " / " + escapeHtml(player.team) : ""}` : "미확정"}</span></div>`;
      }).join("")}</div>`;
    }

    function confirmRoundFinalist(roundIndex) {
      const round = state.qualifierRounds[roundIndex];
      if (!round || !round.stages.length) return showError("먼저 해당 라운드를 진행하세요.");
      const lastStage = round.stages[round.stages.length - 1];
      const validFinalStage = lastStage.name === "라운드 결승" || lastStage.name === "결승" || lastStage.type === "pointFinal";
      if (!validFinalStage) return showError(isRevivalMode() ? "결승 경기에서만 우승자를 확정할 수 있습니다." : "라운드 결승 또는 포인트 상위 결정전에서만 확정할 수 있습니다.");
      const selected = getSelectedFromStage(lastStage);

      if (isCrowMode()) {
        if (selected.length !== 3) return showError("9강 준결 방식은 각 라운드 결승에서 1~3위 3명을 선택해야 합니다. 선택 순서가 1위, 2위, 3위입니다.");
        round.crowFinalists = selected.slice(0, 3).map((player, index) => normalizePlayerForFinal(player, { crowRank: index + 1, sourceRoundIndex: round.index }));
        round.finalist = round.crowFinalists[0];
        state.finalRace = null;
        state.broadcast = { mode: "stage", roundIndex, stageIndex: round.stages.length - 1 };
        logTournamentAction("9강 순위 확정", `${round.title}: ${round.crowFinalists.map(p => `${p.crowRank}위 ${p.name}`).join(" / ")}`);
        renderOperator();
        return;
      }

      if (selected.length === 0) return showError(isRevivalMode() ? "우승자를 선택하세요." : "최종 결승 진출자를 선택하세요.");
      if (selected.length > 1) return showError(isRevivalMode() ? "우승자는 1명만 선택해야 합니다." : "각 라운드의 최종 결승 진출자는 1명만 선택해야 합니다.");
      round.finalist = selected[0];
      state.finalRace = null;
      state.broadcast = { mode: "stage", roundIndex, stageIndex: round.stages.length - 1 };
      renderOperator();
    }

    function makeCrowSemiGroup(name, players) {
      return {
        id: `crow-${name}-${Math.random().toString(36).slice(2, 8)}`,
        name,
        slots: players.map((player, index) => ({ ...player, lane: index + 1 })),
        advanceIds: []
      };
    }

    function createCrowSemiFinal() {
      const rounds = state.qualifierRounds.slice(0, 3);
      if (rounds.length < 3 || rounds.some(round => (round.crowFinalists || []).length < 3)) {
        return showError("9강 준결 방식은 1~3차 라운드 결승에서 각각 1~3위를 모두 확정해야 합니다.");
      }
      const groups = [
        makeCrowSemiGroup("9강 준결 1조", [getCrowRoundRank(rounds[0], 1), getCrowRoundRank(rounds[1], 2), getCrowRoundRank(rounds[2], 3)]),
        makeCrowSemiGroup("9강 준결 2조", [getCrowRoundRank(rounds[0], 2), getCrowRoundRank(rounds[1], 3), getCrowRoundRank(rounds[2], 1)]),
        makeCrowSemiGroup("9강 준결 3조", [getCrowRoundRank(rounds[0], 3), getCrowRoundRank(rounds[1], 1), getCrowRoundRank(rounds[2], 2)])
      ];
      state.finalRace = {
        id: `crow-semi-${Math.random().toString(36).slice(2, 8)}`,
        type: "crowSemi",
        name: "9강 최종 준결",
        groupSize: 3,
        groups
      };
      state.broadcast = { mode: "final" };
      logTournamentAction("9강 준결 생성", "9명 준결 편성");
      renderOperator();
    }

    function createCrowFinalFromSemi() {
      if (!state.finalRace || state.finalRace.type !== "crowSemi") return;
      const winners = (state.finalRace.groups || []).flatMap(group => group.slots.filter(player => !player.isEmptyLane && (group.advanceIds || []).includes(player.id)));
      if (winners.length !== 3) return showError("9강 준결 각 조에서 결승 진출자 1명씩 총 3명을 선택하세요.");
      state.finalRace = {
        id: `crow-final-${Math.random().toString(36).slice(2, 8)}`,
        type: "crowFinal",
        name: "9강 최종 결승",
        groupSize: 3,
        group: {
          id: `crow-final-group-${Math.random().toString(36).slice(2, 8)}`,
          name: "FINAL",
          slots: assignLanes(winners, 3),
          advanceIds: []
        }
      };
      state.broadcast = { mode: "final" };
      logTournamentAction("결승 생성", winners.map(p => p.name).join(" / "));
      renderOperator();
    }

    function createFinalRace() {
      if (!canModifyTournamentAction("최종 결승 생성")) return;
      if (isCrowMode()) return createCrowSemiFinal();
      const finalists = state.qualifierRounds.map(round => round.finalist).filter(Boolean);
      if (finalists.length < state.settings.laneCount) return showError(`${state.settings.laneCount}명의 최종 결승 진출자가 모두 확정되어야 합니다.`);
      state.finalRace = {
        id: `final-${Math.random().toString(36).slice(2, 8)}`,
        name: "최종 결승",
        groupSize: state.settings.laneCount,
        group: { id: `final-group-${Math.random().toString(36).slice(2, 8)}`, name: "FINAL", slots: assignLanes(finalists, state.settings.laneCount), advanceIds: [] }
      };
      state.broadcast = { mode: "final" };
      logTournamentAction("최종 결승 생성", "FINAL");
      renderOperator();
    }

    function getFinalGroups(finalRace = state.finalRace) {
      if (!finalRace) return [];
      if (Array.isArray(finalRace.groups)) return finalRace.groups;
      return finalRace.group ? [finalRace.group] : [];
    }

    function toggleFinalWinner(playerId, groupId = "") {
      if (!state.finalRace) return;
      const groups = getFinalGroups();
      const group = groupId ? groups.find(item => item.id === groupId) : groups.find(item => item.slots.some(player => player.id === playerId));
      if (!group) return;
      const player = group.slots.find(item => item.id === playerId);
      if (!player || player.isEmptyLane) return;
      const ids = group.advanceIds || [];
      group.advanceIds = ids.includes(playerId) ? ids.filter(id => id !== playerId) : [...ids, playerId];
      logTournamentAction("최종 진출/우승 선택", player.name || playerId);
      renderOperator();
    }

    function forceFinalLane(groupId, playerId, lane) {
      if (!state.finalRace) return;
      const group = getFinalGroups().find(item => item.id === groupId);
      if (!group) return;
      const target = group.slots.find(item => item.id === playerId);
      const other = group.slots.find(item => Number(item.lane) === Number(lane));
      if (!target || target.isEmptyLane) return;
      const oldLane = target.lane;
      target.lane = Number(lane);
      if (other && other.id !== target.id) other.lane = oldLane;
      group.slots.sort((a, b) => Number(a.lane) - Number(b.lane));
      logTournamentAction("결승 레인 강제 지정", `${target.name}: ${lane}LANE`);
      renderOperator();
    }

    function renderFinalLaneTools(group, player) {
      const maxLane = state.finalRace?.groupSize || state.settings.laneCount || 3;
      return `<div class="final-lane-tools"><span class="hint">레인 지정</span>${Array.from({ length: maxLane }, (_, i) => i + 1).map(lane => `<button class="${Number(player.lane) === lane ? "primary" : "ghost"}" onclick="forceFinalLane('${escapeAttr(group.id)}','${escapeAttr(player.id)}',${lane})">${lane}</button>`).join("")}</div>`;
    }

    function renderFinalGroup(group, finalRaceType) {
      return `<article class="group"><div class="group-title"><strong>${escapeHtml(group.name || "FINAL")}</strong><span class="badge">${group.slots.filter(p => !p.isEmptyLane).length}명</span></div>${(group.slots || []).map(player => {
        if (player.isEmptyLane) return `<div class="slot empty-lane"><div class="slot-inner"><span class="lane-label">${player.lane}LANE</span><div class="player-info"><strong>빈 레인</strong></div></div></div>`;
        const selected = (group.advanceIds || []).includes(player.id);
        return `<div class="slot ${selected ? "selected" : ""}"><div class="slot-inner final-slot-actions"><div><span class="lane-label">${player.lane}LANE</span><div class="player-info"><strong>${escapeHtml(player.name)}</strong>${player.team ? `<div class="team">${escapeHtml(player.team)}</div>` : ""}</div>${selected ? `<span class="advance-mark">${finalRaceType === "crowSemi" ? "결승" : "최종"}</span>` : ""}</div><div class="final-lane-tools"><button class="${selected ? "primary" : "ghost"}" onclick="toggleFinalWinner('${escapeAttr(player.id)}','${escapeAttr(group.id)}')">${selected ? "선택 해제" : finalRaceType === "crowSemi" ? "결승 진출" : "우승 선택"}</button>${renderFinalLaneTools(group, player)}</div></div></div>`;
      }).join("")}</article>`;
    }

    function renderFinalRace() {
      if (!state.finalRace) {
        return `<section class="final-box"><h2>${isCrowMode() ? "9강 최종 준결" : "최종 결승"}</h2><p class="hint">${isCrowMode() ? "각 라운드 결승에서 1~3위를 확정하면 9명 9강 준결을 생성할 수 있습니다." : `${state.settings.laneCount}명의 라운드 결승 진출자가 모두 확정되면 최종 결승을 진행할 수 있습니다.`}</p><div class="finalist-grid">${state.qualifierRounds.map(round => `<div class="finalist-item"><b>${round.title}</b><br>${isCrowMode() ? getCrowRankHtml(round) : (round.finalist ? `${escapeHtml(round.finalist.name)}${round.finalist.team ? " / " + escapeHtml(round.finalist.team) : ""}` : "대기중")}</div>`).join("")}</div><button class="primary" style="margin-top:12px;" onclick="createFinalRace()">${isCrowMode() ? "9강 준결 생성" : "최종 결승 진행"}</button></section>`;
      }
      const groups = getFinalGroups();
      const winners = groups.flatMap(group => group.slots.filter(player => !player.isEmptyLane && (group.advanceIds || []).includes(player.id)));
      const isBroadcast = state.broadcast.mode === "final";
      const isCrowSemi = state.finalRace.type === "crowSemi";
      return `<section class="final-box"><div class="round-head" style="margin-bottom:12px;"><h2>${escapeHtml(state.finalRace.name || "최종 결승")} ${isBroadcast ? `<span class="round-badge live-badge">● TV 송출중</span>` : ""}</h2><div><button class="${isBroadcast ? "primary" : "ghost"}" onclick="state.broadcast={mode:'final'}; renderOperator();">TV 송출</button>${isCrowSemi ? `<button class="primary" onclick="createCrowFinalFromSemi()">결승 생성</button>` : ""}</div></div><div class="groups" style="grid-template-columns:${groups.length > 1 ? "repeat(3,minmax(0,1fr))" : "1fr"};">${groups.map(group => renderFinalGroup(group, state.finalRace.type)).join("")}</div>${winners.length ? `<div class="champion"><small>${isCrowSemi ? "9강 SEMI RESULT" : "FINAL RESULT"}</small><strong>${winners.map(p => escapeHtml(p.name)).join(", ")}</strong><span>${isCrowSemi ? "결승 진출자" : winners.length > 1 ? "공동 최종 선정" : "최종 우승자"}</span></div>` : ""}</section>`;
    }

    function getBroadcastTarget(payload) {
      const broadcast = payload.broadcast || { mode: "stage", roundIndex: 0, stageIndex: 0 };
      if (broadcast.mode === "final" && payload.finalRace) {
        const groups = Array.isArray(payload.finalRace.groups) ? payload.finalRace.groups : [payload.finalRace.group].filter(Boolean);
        return { title: payload.finalRace.name || "최종 결승", laneCount: payload.finalRace.groupSize || payload.settings.laneCount, groups, isFinal: true, stageType: "final", stageName: payload.finalRace.name || "최종 결승", pointTotalsMap: {} };
      }
      const round = payload.qualifierRounds?.[broadcast.roundIndex];
      const stage = round?.stages?.[broadcast.stageIndex] || round?.stages?.[round.stages.length - 1];
      if (!round || !stage) return null;
      const pointTotals = stage.type === "points" ? computePointTotalsUpToStage(round, broadcast.stageIndex) : [];
      const pointTotalsMap = Object.fromEntries(pointTotals.map(player => [player.id, player.total]));
      return { title: `${round.title} · ${stage.name}`, laneCount: payload.settings.laneCount, groups: stage.groups, round, stage, stageType: stage.type || "stage", stageName: stage.name, pointLeaders: stage.type === "points" && stage.name === "포인트 3차전" ? getPointLeadersWithTies(pointTotals, 3) : [], pointTotalsMap };
    }

    function getCurrentStageForPrint(payload = state) {
      const broadcast = payload.broadcast || { mode: "stage", roundIndex: 0, stageIndex: 0 };
      if (broadcast.mode === "final" && payload.finalRace) {
        const groups = Array.isArray(payload.finalRace.groups) ? payload.finalRace.groups : [payload.finalRace.group].filter(Boolean);
        return { title: `${payload.finalRace.name || "최종 결승"} · FINAL`, groups, isFinal: true };
      }
      const round = payload.qualifierRounds?.[broadcast.roundIndex];
      const stage = round?.stages?.[broadcast.stageIndex] || round?.stages?.[round.stages.length - 1];
      if (!round || !stage) return null;
      return { title: `${round.title} · ${stage.name}`, groups: stage.groups, stage };
    }

    function makePublicStatePayload(sourceState = exportState()) {
      let seq = 0;
      const idMap = new Map();
      const publicId = original => {
        const key = String(original || `empty-${seq + 1}`);
        if (!idMap.has(key)) idMap.set(key, `pub-${++seq}`);
        return idMap.get(key);
      };
      const cleanPlayer = player => {
        if (!player) return player;
        if (player.isEmptyLane) return { id: `empty-${player.lane || ++seq}`, lane: player.lane, name: "빈 레인", team: "", isEmptyLane: true };
        const displayName = player.nickname || player.name || player.realName || "참가자";
        return { id: publicId(player.id || displayName), lane: player.lane, name: displayName, nickname: displayName, team: player.team || "", crowRank: player.crowRank || null, sourceRoundIndex: player.sourceRoundIndex || null };
      };
      const cleanGroup = group => {
        const slots = (group?.slots || []).map(cleanPlayer);
        const advanceIds = (group?.advanceIds || []).map(id => idMap.get(String(id)) || publicId(id));
        const points = {};
        Object.entries(group?.points || {}).forEach(([id, value]) => { points[idMap.get(String(id)) || publicId(id)] = value; });
        return { ...(group || {}), slots, advanceIds, points };
      };
      const cleanStage = stage => ({ ...stage, groups: (stage.groups || []).map(cleanGroup) });
      const cleanRound = round => {
        const cleanFinalists = (round.crowFinalists || []).map(cleanPlayer);
        return { id: round.id, index: round.index, title: round.title, stagePlan: round.stagePlan || [], stages: (round.stages || []).map(cleanStage), finalist: round.finalist ? cleanPlayer(round.finalist) : null, crowFinalists: cleanFinalists };
      };
      const publicTournament = { name: sourceState.tournament?.name || "", venue: sourceState.tournament?.venue || "", venueId: sourceState.tournament?.venueId || "", raceClass: normalizeRaceClassName(sourceState.tournament?.raceClass || "오픈"), status: sourceState.tournament?.status || "draft", startedAtISO: sourceState.tournament?.startedAtISO || "", startedAtDisplay: sourceState.tournament?.startedAtDisplay || "", endedAtISO: sourceState.tournament?.endedAtISO || "", endedAtDisplay: sourceState.tournament?.endedAtDisplay || "" };
      const cleanFinalRace = sourceState.finalRace ? { ...sourceState.finalRace } : null;
      if (cleanFinalRace) {
        if (Array.isArray(sourceState.finalRace.groups)) cleanFinalRace.groups = sourceState.finalRace.groups.map(cleanGroup);
        if (sourceState.finalRace.group) cleanFinalRace.group = cleanGroup(sourceState.finalRace.group);
      }
      return { settings: sourceState.settings ? { laneCount: sourceState.settings.laneCount, matchMode: sourceState.settings.matchMode } : {}, tournament: publicTournament, activeRoundIndex: sourceState.activeRoundIndex || 0, broadcast: sourceState.broadcast || { mode: "stage", roundIndex: 0, stageIndex: 0 }, qualifierRounds: (sourceState.qualifierRounds || []).map(cleanRound), finalRace: cleanFinalRace, updatedAt: sourceState.updatedAt || Date.now() };
    }

    function getStageResultRows() {
      const meta = getTournamentMeta();
      const rows = [];
      state.qualifierRounds.forEach(round => (round.stages || []).forEach(stage => stage.groups.forEach(group => group.slots.forEach(player => {
        const crowRank = (round.crowFinalists || []).find(item => item.id === player.id)?.crowRank || "";
        const isFinalist = round.finalist && round.finalist.id === player.id;
        const isAdvanced = (group.advanceIds || []).includes(player.id);
        const score = stage.type === "points" && !player.isEmptyLane ? Number((group.points || {})[player.id] ?? 0) : "";
        const ident = resolvePlayerIdentity(player);
        let result = player.isEmptyLane ? "빈 레인" : stage.type === "points" ? "포인트" : crowRank ? `9강 ${crowRank}위` : isFinalist ? "최종결승진출" : isAdvanced ? "진출" : "탈락";
        rows.push({ ...meta, 경기장ID: currentVenueId(), 선수ID: ident.playerId, 실명: ident.realName, 연락처: ident.contact, 차수: round.title, 단계: stage.name, 조: group.name, 레인: `${player.lane}LANE`, 선수명: player.name, 팀명: player.team || "", 점수: score, 결과: result, 비고: stage.type || "" });
      }))));
      if (state.finalRace) getFinalGroups().forEach(group => group.slots.forEach(player => {
        const selected = (group.advanceIds || []).includes(player.id);
        const ident = resolvePlayerIdentity(player);
        const finalType = state.finalRace.type === "crowSemi" ? "9강준결" : "FINAL";
        rows.push({ ...meta, 경기장ID: currentVenueId(), 선수ID: ident.playerId, 실명: ident.realName, 연락처: ident.contact, 차수: state.finalRace.name || "최종 결승", 단계: finalType, 조: group.name, 레인: `${player.lane}LANE`, 선수명: player.name, 팀명: player.team || "", 점수: "", 결과: player.isEmptyLane ? "빈 레인" : selected ? (state.finalRace.type === "crowSemi" ? "결승진출" : "최종우승") : "결승참가", 비고: state.finalRace.type || "final" });
      }));
      return rows;
    }

    function renderReadOnlyPayload(payload) {
      const finalGroups = payload.finalRace ? (Array.isArray(payload.finalRace.groups) ? payload.finalRace.groups : [payload.finalRace.group].filter(Boolean)) : [];
      const finalHtml = finalGroups.length ? `<section class="final-box"><h2>${escapeHtml(payload.finalRace?.name || "최종 결승")}</h2><div class="groups" style="grid-template-columns:${finalGroups.length > 1 ? "repeat(3,minmax(0,1fr))" : "1fr"};">${finalGroups.map(group => renderReadOnlyGroup(group, true)).join("")}</div></section>` : "";
      const qualifierHtml = (payload.qualifierRounds || []).map(round => `<section class="round-card"><div class="round-head"><div><div class="round-title"><h2>${escapeHtml(round.title)}</h2><span class="round-badge">${round.finalist ? `확정 · ${escapeHtml(round.finalist.name)}` : "진행"}</span></div></div></div>${(round.stages || []).map(stage => `<details class="history-stage" open><summary>${escapeHtml(stage.name)}</summary><div class="history-stage-body">${(stage.groups || []).map(group => renderReadOnlyGroup(group)).join("")}</div></details>`).join("")}</section>`).join("");
      app.innerHTML = `<div class="mobile-view"><header class="header" style="margin-bottom:16px;"><div class="header-copy"><div class="brand-line"><div class="eyebrow">MINI4WD TOURNAMENT MAKER</div><div class="maker">MOBILE LIVE</div></div><h1>${escapeHtml(payload.tournament?.name || "대회명 미입력")}</h1><p class="desc">${matchModeLabel(payload.settings?.matchMode)} · ${payload.settings?.laneCount || 3}레인 · ${escapeHtml(payload.tournament?.venue || "")}</p></div>${logoMarkup("header-logo")}</header>${finalHtml}${qualifierHtml}</div>`;
    }

    function shareMobileView() {
      const url = `${location.origin}${location.pathname}#view=live-list`;
      navigator.clipboard?.writeText(url).then(() => alert("모바일 LIVE 로비 링크를 복사했습니다. 카톡에 붙여넣어 공유하세요.")).catch(() => prompt("모바일 LIVE 로비 링크를 복사하세요.", url));
    }

    function watchFirebaseState(viewType) {
      const db = initFirebase();
      if (!db) return;
      const tournamentId = getCurrentTournamentId();
      let received = false;
      const ref = db.ref(`${PUBLIC_LIVE_PATH}/${tournamentId}/state`);
      const fallback = viewType === "mobile-live" ? setTimeout(() => { if (!received) renderLiveLobbyPage(); }, 4500) : null;
      ref.on("value", snapshot => {
        const payload = snapshot.val();
        if (!payload) return;
        received = true;
        if (fallback) clearTimeout(fallback);
        if (viewType === "tv-live") { tvState = payload; document.body.classList.add("tv-mode"); renderTvStage(); return; }
        if (viewType === "mobile-live") { renderTvSnapshot(payload, "mobile"); return; }
      });
    }
    /* boot deferred to v49 final call */



    /* v49 live lobby realtime + final stabilization overrides */
    let __liveLobbyRefsV49 = [];
    let __watchRefsV49 = [];

    function stopLiveLobbyRealtimeV49() {
      (__liveLobbyRefsV49 || []).forEach(item => {
        try { item.ref.off("value", item.cb); } catch (error) {}
      });
      __liveLobbyRefsV49 = [];
    }

    function stopPublicLiveWatchV49() {
      (__watchRefsV49 || []).forEach(item => {
        try { item.ref.off("value", item.cb); } catch (error) {}
      });
      __watchRefsV49 = [];
    }

    function mergeVenueArraysV49(...arrays) {
      const map = new Map();
      arrays.flat().forEach(item => {
        if (!item) return;
        const name = String(item.venueName || item.name || item.displayName || item.venueId || "").trim();
        const id = String(item.venueId || item.id || normalizeKey(name) || "").trim();
        if (!name && !id) return;
        if (id === "all" || name === "전체") return;
        const key = normalizeKey(name || id);
        const current = map.get(key) || { venueId: id || key, venueName: name || id, updatedAt: item.updatedAt || "" };
        current.venueId = current.venueId || id || key;
        current.venueName = name || current.venueName || id;
        current.updatedAt = item.updatedAt || current.updatedAt || "";
        map.set(key, current);
      });
      return Array.from(map.values()).sort((a,b)=>String(a.venueName).localeCompare(String(b.venueName), "ko"));
    }

    function buildLobbySlots(venues = [], tournaments = [], records = []) {
      const venueMap = new Map();
      const venueKey = item => normalizeKey(item?.venueName || item?.venueId || "");
      venues.forEach(venue => {
        const key = venueKey(venue);
        if (!key) return;
        venueMap.set(key, { venueId: venue.venueId || key, venueName: venue.venueName || venue.venueId || key, approved: true });
      });
      tournaments.forEach(item => {
        const key = venueKey(item);
        if (!key) return;
        if (!venueMap.has(key)) venueMap.set(key, { venueId: item.venueId || key, venueName: item.venueName || item.venueId || key, approved: false });
      });
      records.forEach(record => {
        const key = venueKey(record);
        if (!key) return;
        if (!venueMap.has(key)) venueMap.set(key, { venueId: record.venueId || key, venueName: record.venueName || record.venueId || key, approved: false });
      });

      const liveByVenue = new Map();
      tournaments.forEach(item => {
        const key = venueKey(item);
        if (!key) return;
        const current = liveByVenue.get(key);
        if (!current || toTimeValue(item.updatedAt) > toTimeValue(current.updatedAt)) liveByVenue.set(key, item);
      });

      const latestRecordByVenue = new Map();
      records.forEach(record => {
        const key = venueKey(record);
        if (!key) return;
        const current = latestRecordByVenue.get(key);
        if (!current || normalizeRecentTime(record) > normalizeRecentTime(current)) latestRecordByVenue.set(key, record);
      });

      const cards = Array.from(venueMap.entries()).map(([key, venue]) => {
        const liveItem = liveByVenue.get(key);
        const recentRecord = latestRecordByVenue.get(key);
        const status = liveItem ? effectiveLiveStatus(liveItem) : recentRecord ? "recent" : "waiting";
        const recentAt = recentRecord ? normalizeRecentTime(recentRecord) : 0;
        const updatedAt = liveItem ? toTimeValue(liveItem.updatedAt) : recentAt;
        return {
          id: liveItem?.id || "",
          venueId: venue.venueId,
          venueName: venue.venueName,
          tournamentName: liveItem?.tournamentName || recentRecord?.tournamentName || "대기중",
          raceClass: normalizeRaceClassName(liveItem?.raceClass || recentRecord?.raceClass || ""),
          status,
          updatedAt,
          recentAt,
          approved: venue.approved
        };
      });

      cards.sort((a, b) => {
        const rank = item => item.status === "running" ? 0 : (item.updatedAt || item.recentAt) ? 1 : 2;
        return rank(a) - rank(b) || Number(b.updatedAt || b.recentAt || 0) - Number(a.updatedAt || a.recentAt || 0) || String(a.venueName).localeCompare(String(b.venueName), "ko");
      });

      const slots = cards.slice(0, LIVE_LOBBY_SLOT_COUNT);
      while (slots.length < LIVE_LOBBY_SLOT_COUNT) {
        slots.push({ empty: true, venueId: `empty-${slots.length + 1}`, venueName: `빈 슬롯 ${slots.length + 1}`, tournamentName: "경기장 계정 승인 시 자동 표시", raceClass: "", status: "empty", updatedAt: 0 });
      }
      return slots;
    }

    function renderLiveLobbyWithData(tournaments = [], records = [], venues = []) {
      document.body.classList.remove("tv-mode");
      const venueCards = buildLobbySlots(venues, tournaments, records);
      const recent = [...records].sort((a,b) => normalizeRecentTime(b) - normalizeRecentTime(a)).slice(0, 12);
      const liveCount = venueCards.filter(item => item.status === "running").length;
      const recentCount = venueCards.filter(item => item.status === "recent" || item.status === "stale").length;
      const waitingCount = venueCards.filter(item => item.status === "waiting").length;
      const nowText = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      const cardHtml = venueCards.map(item => {
        const live = item.status === "running";
        const recentState = item.status === "recent" || item.status === "stale";
        const empty = item.empty || item.status === "empty";
        const timeText = item.updatedAt ? new Date(item.updatedAt).toLocaleString("ko-KR") : "업데이트 없음";
        const metaLine = empty ? item.tournamentName : `${item.tournamentName}<br>${item.raceClass ? `${escapeHtml(item.raceClass)} · ` : ""}${escapeHtml(timeText)}`;
        return `<article class="live-lobby-card ${live ? "live-on" : ""} ${recentState ? "live-recent" : ""} ${empty ? "live-empty" : ""}"><div><span class="live-status ${live ? "on" : recentState ? "recent" : empty ? "empty" : ""}">${liveStatusLabel(item.status)}</span><h3>${escapeHtml(item.venueName)}</h3><div class="live-lobby-meta">${metaLine}</div></div><button class="${live ? "primary" : "ghost"}" ${live ? "" : "disabled"} onclick="location.hash='view=mobile-live&t=${encodeURIComponent(item.id)}'; bootV33();">${live ? "대진표 보기" : "대기중"}</button></article>`;
      }).join("");
      const historyHtml = recent.map(record => `<div class="history-public-row"><div><b>${escapeHtml(record.venueName || record.venueId || "경기장")}</b><span>${escapeHtml(normalizeRaceClassName(record.raceClass))}</span></div><div><b>${escapeHtml(record.tournamentName || "대회명 미입력")}</b><span>${escapeHtml(record.endedAtISO ? new Date(record.endedAtISO).toLocaleString("ko-KR") : record.createdAt ? new Date(record.createdAt).toLocaleString("ko-KR") : "")}</span></div><div><b>${escapeHtml(getRecordWinnerText(record))}</b><span>우승/상위 결과</span></div></div>`).join("");
      app.innerHTML = `<div class="mobile-view live-lobby-shell"><header class="header"><div class="header-copy"><div class="brand-line"><div class="eyebrow">MINI4WD TOURNAMENT MAKER</div><div class="maker">LIVE LOBBY</div></div><h1>경기장 LIVE</h1><p class="desc">LIVE ON 경기장을 선택하면 현재 모바일 대진표로 이동합니다. 3시간 이상 갱신이 없으면 자동 대기중으로 표시됩니다.</p></div>${logoMarkup("header-logo")}</header><section class="card"><div class="live-lobby-topbar"><div><h2 style="margin:0 0 6px;">경기장별 LIVE 상태</h2><div class="meta">승인된 경기장 계정 기준 20개 슬롯 · 실시간 반영 · ${escapeHtml(nowText)} 기준</div></div><button class="ghost" onclick="renderLiveLobbyPage()">새로고침</button></div><div class="live-lobby-summary"><span class="pill">LIVE ${liveCount}</span><span class="pill">최근/종료 ${recentCount}</span><span class="pill">대기 ${waitingCount}</span></div><div class="live-lobby-grid" style="margin-top:12px;">${cardHtml}</div></section><section class="card"><h2>최근 경기 히스토리</h2><div class="history-public-list">${historyHtml || `<div class="hint">최근 경기 기록이 없습니다.</div>`}</div></section></div>`;
    }

    function renderLiveLobbyPage() {
      document.body.classList.remove("tv-mode");
      stopPublicLiveWatchV49();
      app.innerHTML = `<div class="mobile-view"><div class="empty"><div><h2>LIVE 로비 불러오는 중</h2><p>경기장 LIVE 상태를 실시간으로 연결합니다.</p></div></div></div>`;
      const db = initFirebase();
      if (!db) { renderLiveLobbyWithData([], loadLocalResultLogs().map(makePublicRecord), []); return; }
      stopLiveLobbyRealtimeV49();
      const cache = { live: {}, history: {}, venues: {}, directory: {} };
      const draw = () => {
        const tournaments = normalizeLobbyTournaments(cache.live || {});
        const records = cache.history ? Object.values(cache.history) : loadLocalResultLogs().map(makePublicRecord);
        const venues = mergeVenueArraysV49(normalizePublicVenues(cache.venues || {}), normalizePublicVenues(cache.directory || {}));
        renderLiveLobbyWithData(tournaments, records, venues);
      };
      const bind = (key, path) => {
        const ref = db.ref(path);
        const cb = snapshot => { cache[key] = snapshot.val() || {}; draw(); };
        ref.on("value", cb, error => { console.warn(`live lobby ${path} watch failed`, error); cache[key] = {}; draw(); });
        __liveLobbyRefsV49.push({ ref, cb });
      };
      bind("live", PUBLIC_LIVE_PATH);
      bind("history", PUBLIC_HISTORY_PATH);
      bind("venues", PUBLIC_VENUES_PATH);
      if (typeof PUBLIC_VENUE_DIRECTORY_PATH !== "undefined") bind("directory", PUBLIC_VENUE_DIRECTORY_PATH);
    }

    function watchFirebaseState(viewType) {
      const db = initFirebase();
      if (!db) return;
      stopLiveLobbyRealtimeV49();
      stopPublicLiveWatchV49();
      const tournamentId = getCurrentTournamentId();
      let received = false;
      const ref = db.ref(`${PUBLIC_LIVE_PATH}/${tournamentId}/state`);
      const fallback = viewType === "mobile-live" ? setTimeout(() => { if (!received) renderLiveLobbyPage(); }, 4500) : null;
      const cb = snapshot => {
        const payload = snapshot.val();
        if (!payload) return;
        received = true;
        if (fallback) clearTimeout(fallback);
        if (viewType === "tv-live") { tvState = payload; document.body.classList.add("tv-mode"); renderTvStage(); return; }
        if (viewType === "mobile-live") { renderTvSnapshot(payload, "mobile"); return; }
      };
      ref.on("value", cb, error => { console.warn("public live watch failed", error); if (viewType === "mobile-live") renderLiveLobbyPage(); });
      __watchRefsV49.push({ ref, cb });
    }



    /* v50 final fixes: public live publishing, realtime lobby, dashboard admin scope */
    function forcePublishPublicLiveV50(reason = "수동 LIVE 동기화") {
      try {
        ensureStateDefaults();
        state.updatedAt = Date.now();
        state.activeRoundIndex = activeRoundIndex;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(exportState()));
        const db = initFirebase();
        if (!db) return false;
        const privateState = exportState();
        privateState.updatedAt = Date.now();
        const publicLive = makePublicLivePayload(privateState);
        db.ref(`${PUBLIC_LIVE_PATH}/${getCurrentTournamentId()}`).set(publicLive).catch(error => console.warn(`public live sync failed: ${reason}`, error));
        db.ref(`tournaments/${getCurrentTournamentId()}/updatedAt`).set(firebase.database.ServerValue.TIMESTAMP).catch(() => {});
        return true;
      } catch (error) {
        console.warn("forcePublishPublicLiveV50 failed", error);
        return false;
      }
    }

    function mobileLobbyUrlV50() {
      return `${location.origin}${location.pathname}#view=live-list`;
    }

    function shareMobileView() {
      forcePublishPublicLiveV50("MOBILE LINK");
      const url = mobileLobbyUrlV50();
      navigator.clipboard?.writeText(url).then(() => alert("모바일 LIVE 로비 링크를 복사했습니다."))
        .catch(() => prompt("모바일 LIVE 로비 링크", url));
    }

    function copyLiveLink() {
      forcePublishPublicLiveV50("모바일 링크 복사");
      const url = mobileLobbyUrlV50();
      navigator.clipboard?.writeText(url).then(() => alert("모바일 LIVE 로비 링크를 복사했습니다."))
        .catch(() => prompt("모바일 LIVE 로비 링크", url));
    }

    const __openTvViewBaseV50 = typeof openTvView === "function" ? openTvView : null;
    function openTvView() {
      forcePublishPublicLiveV50("TV LIVE");
      if (__openTvViewBaseV50) return __openTvViewBaseV50();
      window.open(makeLiveTvUrl(), "_blank", "noopener,noreferrer");
    }

    function stopLiveLobbyRealtimeV50() {
      if (typeof stopLiveLobbyRealtimeV49 === "function") stopLiveLobbyRealtimeV49();
      if (typeof stopPublicLiveWatchV49 === "function") stopPublicLiveWatchV49();
    }

    function renderLiveLobbyPage() {
      document.body.classList.remove("tv-mode");
      stopLiveLobbyRealtimeV50();
      app.innerHTML = `<div class="mobile-view"><div class="empty"><div><h2>LIVE 로비 연결중</h2><p>경기장 LIVE 상태를 실시간으로 불러오는 중입니다.</p></div></div></div>`;
      const db = initFirebase();
      if (!db) { renderLiveLobbyWithData([], loadLocalResultLogs().map(makePublicRecord), []); return; }

      const cache = { live: {}, history: {}, venues: {}, directory: {} };
      let loaded = { live:false, history:false, venues:false, directory:false };
      let drawTimer = null;
      const draw = () => {
        clearTimeout(drawTimer);
        drawTimer = setTimeout(() => {
          const tournaments = normalizeLobbyTournaments(cache.live || {});
          const records = cache.history && Object.keys(cache.history).length ? Object.values(cache.history) : loadLocalResultLogs().map(makePublicRecord);
          const venues = mergeVenueArraysV49(normalizePublicVenues(cache.venues || {}), normalizePublicVenues(cache.directory || {}));
          renderLiveLobbyWithData(tournaments, records, venues);
        }, 80);
      };
      const bind = (key, path) => {
        const ref = db.ref(path);
        const cb = snapshot => {
          cache[key] = snapshot.val() || {};
          loaded[key] = true;
          draw();
        };
        ref.on("value", cb, error => {
          console.warn(`live lobby watch failed: ${path}`, error);
          cache[key] = {};
          loaded[key] = true;
          draw();
        });
        if (typeof __liveLobbyRefsV49 !== "undefined") __liveLobbyRefsV49.push({ ref, cb });
      };
      bind("live", PUBLIC_LIVE_PATH);
      bind("history", PUBLIC_HISTORY_PATH);
      bind("venues", PUBLIC_VENUES_PATH);
      if (typeof PUBLIC_VENUE_DIRECTORY_PATH !== "undefined") bind("directory", PUBLIC_VENUE_DIRECTORY_PATH);
    }

    function watchFirebaseState(viewType) {
      const db = initFirebase();

      const fallback = viewType === "mobile-live" ? setTimeout(() => { if (!received) renderLiveLobbyPage(); }, 4200) : null;
      const cb = snapshot => {
        const payload = snapshot.val();
        if (!payload) return;
        received = true;
        if (fallback) clearTimeout(fallback);

        if (viewType === "mobile-live") { renderTvSnapshot(payload, "mobile"); return; }
      };
      ref.on("value", cb, error => { console.warn("public live watch failed", error); if (viewType === "mobile-live") renderLiveLobbyPage(); });
      if (typeof __watchRefsV49 !== "undefined") __watchRefsV49.push({ ref, cb });
    }

    const __renderDashboardWithRecordsBaseV50 = renderDashboardWithRecords;
    function renderDashboardWithRecords(records = []) {
      __renderDashboardWithRecordsBaseV50(records);
      const page = document.querySelector(".db-page");
      if (!page || page.querySelector(".dashboard-nav-actions")) return;
      const target = page.querySelector(".toolbar") || page.querySelector("section.card");
      if (!target) return;
      const nav = document.createElement("div");
      nav.className = "dashboard-nav-actions";
      nav.innerHTML = `<button class="ghost" onclick="history.length > 1 ? history.back() : (location.hash='', bootV33())">뒤로가기</button><button class="ghost" onclick="location.hash=''; bootV33();">홈</button><button class="ghost" onclick="dashboardFilter.venue='전체'; renderDashboardWithRecords(window.__dashboardRecords||[])">전체 경기장</button>`;
      target.parentNode.insertBefore(nav, target);
    }

    function renderDashboardPage() {
      if (!currentAuthUser) return renderLoginPage("대시보드는 로그인 후 이용할 수 있습니다.");
      if (!canViewDashboard()) return renderRestrictedPage("대시보드 권한 없음", "관리자가 대시보드 권한을 부여해야 합니다.");
      document.body.classList.remove("tv-mode");
      if (isAdminUser()) dashboardFilter.venue = "전체";
      app.innerHTML = `<div class="wrap"><div class="empty"><div><h2>대시보드 불러오는 중</h2></div></div></div>`;
      const db = initFirebase();
      const local = loadLocalResultLogs();
      if (!db) {
        window.__dashboardProfiles = {}; window.__dashboardLegacyUsers = {}; window.__dashboardPublicVenues = {}; window.__dashboardVenueDirectory = {}; window.__dashboardRecords = local;
        renderDashboardWithRecords(local);
        return;
      }
      const profilePromise = isAdminUser()
        ? db.ref(USER_PROFILE_PATH).get().then(s => s.val() || {}).catch(() => ({}))
        : Promise.resolve(currentUserProfile ? { [currentUserProfile.uid || currentAuthUser.uid]: currentUserProfile } : {});
      const legacyUserPromise = isAdminUser() ? db.ref("users").get().then(s => s.val() || {}).catch(() => ({})) : Promise.resolve({});
      const publicVenuePromise = db.ref(PUBLIC_VENUES_PATH).get().then(s => s.val() || {}).catch(() => ({}));
      const venueDirectoryPromise = db.ref(PUBLIC_VENUE_DIRECTORY_PATH).get().then(s => s.val() || {}).catch(() => ({}));
      const privateLogsPromise = (isAdminUser() ? db.ref(RESULT_LOGS_PATH) : db.ref(`${RESULT_LOGS_PATH}/${currentVenueId()}`)).get().then(s => isAdminUser() ? flattenPrivateResultLogs(s.val() || {}) : Object.values(s.val() || {})).catch(() => []);
      const publicHistoryPromise = db.ref(PUBLIC_HISTORY_PATH).get().then(s => s.val() ? Object.values(s.val()) : []).catch(() => []);
      Promise.all([privateLogsPromise, publicHistoryPromise, profilePromise, publicVenuePromise, venueDirectoryPromise, legacyUserPromise]).then(([privateLogs, publicHistory, profiles, publicVenues, venueDirectory, legacyUsers]) => {
        const merged = [...local, ...privateLogs, ...publicHistory].filter((item, idx, arr) => item && arr.findIndex(x => x && x.id === item.id) === idx);
        window.__dashboardProfiles = profiles || {};
        window.__dashboardLegacyUsers = legacyUsers || {};
        window.__dashboardPublicVenues = publicVenues || {};
        window.__dashboardVenueDirectory = venueDirectory || {};
        window.__dashboardRecords = merged;
        renderDashboardWithRecords(merged);
      }).catch(() => {
        window.__dashboardProfiles = {}; window.__dashboardLegacyUsers = {}; window.__dashboardPublicVenues = {}; window.__dashboardVenueDirectory = {}; window.__dashboardRecords = local;
        renderDashboardWithRecords(local);
      });
    }

    function syncPublicVenueDirectory() {
      if (typeof syncPublicVenuesFromProfiles === "function") return syncPublicVenuesFromProfiles();
      return false;
    }


    /* v50 single boot call */
    bootV33();

  </script>
